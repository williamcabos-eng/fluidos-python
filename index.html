elinski tiene una incertidumbre del orden del ±10 %. ¿Sigue cumpliendo tu diseño si h es un 10 % menor?<\/p><\/li>\n<li><p>Muchas guías de diseño de moldes recomiendan Re &gt; 10 000. ¿Cómo encaja con tus resultados?<\/p><\/li>\n<\/ol>\n<p>Parte 5 · Conclusiones (10 min)<\/p>\n<p>Escribe tres lecciones de la práctica (máximo cinco líneas cada una) y revisa tus predicciones de la parte 0: ¿cuáles acertaste y cuáles no?<\/p>\n<p>6. Entrega y evaluación<\/p>\n<p>Al final de la sesión, sube al aula virtual el cuaderno ejecutado con las gráficas y las respuestas escritas en las celdas correspondientes. Se valorará:<\/p>\n<ul>\n<li><p>que los cálculos sean correctos;<\/p><\/li>\n<li><p>que hayas comprobado el régimen en todo el rango de funcionamiento;<\/p><\/li>\n<li><p>cómo tratas la incertidumbre de la zona de transición;<\/p><\/li>\n<li><p>que la decisión de diseño esté justificada y tenga margen;<\/p><\/li>\n<li><p>la claridad de las gráficas y de las explicaciones.<\/p><\/li>\n<\/ul>\n<p><em>No se valora acertar las predicciones de la parte 0, sino analizar por qué fallaron.<\/em><\/p>"}, "notebook": [{"type": "markdown", "src": "# Práctica: refrigeración de un molde de inyección. ¿Laminar o turbulento?\n**Sistemas de fluidos – GITI** · Duración: 2 h\n\nEste cuaderno acompaña al guion de la práctica. Las funciones de propiedades y las correlaciones ya están programadas.\nTu trabajo está en las celdas marcadas con **`# TODO`** y en las celdas de respuesta (*Respuesta: ...*).\n\n> Antes de ejecutar cada apartado, **escribe lo que esperas que ocurra**. Después compáralo con el resultado."}, {"type": "markdown", "src": "## Datos del problema"}, {"type": "code", "src": "import numpy as np\nimport matplotlib.pyplot as plt\nfrom scipy.optimize import brentq\n\nD = 0.010            # diámetro del canal taladrado (m)\nL = 3.0              # longitud de un circuito (m)\nK_TOT = 6.0          # suma de coeficientes de pérdidas menores\nN_CIRC = 8           # circuitos iguales en paralelo\nQ_MAX = 5.0          # caudal máximo por circuito que da el termorregulador (L/min)\nT_MIN, T_MAX = 20.0, 70.0      # rango de temperaturas de consigna (°C)\nT_NOM = 45.0                   # temperatura nominal (°C)\nH_MIN = 4000.0                 # coeficiente de convección mínimo exigido (W/m²K)\nRE_LAM, RE_TURB = 2300, 4000   # límites \"de libro\"\nCP = 4180.0                    # calor específico del agua (J/kg K)\nETA = 0.6                      # rendimiento de la bomba del termorregulador\nA = np.pi * D**2 / 4"}, {"type": "markdown", "src": "## Propiedades del agua (no hace falta modificar)"}, {"type": "code", "src": "def rho(T):  # densidad (kg/m³), T en °C\n    return 1000 * (1 - (T + 288.9414) / (508929.2 * (T + 68.12963)) * (T - 3.9863)**2)\n\ndef mu(T):   # viscosidad dinámica (Pa·s), ecuación de Vogel\n    return 2.414e-5 * 10**(247.8 / (T + 273.15 - 140))\n\ndef k(T):    # conductividad térmica (W/m K)\n    Tr = (T + 273.15) / 298.15\n    return 0.6065 * (-1.48445 + 4.12292*Tr - 1.63866*Tr**2)\n\ndef Pr(T):\n    return mu(T) * CP / k(T)\n\nfor T in (20, 45, 70):\n    print(f\"{T} °C: rho = {rho(T):.1f} kg/m³, mu = {mu(T)*1e3:.3f} mPa·s, k = {k(T):.3f} W/mK, Pr = {Pr(T):.2f}\")"}, {"type": "markdown", "src": "## Correlaciones (no hace falta modificar)"}, {"type": "code", "src": "def f_lam(Re):            # factor de fricción laminar\n    return 64 / Re\n\ndef f_turb(Re):           # Colebrook, tubo liso\n    return brentq(lambda f: 1/np.sqrt(f) + 2*np.log10(2.51/(Re*np.sqrt(f))), 1e-4, 1)\n\ndef Nu_lam(Re, Pr_):      # laminar desarrollado, temperatura de pared constante\n    return 3.66\n\ndef Nu_turb(Re, Pr_):     # Gnielinski: válida para 3000 < Re < 5e6 y 0.5 < Pr < 2000\n    f = f_turb(Re)\n    return (f/8)*(Re - 1000)*Pr_ / (1 + 12.7*np.sqrt(f/8)*(Pr_**(2/3) - 1))"}, {"type": "markdown", "src": "## Parte 0 · Predicciones (10 min)\nResponde **antes** de calcular nada:\n1. Si fijamos el caudal para que Re = 4000 a 45 °C, ¿en qué régimen estará el flujo a 20 °C? ¿Y a 70 °C?\n2. Con el caudal fijo, al calentar el agua, ¿la pérdida de presión aumenta o disminuye? ¿Siempre?\n3. ¿Basta con que el flujo sea turbulento para que el molde se refrigere bien?\n\n*Respuesta:*"}, {"type": "markdown", "src": "## Parte 1 · Diseño \"de manual\" (20 min)\nUn criterio habitual es \"basta con que el flujo sea turbulento (Re > 4000)\". Calcula el caudal por circuito que da\nRe = 4000 a la temperatura nominal de 45 °C, y el coeficiente de convección *h* en esas condiciones."}, {"type": "code", "src": "# TODO: velocidad y caudal (L/min) para Re = RE_TURB a T_NOM\nV1 = ...\nQ1 = ...            # L/min\n# TODO: coeficiente de convección a T_NOM con Gnielinski\nh1 = ...\nprint(f\"Q1 = {Q1:.2f} L/min, h(45 °C) = {h1:.0f} W/m²K (exigido {H_MIN:.0f})\")"}, {"type": "markdown", "src": "*Respuesta: ¿cumple el requisito de h? ¿Qué te dice esto sobre la regla de partida?*"}, {"type": "markdown", "src": "## Parte 2 · Barrido en temperatura (35 min)\nCompleta la función `estado(Q, T)`. En la zona de transición (2300 < Re < 4000) no hay una correlación fiable,\nasí que la función debe devolver **dos cotas**: la laminar y la turbulenta (para *h*, usa Gnielinski con `max(Re, 3000)`)."}, {"type": "code", "src": "def estado(Qlmin, T):\n    \"\"\"Devuelve Re, régimen, h_min, h_max (W/m²K), dp_min, dp_max (Pa).\"\"\"\n    V = Qlmin / 60000 / A\n    Re = ...                                   # TODO\n    dyn = rho(T) * V**2 / 2\n    h_l = Nu_lam(Re, Pr(T)) * k(T) / D\n    dp_l = (f_lam(Re)*L/D + K_TOT) * dyn\n    if Re < RE_LAM:\n        return Re, \"laminar\", h_l, h_l, dp_l, dp_l\n    h_t = ...                                  # TODO (Gnielinski con max(Re, 3000))\n    dp_t = ...                                 # TODO\n    if Re < RE_TURB:\n        return Re, \"transición\", h_l, h_t, min(dp_l, dp_t), max(dp_l, dp_t)\n    return Re, \"turbulento\", h_t, h_t, dp_t, dp_t\n\nfor T in (20, 30, 45, 60, 70):\n    Re, reg, h_a, h_b, *_ = estado(Q1, T)\n    print(f\"{T:3d} °C: Re = {Re:6.0f} ({reg:10s}) h = {h_a:6.0f} – {h_b:6.0f} W/m²K\")"}, {"type": "code", "src": "# TODO: dibuja h(T) entre 15 y 75 °C para Q1 (línea = cota inferior, banda = zona de transición)\n#       y la línea horizontal H_MIN. Sombrea el rango de funcionamiento 20–70 °C.\nT = np.linspace(15, 75, 241)"}, {"type": "code", "src": "# TODO: con Q = 1.0 L/min, dibuja Δp(T) (cotas de estado) y, en la misma gráfica,\n#       la Δp que se obtendría suponiendo SIEMPRE flujo laminar."}, {"type": "markdown", "src": "*Respuesta: ¿por debajo de qué temperatura deja el flujo de ser claramente turbulento? ¿Por qué Δp puede aumentar al calentar el agua?*"}, {"type": "markdown", "src": "## Parte 3 · Rediseño (30 min)\nBusca el **menor caudal**, múltiplo de 0.5 L/min, que garantice *h* ≥ H_MIN en **todo** el rango 20–70 °C\n(usa la cota inferior de *h*). Comprueba que no supera Q_MAX y calcula el caudal total del termorregulador y la\npotencia de bombeo con el Δp más desfavorable."}, {"type": "code", "src": "Ts = np.linspace(T_MIN, T_MAX, 51)\n# TODO: bucle sobre los caudales candidatos"}, {"type": "markdown", "src": "*Respuesta: caudal elegido, ¿dejarías margen? ¿Cuánto y por qué?*"}, {"type": "markdown", "src": "## Parte 4 · Sensibilidad y validez de las hipótesis (15 min)\n1. *Nu* = 3.66 supone flujo térmicamente desarrollado. La longitud de entrada térmica laminar es\n   *L*ₜ ≈ 0.05·Re·Pr·*D*. Calcúlala para el diseño de la parte 1 a 20 °C y compárala con *L*. Con la correlación de\n   Sieder–Tate, *Nu* ≈ 1.86 (Re·Pr·*D*/*L*)^(1/3), ¿cambia la conclusión?\n2. La correlación de Gnielinski tiene una incertidumbre del orden del ±10 %. ¿Sigue cumpliendo tu diseño si *h* es un 10 % menor?\n3. Muchas guías de diseño de moldes recomiendan Re > 10 000. ¿Cómo encaja con tus resultados?"}, {"type": "code", "src": "# TODO"}, {"type": "markdown", "src": "*Respuesta:*"}, {"type": "markdown", "src": "## Parte 5 · Conclusiones (10 min)\nEscribe **tres lecciones** de esta práctica (máximo cinco líneas cada una). Revisa tus predicciones de la parte 0:\n¿cuáles acertaste y cuáles no?\n\n*Respuesta:*"}]}</script>

  PASOS.push("fallo: " + det);
  if (modoHilo) {
    // Plan B: algunos navegadores (Safari) no arrancan Python en un hilo aparte; se intenta en la propia página
    modoHilo = false; PASOS.push("→ se prueba a ejecutar Python en la propia página");
    try { worker && worker.terminate(); } catch (e) {}
    return arrancaPython();
  }
  estado("", "Python no ha podido arrancar");
  const m = $("#main");
  m.prepend(el("div", { class: "aviso" },
    el("p", { text: "No se ha podido arrancar Python en este navegador. Pruebe a recargar la página o use Chrome, Edge o Firefox. Si quiere avisar del problema, copie este registro:" }),
    el("pre", { class: "texto", text: PASOS.join("\n") })));
}
let FUENTES = null;
function fuentes() {
  // El código de Python se descarga con fetch y se ejecuta como texto: así no depende de que el navegador
  // deje cargar <script src> o Workers desde los ficheros de la página (Safari no lo permite aquí).
  if (!FUENTES) FUENTES = Promise.all(["pyodide/pyodide.js.txt", "pyodide/pyodide.asm.js.txt", "worker.js.txt"].map((f) =>
    fetch(BASE + f).then((r) => { if (!r.ok) throw new Error(f + ": " + r.status); return r.text(); },
                         (e) => { throw new Error("descarga de " + f + ": " + (e && e.message || e)); })));
  return FUENTES;
}
function arrancaPython() {
  pyListo = false;
  estado("carga", "Preparando Python… (la primera vez descarga unos 20 MB)");
  const cola = []; let real = null;
  // objeto intermedio: guarda los mensajes hasta que el hilo (o la página) está preparado
  worker = { onmessage: null, onerror: null, postMessage: (m) => real ? real.postMessage(m) : cola.push(m), terminate: () => real && real.terminate() };
  const conecta = (w) => {
    real = w;
    w.onmessage = (e) => worker.onmessage && worker.onmessage(e);
    w.onerror = (e) => worker.onerror && worker.onerror(e);
    cola.splice(0).forEach((m) => w.postMessage(m));
  };
  PASOS.push("navegador: " + navigator.userAgent);
  PASOS.push("descargando el código de Python…");
  fuentes().then(([pyjs, asmjs, wjs]) => {
    PASOS.push("descargado: " + [pyjs, asmjs, wjs].map((t) => t.length).join(", ") + " caracteres");
    if (modoHilo) {
      PASOS.push("creando el hilo…");
      let w;
      try { w = new Worker(URL.createObjectURL(new Blob([pyjs, "\n", asmjs, "\n", wjs], { type: "text/javascript" }))); }
      catch (e) { return fallaArranque("no se puede crear el hilo: " + e); }
      conecta(w);
      const n0 = PASOS.length;
      setTimeout(() => { if (modoHilo && real === w && !pyListo && PASOS.length === n0) fallaArranque("el hilo no responde"); }, 15000);
    } else {
      conecta(hiloEnPagina(pyjs, asmjs, wjs));
    }
  }).catch((e) => { PASOS.push("error: " + (e && e.message || e) + (e && e.stack ? " · " + e.stack : "")); modoHilo = false; fallaArranque("no se ha podido preparar Python"); });
  worker.onmessage = (e) => recibe(e.data.kind, e.data.data);
  worker.onerror = (e) => {
    e.preventDefault && e.preventDefault();
    fallaArranque([e.message, e.filename && (e.filename + ":" + e.lineno)].filter(Boolean).join(" · ") || "sin detalles");
  };
  worker.postMessage({ type: "init", base: BASE, folders: CAT.folders });
}
// Ejecuta worker.js en la propia página, con la misma interfaz que un Worker (sin poder pararlo a mitad).
function hiloEnPagina(pyjs, asmjs, wjs) {
  const fake = { onmessage: null, onerror: null, _h: null, terminate() { location.reload(); } };
  const salida = (msg) => setTimeout(() => fake.onmessage && fake.onmessage({ data: msg }), 0);
  const pend = [];
  fake.postMessage = (msg) => fake._h ? fake._h({ data: msg }) : pend.push(msg);
  try {
    for (const txt of [pyjs, asmjs]) { const s = document.createElement("script"); s.textContent = txt; document.head.append(s); }
    if (typeof window.loadPyodide !== "function" || typeof window._createPyodideModule !== "function") throw new Error("el navegador no ha ejecutado el código de Python");
    const _f = window.fetch.bind(window);
    window.fetch = (u, o) => { let s = (u instanceof Request) ? u.url : String(u); if (/\.(whl|zip)$/.test(s)) s += ".wasm"; return _f(s, o); };
    const selfFalso = {
      postMessage: salida, fetch: window.fetch, addEventListener() {},
      set onmessage(f) { fake._h = f; pend.splice(0).forEach((m) => f({ data: m })); }, get onmessage() { return fake._h; },
    };
    new Function("self", "importScripts", "loadPyodide", wjs)(selfFalso, () => {}, window.loadPyodide);
    window.pyPost = selfFalso.pyPost;
  } catch (e) { PASOS.push("en la página: " + e); setTimeout(() => fake.onerror && fake.onerror({ message: String(e) }), 0); }
  return fake;
}
function recibe(kind, data) {
  if (kind === "paso") { PASOS.push(data); return; }
  if (kind === "fallo-init") return fallaArranque(data);
  if (kind === "listo") { if (!modoHilo) $("#main").prepend(el("p", { class: "aviso", text: "Este navegador ejecuta Python en la propia página: mientras calcula, la página no responde y «Parar» recarga la página." })); }
  if (kind === "listo") { pyListo = true; estado("listo", "Python listo"); actualizaBotones(); return; }
  if (kind === "estado") { if (ocupado) estado("ejec", data); return; }
  if (kind === "stdout") return escribe(data, false);
  if (kind === "stderr") return escribe(data, !/Warning/.test(data) ? true : false);
  if (kind === "error") return escribe(data + "\n", true);
  if (kind === "figura" || kind === "fotograma") return figura(JSON.parse(data), kind === "fotograma");
  if (kind === "fin") {
    ocupado = false; clearInterval(reloj);
    if (!pyListo) return;
    const s = data.t ? ` en ${data.t.toFixed(1)} s` : "";
    estado("listo", data.ok ? "Terminado" + s : "Terminado con errores");
    if (destino && destino.fin) destino.fin(data);
    actualizaBotones();
  }
}
function ejecuta(opts) {
  if (!pyListo || ocupado) return;
  ocupado = true; tInicio = performance.now();
  destino = opts.destino;
  destino.texto.textContent = ""; destino.figs.replaceChildren(); destino.slots = {};
  estado("ejec", "Ejecutando…");
  reloj = setInterval(() => { const t = $("#tEjec"); if (t) t.textContent = ((performance.now() - tInicio) / 1000).toFixed(0) + " s"; }, 500);
  worker.postMessage({ type: "run", folder: opts.folder, file: opts.file, code: opts.code, files: opts.files, notebook: !!opts.notebook });
  actualizaBotones();
}
function para() {
  if (!ocupado) return;
  worker.terminate(); ocupado = false; clearInterval(reloj);
  escribe("\n■ Ejecución detenida.\n", true);
  arrancaPython(); actualizaBotones();
}
function escribe(txt, err) {
  if (!destino) { if (err) $("#main").prepend(el("p", { class: "aviso", text: txt })); return; }
  const s = document.createElement("span"); if (err) s.className = "err"; s.textContent = txt;
  destino.texto.append(s); destino.texto.hidden = false;
  destino.texto.scrollTop = destino.texto.scrollHeight;
}
function figura(d, esFotograma) {
  if (!destino) return;
  let slot = destino.slots[d.slot];
  if (!slot || slot.cerrado) {
    const img = el("img", { alt: "Figura " + (Object.keys(destino.slots).length + 1) });
    const cap = el("figcaption");
    const f = el("figure", { class: "fig" }, img, cap);
    destino.figs.append(f);
    slot = destino.slots[d.slot] = { img, cap, frames: [], cerrado: false };
  }
  const src = "data:image/png;base64," + d.png;
  slot.img.src = src;
  slot.frames.push(src);
  if (!esFotograma) { slot.cerrado = true; if (slot.frames.length > 2) reproductor(slot); }
}
function reproductor(slot) {
  const n = slot.frames.length;
  const r = el("input", { type: "range", min: 0, max: n - 1, value: n - 1, "aria-label": "Fotograma" });
  let timer = null;
  const b = el("button", { class: "btn", text: "▶ Repetir" });
  r.addEventListener("input", () => { slot.img.src = slot.frames[+r.value]; });
  b.addEventListener("click", () => {
    if (timer) { clearInterval(timer); timer = null; b.textContent = "▶ Repetir"; return; }
    let i = 0; b.textContent = "■ Parar";
    timer = setInterval(() => { slot.img.src = slot.frames[i]; r.value = i; i++; if (i >= n) { clearInterval(timer); timer = null; b.textContent = "▶ Repetir"; } }, 120);
  });
  slot.cap.replaceChildren(b, r, el("span", { text: n + " fotogramas" }));
}

// ------------------------------------------------------------------ catálogo
function pintaCatalogo(filtro = "") {
  const f = filtro.trim().toLowerCase();
  const lista = $("#lista"); lista.replaceChildren();
  for (const g of CAT.groups) {
    const its = g.items.filter((i) => !f || (g.title + " " + i.title + " " + i.desc + " " + (i.main || "")).toLowerCase().includes(f));
    if (!its.length) continue;
    const gr = el("div", { class: "grupo" }, el("h2", { text: g.title }));
    for (const i of its) {
      const a = el("a", { href: "#" + i.id }, i.title);
      if (i.prof) a.append(el("span", { class: "sol", text: "solución" }));
      a.append(el("small", { text: i.desc }));
      if (actual && actual.id === i.id) a.setAttribute("aria-current", "page");
      gr.append(a);
    }
    lista.append(gr);
  }
}

// ------------------------------------------------------------------ edición
const claveEd = (folder, file) => "ed:" + CAT.modo + ":" + folder + "/" + file;
function original(it, file) {
  if (file === it.main && it.code != null) return it.code;
  return (CAT.folders[it.folder] || {})[file] ?? "";
}
function textoDe(it, file) { return store.get(claveEd(it.folder, file)) ?? original(it, file); }

function editor(texto, onchange, autoalto = false) {
  const num = el("div", { class: "num", "aria-hidden": "true" });
  const ta = el("textarea", { spellcheck: "false", autocapitalize: "off", autocomplete: "off", "aria-label": "Código" });
  ta.value = texto;
  const numera = () => {
    const n = ta.value.split("\n").length;
    num.textContent = Array.from({ length: n }, (_, i) => i + 1).join("\n");
    if (autoalto) { ta.style.height = "auto"; ta.style.height = ta.scrollHeight + "px"; }
  };
  ta.addEventListener("input", () => { numera(); onchange && onchange(ta.value); });
  ta.addEventListener("scroll", () => { num.scrollTop = ta.scrollTop; });
  ta.addEventListener("keydown", (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); ta.dispatchEvent(new CustomEvent("ejecutar", { bubbles: true })); return; }
    if (e.key === "Tab") {
      e.preventDefault();
      const s = ta.selectionStart, v = ta.value;
      if (e.shiftKey) {
        const ini = v.lastIndexOf("\n", s - 1) + 1;
        const quita = v.slice(ini, ini + 4).match(/^ */)[0].length;
        ta.setRangeText("", ini, ini + quita, "end"); ta.selectionStart = ta.selectionEnd = Math.max(ini, s - quita);
      } else ta.setRangeText("    ", s, ta.selectionEnd, "end");
      ta.dispatchEvent(new Event("input"));
    } else if (e.key === "Enter" && !e.isComposing) {
      const s = ta.selectionStart, v = ta.value;
      const linea = v.slice(v.lastIndexOf("\n", s - 1) + 1, s);
      let ind = linea.match(/^ */)[0];
      if (/:\s*(#.*)?$/.test(linea)) ind += "    ";
      e.preventDefault(); ta.setRangeText("\n" + ind, s, ta.selectionEnd, "end"); ta.dispatchEvent(new Event("input"));
    }
  });
  const box = el("div", { class: "editor" }, num, ta);
  requestAnimationFrame(numera);
  box.ta = ta; box.set = (t) => { ta.value = t; numera(); };
  return box;
}

// ------------------------------------------------------------------ vistas
function abre(id) {
  const it = ITEMS[id] || CAT.groups[0].items[0];
  actual = it;
  if (pyListo && !ocupado) estado("listo", "Python listo");
  document.title = it.title + " · Fluidos en Python";
  pintaCatalogo($("#buscar").value);
  cierraMenu();
  const m = $("#main"); m.replaceChildren(); m.scrollTop = 0;
  const grupo = CAT.groups.find((g) => g.items.includes(it)).title;
  const cab = el("div", { class: "cabecera" },
    el("div", { class: "eyebrow", text: grupo }),
    el("h1", { text: it.title }),
    el("p", { text: it.desc }));
  if (it.tags.length || it.prof) {
    const et = el("div", { class: "etiquetas" });
    if (it.prof) et.append(el("span", { class: "etiqueta", text: "solución del profesor" }));
    for (const t of it.tags) et.append(el("span", { class: "etiqueta", text: t }));
    cab.append(et);
  }
  m.append(cab);
  if (it.statement && CAT.statements[it.statement]) {
    const d = el("details", { class: "enunciado" }, el("summary", { text: "Enunciado" }));
    const c = el("div", { class: "enun" }); c.innerHTML = CAT.statements[it.statement];
    d.append(c); d.open = !!it.code && window.innerWidth > 820;
    m.append(d);
  }
  if (it.notebook) return vistaCuaderno(it, m);
  vistaPrograma(it, m);
}

function vistaPrograma(it, m) {
  const ficherosCarpeta = Object.keys(CAT.folders[it.folder] || {});
  // módulos de la carpeta que importa el programa (y los que importan esos), para poder verlos y editarlos
  const mods = new Set(ficherosCarpeta.map((f) => f.replace(/\.py$/, "")));
  const usados = [];
  const busca = (txt) => {
    for (const r of txt.matchAll(/^\s*(?:from\s+(\w+)\s+import|import\s+(\w+))/gm)) {
      const n = r[1] || r[2];
      if (mods.has(n) && !usados.includes(n + ".py") && n + ".py" !== it.main) { usados.push(n + ".py"); busca(original(it, n + ".py")); }
    }
  };
  busca(textoDe(it, it.main));
  const ficheros = [it.main, ...usados];
  let fichero = it.main;
  const bRun = el("button", { class: "btn primary", id: "bRun" }, "▶ Ejecutar");
  const bStop = el("button", { class: "btn", id: "bStop" }, "■ Parar");
  const bRest = el("button", { class: "btn" }, "Restaurar original");
  const bCopy = el("button", { class: "btn" }, "Copiar código");
  const tEj = el("span", { class: "t", id: "tEjec" });
  m.append(el("div", { class: "barra" }, bRun, bStop, bRest, bCopy, tEj));

  const ed = editor(textoDe(it, fichero), (v) => store.set(claveEd(it.folder, fichero), v));
  const fbar = el("div", { class: "ficheros", role: "group", "aria-label": "Ficheros de la carpeta" });
  const pintaFicheros = () => {
    fbar.replaceChildren(...ficheros.map((f) => el("button", {
      "aria-pressed": String(f === fichero), title: f === it.main ? "Programa principal" : "Módulo de la misma carpeta",
      onclick: () => { fichero = f; ed.set(textoDe(it, f)); pintaFicheros(); },
    }, f)));
  };
  pintaFicheros();
  const codigo = el("section", { class: "caja" }, el("h3", { text: it.main + " · los cambios se guardan en este navegador" }), ficheros.length > 1 ? fbar : null, ed);
  const texto = el("pre", { class: "texto", hidden: "" });
  const figs = el("div", { style: "display:flex;flex-direction:column;gap:12px" });
  const vacio = el("p", { class: "vacio", text: pyListo ? "Pulse «Ejecutar» (o Ctrl+Enter en el editor)." : "Cuando Python esté listo, pulse «Ejecutar»." });
  const res = el("section", { class: "caja", id: "resultados" }, el("h3", { text: "Resultados" }), el("div", { class: "salida" }, vacio, texto, figs));
  m.append(el("div", { class: "trabajo" }, codigo, res));

  const lanza = () => {
    vacio.remove();
    const files = {};
    for (const f of ficheros) if (f !== it.main) { const v = store.get(claveEd(it.folder, f)); files[f] = v ?? original(it, f); }
    ejecuta({
      folder: it.folder, file: it.main, code: textoDe(it, it.main), files,
      destino: { texto, figs, fin: () => { if (window.innerWidth <= 1150) res.scrollIntoView({ behavior: "smooth", block: "start" }); } },
    });
    if (window.innerWidth <= 1150) res.scrollIntoView({ behavior: "smooth", block: "start" });
  };
  bRun.onclick = lanza;
  ed.ta.addEventListener("ejecutar", lanza);
  bStop.onclick = para;
  bRest.onclick = () => { store.del(claveEd(it.folder, fichero)); ed.set(original(it, fichero)); };
  bCopy.onclick = () => {
    navigator.clipboard.writeText(ed.ta.value).then(() => { bCopy.textContent = "Copiado"; setTimeout(() => bCopy.textContent = "Copiar código", 1500); })
      .catch(() => { ed.ta.focus(); ed.ta.select(); });
  };
  if (it.tags.some((t) => /min|largo/.test(t)))
    res.querySelector(".salida").prepend(el("p", { class: "aviso", text: "Este cálculo es largo en el navegador, sobre todo en un móvil. Puede pararlo en cualquier momento con «Parar», o reducir la malla o el número de pasos en el código." }));
  actualizaBotones();
}

function vistaCuaderno(it, m) {
  const bAll = el("button", { class: "btn primary", id: "bRun" }, "▶ Ejecutar todo");
  const bStop = el("button", { class: "btn", id: "bStop" }, "■ Parar");
  const bReset = el("button", { class: "btn" }, "Reiniciar variables");
  const bRest = el("button", { class: "btn" }, "Restaurar el cuaderno original");
  m.append(el("div", { class: "barra" }, bAll, bStop, bReset, bRest, el("span", { class: "t", id: "tEjec" })));
  const nb = el("div", { class: "cuaderno" });
  m.append(nb);
  const celdas = [];
  CAT.notebook.forEach((c, k) => {
    if (c.type === "markdown") {
      const d = el("div", { class: "celda-md" });
      d.innerHTML = window.marked ? marked.parse(c.src) : "";
      if (!window.marked) d.textContent = c.src;
      nb.append(d); return;
    }
    const key = claveEd("cuaderno", "celda" + k);
    const ed = editor(store.get(key) ?? c.src, (v) => store.set(key, v), true);
    const texto = el("pre", { class: "texto", hidden: "" });
    const figs = el("div", { style: "display:flex;flex-direction:column;gap:12px" });
    const b = el("button", { class: "btn" }, "▶ Ejecutar celda");
    const est = el("span", { class: "t" });
    const salida = el("div", { class: "salida", style: "min-height:0" }, texto, figs);
    const cel = el("section", { class: "caja celda" }, ed, el("div", { class: "pie" }, b, est), salida);
    nb.append(cel);
    const obj = { ed, texto, figs, est, key, src: c.src };
    obj.corre = () => new Promise((ok) => {
      est.textContent = "ejecutando…";
      ejecuta({ folder: it.folder, file: null, code: ed.ta.value, notebook: true,
        destino: { texto, figs, fin: (r) => { est.textContent = r.ok ? `✓ ${r.t.toFixed(1)} s` : "✗ error"; ok(r); } } });
    });
    b.onclick = () => obj.corre();
    ed.ta.addEventListener("ejecutar", () => obj.corre());
    celdas.push(obj);
  });
  bAll.onclick = async () => { for (const c of celdas) { if (!pyListo) break; const r = await c.corre(); if (!r.ok) break; } };
  bStop.onclick = para;
  bReset.onclick = () => { if (pyListo && !ocupado) { worker.postMessage({ type: "reset-nb", folder: it.folder }); celdas.forEach((c) => c.est.textContent = ""); } };
  bRest.onclick = () => { for (const c of celdas) { store.del(c.key); c.ed.set(c.src); } };
  actualizaBotones();
}

function actualizaBotones() {
  const r = $("#bRun"), s = $("#bStop");
  if (r) r.disabled = !pyListo || ocupado;
  if (s) s.disabled = !ocupado;
  document.querySelectorAll(".celda .pie .btn").forEach((b) => b.disabled = !pyListo || ocupado);
}

// ------------------------------------------------------------------ menú móvil
function cierraMenu() { $("#catalogo").classList.remove("abierto"); $("#velo").hidden = true; $("#bMenu").setAttribute("aria-expanded", "false"); }
$("#bMenu").onclick = () => { $("#catalogo").classList.add("abierto"); $("#velo").hidden = false; $("#bMenu").setAttribute("aria-expanded", "true"); };
$("#velo").onclick = cierraMenu;
$("#buscar").addEventListener("input", (e) => pintaCatalogo(e.target.value));
window.addEventListener("hashchange", () => abre(location.hash.slice(1)));

window.addEventListener("error", (e) => PASOS.push("error en la página: " + e.message + " " + (e.filename || "") + ":" + (e.lineno || "")));
window.addEventListener("unhandledrejection", (e) => PASOS.push("promesa rechazada: " + (e.reason && (e.reason.stack || e.reason.message) || e.reason)));
// ------------------------------------------------------------------ inicio
Promise.resolve().then(() => JSON.parse(document.getElementById("catalogo-datos").textContent)).then((cat) => {
  CAT = cat;
  for (const g of CAT.groups) for (const i of g.items) ITEMS[i.id] = i;
  if (CAT.modo === "profesor") $("#subtitulo").textContent = "Sistemas de fluidos · GITI · versión del profesor (con soluciones)";
  abre(location.hash.slice(1));
  arrancaPython();
}).catch((e) => { $("#main").textContent = "No se ha podido cargar el catálogo: " + e; });
