<style>
/* Layout: banco de trabajo de dos columnas (catálogo | programa), que en el móvil se convierte en un cajón lateral.
   Paleta: tinta de agua (azul petróleo) sobre papel ligeramente azulado; ámbar solo para el estado "ejecutando". */
:root {
  --bg: #f4f7f8;
  --panel: #ffffff;
  --ink: #12232b;
  --muted: #5b6d75;
  --line: #d6e0e4;
  --accent: #0d6a80;
  --accent-ink: #ffffff;
  --accent-soft: #e1f0f3;
  --code-bg: #f8fafb;
  --run: #b86e00;
  --error: #b3261e;
  --ok: #2e7d4f;
  --font-display: "Source Serif 4", Georgia, "Times New Roman", serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --radius: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e171b; --panel: #142127; --ink: #e3edf0; --muted: #93a7ae; --line: #25363d;
    --accent: #4fb3c8; --accent-ink: #062027; --accent-soft: #173640; --code-bg: #0f1b20;
    --run: #f0a43a; --error: #ff8a80; --ok: #7fd1a0; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e171b; --panel: #142127; --ink: #e3edf0; --muted: #93a7ae; --line: #25363d;
  --accent: #4fb3c8; --accent-ink: #062027; --accent-soft: #173640; --code-bg: #0f1b20;
  --run: #f0a43a; --error: #ff8a80; --ok: #7fd1a0; color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font-body); }
* { box-sizing: border-box; }
button { font: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { display: grid; grid-template-rows: auto 1fr; height: 100%; }
header.top {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--line); background: var(--panel);
}
.brand { display: flex; flex-direction: column; line-height: 1.15; margin-right: auto; min-width: 0; }
.brand b { font-family: var(--font-display); font-size: 1.3rem; letter-spacing: -0.01em; }
.brand span { color: var(--muted); font-size: 0.8rem; }
.pill { display: inline-flex; align-items: center; gap: 8px; padding: 4px 10px; border-radius: 99px; border: 1px solid var(--line); font-size: 0.82rem; color: var(--muted); white-space: nowrap; }
.pill i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.pill.listo i { background: var(--ok); }
.pill.carga i, .pill.ejec i { background: var(--run); animation: lat 1s infinite alternate; }
@keyframes lat { from { opacity: .35 } to { opacity: 1 } }
@media (prefers-reduced-motion: reduce) { .pill i { animation: none !important; } }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 6px 12px; border-radius: var(--radius); cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn:disabled { opacity: .5; cursor: default; }
.btn.menu { display: none; }

.cuerpo { display: grid; grid-template-columns: 300px minmax(0, 1fr); min-height: 0; }
nav.catalogo { border-right: 1px solid var(--line); background: var(--panel); overflow-y: auto; padding: 12px 0 24px; }
.buscar { padding: 0 14px 10px; }
.buscar input { width: 100%; padding: 7px 10px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg); color: var(--ink); font: inherit; }
.grupo h2 { font: 600 0.72rem var(--font-body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 14px 14px 4px; }
.grupo a { display: block; padding: 6px 14px 6px 12px; border-left: 2px solid transparent; color: var(--ink); text-decoration: none; }
.grupo a small { display: block; color: var(--muted); font-size: 0.8rem; line-height: 1.3; }
.grupo a:hover { background: var(--accent-soft); }
.grupo a[aria-current="page"] { border-left-color: var(--accent); background: var(--accent-soft); }
.grupo a .sol { font-size: 0.68rem; font-weight: 600; color: var(--accent); margin-left: 6px; text-transform: uppercase; letter-spacing: .05em; }

main { overflow-y: auto; min-width: 0; padding-block: 18px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.cabecera { max-width: 1400px; }
.cabecera .eyebrow { color: var(--accent); font-size: 0.78rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
.cabecera h1 { font-family: var(--font-display); font-size: clamp(1.4rem, 2.6vw, 1.9rem); margin: 2px 0 4px; text-wrap: balance; }
.cabecera p { margin: 0; color: var(--muted); max-width: 70ch; }
.etiquetas { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.etiqueta { font-size: 0.75rem; padding: 2px 8px; border-radius: 99px; background: var(--accent-soft); color: var(--ink); }
.barra { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 14px 0 10px; }
.barra .t { color: var(--muted); font-size: 0.85rem; font-variant-numeric: tabular-nums; }

details.enunciado { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 16px; margin-bottom: 12px; max-width: 1400px; }
details.enunciado summary { cursor: pointer; font-weight: 600; }
.enun { max-width: 80ch; overflow-x: auto; }
.enun img { max-width: 100%; height: auto; background: #fff; border-radius: 4px; }
.enun table { border-collapse: collapse; font-size: .9rem; }
.enun td, .enun th { border: 1px solid var(--line); padding: 3px 6px; }
.enun .enun-num { font-weight: 600; color: var(--accent); margin-bottom: 0; }
.enun ol { padding-left: 1.4em; }
.enun math { font-size: 1.05em; }

.trabajo { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; max-width: 1400px; align-items: start; }
@media (max-width: 1150px) { .trabajo { grid-template-columns: minmax(0, 1fr); } }
.caja { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); min-width: 0; }
.caja > h3 { margin: 0; padding: 8px 12px; font-size: 0.82rem; font-weight: 600; color: var(--muted); border-bottom: 1px solid var(--line); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.ficheros { display: flex; gap: 4px; flex-wrap: wrap; padding: 8px 10px 0; }
.ficheros button { border: 1px solid var(--line); background: var(--bg); color: var(--muted); border-radius: 6px; padding: 2px 8px; font: 0.78rem var(--font-mono); cursor: pointer; }
.ficheros button[aria-pressed="true"] { background: var(--accent-soft); color: var(--ink); border-color: var(--accent); }

.editor { display: grid; grid-template-columns: auto minmax(0, 1fr); font: 13px/1.55 var(--font-mono); background: var(--code-bg); border-radius: 0 0 var(--radius) var(--radius); height: min(68vh, 760px); min-height: 280px; overflow: hidden; }
.editor .num { padding: 10px 6px 10px 10px; text-align: right; color: var(--muted); user-select: none; overflow: hidden; white-space: pre; opacity: .7; }
.editor textarea { border: 0; resize: none; padding: 10px 12px; background: transparent; color: var(--ink); font: inherit; white-space: pre; overflow: auto; outline: none; tab-size: 4; }
.editor textarea:focus-visible { outline: none; box-shadow: inset 0 0 0 2px var(--accent); }

.salida { padding: 10px 12px 14px; display: flex; flex-direction: column; gap: 12px; min-height: 200px; }
.vacio { color: var(--muted); font-size: 0.9rem; }
pre.texto { margin: 0; font: 12.5px/1.5 var(--font-mono); white-space: pre-wrap; word-break: break-word; overflow-x: auto; max-height: 50vh; overflow-y: auto; }
pre.texto .err { color: var(--error); }
figure.fig { margin: 0; }
figure.fig img { width: 100%; height: auto; background: #fff; border-radius: 6px; border: 1px solid var(--line); }
figure.fig figcaption { display: flex; gap: 8px; align-items: center; font-size: 0.8rem; color: var(--muted); margin-top: 4px; }
figure.fig input[type=range] { flex: 1; min-width: 80px; }
.aviso { font-size: 0.85rem; color: var(--muted); border-left: 3px solid var(--run); padding: 2px 10px; }

/* cuaderno */
.cuaderno { max-width: 1000px; display: flex; flex-direction: column; gap: 12px; }
.celda-md { padding: 4px 4px; }
.celda-md h1, .celda-md h2 { font-family: var(--font-display); }
.celda-md blockquote { border-left: 3px solid var(--accent); margin: 0; padding: 2px 12px; color: var(--muted); }
.celda-md code { font-family: var(--font-mono); font-size: .9em; background: var(--code-bg); padding: 1px 4px; border-radius: 4px; }
.celda .editor { height: auto; min-height: 0; }
.celda .editor textarea { overflow: hidden; }
.celda .pie { display: flex; gap: 8px; align-items: center; padding: 6px 10px; border-top: 1px solid var(--line); }

/* móvil */
@media (max-width: 820px) {
  .cuerpo { grid-template-columns: minmax(0, 1fr); }
  nav.catalogo { position: fixed; z-index: 20; top: 0; bottom: 0; left: 0; width: min(88vw, 340px); transform: translateX(-105%); transition: transform .2s; box-shadow: 0 0 40px rgba(0,0,0,.25); padding-top: calc(12px + env(safe-area-inset-top, 0px)); padding-left: env(safe-area-inset-left, 0px); }
  nav.catalogo.abierto { transform: none; }
  .btn.menu { display: inline-flex; }
  .velo { position: fixed; inset: 0; background: rgba(0,0,0,.3); z-index: 15; }
  .editor { height: 55vh; }
}
</style>

cálculo muy largo: párelo)", "folder": "CODIGO_PYTHON", "main": "vortices_2D.py", "statement": null, "prof": false, "notebook": false, "tags": ["muy largo"], "code": null}, {"id": "cod-recurs-forw", "title": "recurs_forw", "desc": "Recurrencia hacia delante con 3 cifras (inestable)", "folder": "CODIGO_PYTHON", "main": "recurs_forw.py", "statement": null, "prof": false, "notebook": false, "tags": [], "code": null}, {"id": "cod-recurs-back", "title": "recurs_back", "desc": "Recurrencia hacia atrás con 3 cifras (estable)", "folder": "CODIGO_PYTHON", "main": "recurs_back.py", "statement": null, "prof": false, "notebook": false, "tags": [], "code": null}, {"id": "cod-recur", "title": "recur", "desc": "Suma de una serie con 2 cifras significativas", "folder": "CODIGO_PYTHON", "main": "recur.py", "statement": null, "prof": false, "notebook": false, "tags": [], "code": null}, {"id": "cod-kpp", "title": "ejemplo_KPP", "desc": "Cierre KPP de la capa de mezcla oceánica", "folder": "KPP", "main": "ejemplo_KPP.py", "statement": null, "prof": false, "notebook": false, "tags": [], "code": null}]}, {"title": "Ejercicios DFC 1", "items": [{"id": "dfc1-1-tu", "title": "Ejercicio 1", "desc": "Memoria RAM de un cálculo", "folder": "CODIGO_PYTHON", "main": "dfc1_ej1.py", "statement": "dfc1-1", "prof": false, "notebook": false, "tags": [], "code": "# DFC 1 · Ejercicio 1: memoria RAM necesaria\nNX = NY = NZ = 100\nNT = 2000\nBYTES = 8   # doble precisión\n\n# a) memoria en MB\n\n# b) ¿cabe en 16 GB?\n\n# c) número máximo de puntos\n"}, {"id": "dfc1-2-tu", "title": "Ejercicio 2", "desc": "Sumas con n cifras significativas (radd)", "folder": "CODIGO_PYTHON", "main": "dfc1_ej2.py", "statement": "dfc1-2", "prof": false, "notebook": false, "tags": [], "code": "# DFC 1 · Ejercicio 2: sumas con n cifras significativas\nfrom radd import radd\n\nfor n in (1, 2, 3, 5):\n    print(n, radd(99.9, 4.9, n))\n"}, {"id": "dfc1-3-tu", "title": "Ejercicio 3", "desc": "Derivadas por diferencias finitas", "folder": "CODIGO_PYTHON", "main": "dfc1_ej3.py", "statement": "dfc1-3", "prof": false, "notebook": false, "tags": [], "code": "# DFC 1 · Ejercicio 3: derivada primera por diferencias finitas\nimport numpy as np\nimport matplotlib.pyplot as plt\n\nf = lambda x: -0.1 * x**4 - 0.15 * x**3 - 0.5 * x**2 - 0.25 * x + 1.25\ndf = lambda x: -0.4 * x**3 - 0.45 * x**2 - 1.0 * x - 0.25\n\nx0, h = 0.5, 0.5\n# a) y b): hacia delante, hacia atrás y centrada\n\n# c) h = 10**i, i = -20, -19.5, ..., 0, en x = 0.25\nh = 10.0 ** np.arange(-20, 0.5, 0.5)\n"}, {"id": "dfc1-4-a", "title": "Ejercicio 4", "desc": "Recurrencias hacia delante y hacia atrás (recurs_forw.py)", "folder": "CODIGO_PYTHON", "main": "recurs_forw.py", "statement": "dfc1-4", "prof": false, "notebook": false, "tags": [], "code": null}, {"id": "dfc1-4-b", "title": "Ejercicio 4", "desc": "Recurrencias hacia delante y hacia atrás (recurs_back.py)", "folder": "CODIGO_PYTHON", "main": "recurs_back.py", "statement": "dfc1-4", "prof": false, "notebook": false, "tags": [], "code": null}, {"id": "dfc1-5-a", "title": "Ejercicio 5", "desc": "Suma de una serie con 2 cifras (recur.py)", "folder": "CODIGO_PYTHON", "main": "recur.py", "statement": "dfc1-5", "prof": false, "notebook": false, "tags": [], "code": null}, {"id": "dfc1-6-tu", "title": "Ejercicio 6", "desc": "Temperatura en una placa (serie de Fourier)", "folder": "CODIGO_PYTHON", "main": "dfc1_ej6.py", "statement": "dfc1-6", "prof": false, "notebook": false, "tags": [], "code": "# DFC 1 · Ejercicio 6: temperatura en una placa rectangular\nimport numpy as np\nimport matplotlib.pyplot as plt\nfrom radd import radd\n\nA, B, T1 = 4.0, 3.0, 80.0\nx = np.linspace(0, A, 41)\ny = np.linspace(0, B, 31)\nX, Y = np.meshgrid(x, y)\n\n# i.  suma de n = 1 a 20 con radd(..., 2)\n# ii. suma de n = 20 a 1\n"}]}, {"title": "Ejercicios DFC 2", "items": [{"id": "dfc2-1", "title": "Ejercicio 1", "desc": "Convección lineal: CFL, upwind y otros esquemas (parte de EC_ONDA_CPOS.py)", "folder": "CODIGO_PYTHON", "main": "dfc2_ej1.py", "statement": "dfc2-1", "prof": false, "notebook": false, "tags": ["animación"], "code": "\"\"\"\nEC_ONDA_CPOS.py  (traducción de EC_ONDA_CPOS.m)\n-----------------------------------------\nEcuación de onda (convección lineal) con C.C. Dirichlet, c > 0\n\n    u_t + c u_x = 0\n    u(0,t) = u0\n\nDiscretización temporal:  Euler explícito\nDiscretización espacial:  diferencias finitas atrasadas (upwind para c > 0)\n\nA. Lozano Durán, 2014 (versión original en MATLAB)\n-----------------------------------------\n\"\"\"\nimport numpy as np\nimport scipy.sparse as sp\nfrom animacion import Animacion\n\nprint(\"Ecuación de onda\")\n# Parámetros:\nc = 1          # velocidad de convección\nCFL = 0.5      # número de Courant c dt / dx\nLx = 1         # longitud del dominio\nnx = 100       # número de puntos (sin contar x = 0)\nNt = 100       # número de pasos temporales\nCADA = 1       # se dibuja la solución cada CADA pasos\ndx = Lx / nx\nx = dx * np.arange(nx + 1)\nprint(f\"c: {c}\\nLx: {Lx}\\nnx: {nx}\\nCFL: {CFL}\")\n\n# Condición inicial:\nui = np.sin(4 * np.pi * x)\nu = ui[1:nx + 1].copy()\n# Condición de contorno en x = 0\nu0 = ui[0]\n\n# Derivada primera hacia atrás: (u_i - u_{i-1}) / dx\nBx = sp.diags([-1, 1], [-1, 0], shape=(nx + 2, nx + 2), format=\"csr\") / dx\nDx = Bx[1:-1, 1:-1]\nDx0 = Bx[1:-1, 0].toarray().ravel()\n# Paso de tiempo convectivo\ndt = CFL * dx / c\n\nfig = Animacion(x, (0, 1), (-10, 10), f\"Onda, c = {c}, CFL = {CFL}\")\nt = 0\nfor i in range(1, Nt + 1):\n    # Euler explícito\n    # (En el original: - dt*c*uc con uc = [u0 0 ... 0], sin el 1/dx; no tenía efecto porque u0 = 0.)\n    u = u - dt * c * (Dx @ u) - dt * c * Dx0 * u0\n    t = t + dt\n    if i % CADA == 0 or i == Nt:\n        u_numerica = np.concatenate(([u0], u))\n        u_exacta = np.sin(4 * np.pi * (x - c * t))\n        u_exacta[x < c * t] = 0          # lo que ha entrado por x = 0 vale u0 = 0\n        fig.actualiza(u_numerica, u_exacta, t)\nprint(\"Fin\")\nAnimacion.fin()\n"}, {"id": "dfc2-2", "title": "Ejercicio 2", "desc": "La onda sale del dominio (EC_ONDA_0.py)", "folder": "CODIGO_PYTHON", "main": "EC_ONDA_0.py", "statement": "dfc2-2", "prof": false, "notebook": false, "tags": ["animación"], "code": null}]}, {"title": "Práctica: refrigeración de un molde", "items": [{"id": "practica-cuaderno", "title": "Cuaderno de la práctica", "desc": "Laminar o turbulento: diseño del caudal de refrigeración", "folder": "practica", "main": null, "statement": "practica", "prof": false, "notebook": true, "tags": [], "code": null}]}, {"title": "Mis programas", "items": [{"id": "mi-programa", "title": "Programa en blanco", "desc": "Escribe y ejecuta tu propio código Python (numpy, scipy, matplotlib)", "folder": "mis_programas", "main": "mi_programa.py", "statement": null, "prof": false, "notebook": false, "tags": [], "code": "import numpy as np\nimport matplotlib.pyplot as plt\n\nx = np.linspace(0, 2 * np.pi, 200)\nplt.plot(x, np.sin(x))\nplt.title('Prueba')\nplt.show()\n"}]}], "folders": {"KPP": {"KPP.py": "\"\"\"\nKPP.py  (traducción de KPP.m)\n\nKM, KT, KS, ghatu, ghatv, ghatt, ghats, hbl, D = kpp(U, V, T, S, ZZ, ZP,\n        WUSURF, WVSURF, WTSURF, WSSURF, SWRD, COR=0, hbl=10,\n        r1=0.67, amu1=1.0, r2=None, amu2=17, imod=2)\n\nCierre de turbulencia KPP para modelos 1D de la capa superior del océano, según\nSmyth et al. (2002). Incluye como opciones la versión de McWilliams y Sullivan (2000)\ny la original de Large et al. (1994).\n\nENTRADAS (vectores numpy de longitud KB):\n  U, V, T, S: perfiles de velocidad zonal y meridional, temperatura y salinidad.\n  ZZ: profundidades (m, < 0, ZZ = 0 en la superficie) donde están U, V, T, S.\n  ZP: profundidades (m, < 0) donde se calculan KM, KT, KS y los ghat.\n  WUSURF, WVSURF: componentes zonal y meridional del flujo de momento en superficie.\n  WTSURF: flujo de temperatura en superficie SIN la radiación solar (> 0 enfriamiento).\n  WSSURF: flujo equivalente de salinidad en superficie.\n  SWRD: flujo de temperatura debido a la radiación solar.\nOPCIONALES:\n  COR: parámetro de Coriolis f (0 por defecto).\n  hbl: estimación inicial del espesor de la capa límite (> 0, m). Si es 0, se toma\n       la profundidad de la capa de mezcla. Por defecto 10.\n  r1, amu1, r2, amu2: constantes del perfil de penetración solar de Paulson y\n       Simpson (1977): f(z) = r1 exp(z/amu1) + r2 exp(z/amu2). Por defecto Jerlov Ib\n       (r2 = 1 - r1).\n  imod: 0 Large et al. (1994), 1 McWilliams y Sullivan (2000), 2 Smyth et al. (2002).\nSALIDAS:\n  KM, KT, KS: difusividades turbulentas de momento, temperatura y salinidad.\n  ghatu, ghatv, ghatt, ghats: transportes no locales.\n  hbl: espesor de la capa límite calculado (pasarlo en la siguiente llamada).\n  D: diccionario con diagnósticos.\n\nOriginal en MATLAB: W. D. Smyth (2011), a partir de la versión 3D de H. Wijesekera\ny W. D. Smyth (2000). Si se usa en investigación publicada, citar Smyth et al. (2002).\n\nReferencias:\n  Large, W. G., J. C. McWilliams y S. C. Doney, 1994, \"Oceanic vertical mixing: A review\n     and a model with a nonlocal boundary layer parameterization\", Rev. Geophys. 32 (4), 363-403.\n  McWilliams, J. y P. Sullivan, 2000, \"Vertical mixing by Langmuir circulations\",\n     Spill Sci. Technol. Bull. 6, 225-237.\n  Smyth, W. D., E. D. Skyllingstad, G. B. Crawford y H. Wijesekera, 2002, \"Nonlocal fluxes\n     and Stokes drift effects in the K-profile parameterization\", Ocean Dynamics 52 (3), 104-115.\n\nDiferencias con el original:\n  - Los índices empiezan en 0. Donde en MATLAB había un índice k de 1 a KB, aquí\n    es k-1; se indica en los comentarios.\n  - sw_alpha y sw_beta (del paquete SEAWATER, que no estaba en la carpeta) se\n    sustituyen por los coeficientes de expansión obtenidos derivando la misma\n    ecuación de estado que usa sigmat, a presión 0.\n  - En sigmat el último término del polinomio del agua pura usaba T^4 en lugar de T^5\n    (ecuación de estado UNESCO 1981); corregido.\n  - \"stop\" (que en MATLAB daba error y paraba el programa) -> se lanza una excepción.\n\"\"\"\nimport numpy as np\n\n\ndef kpp(U, V, T, S, ZZ, ZP, WUSURF, WVSURF, WTSURF, WSSURF, SWRD,\n        COR=0.0, hbl=10.0, r1=0.67, amu1=1.0, r2=None, amu2=17.0, imod=2):\n    U, V, T, S, ZZ, ZP = (np.asarray(a, dtype=float) for a in (U, V, T, S, ZZ, ZP))\n    if imod > 2:\n        raise ValueError(\"model not available\")\n    if r2 is None:\n        r2 = 1 - r1\n    D = dict(amu1=amu1, amu2=amu2, r1=r1, r2=r2)\n\n    hbl0 = hbl\n    D[\"COR\"] = COR\n\n    # ---- Profundidad de la capa de mezcla\n    sigma = sigmat(S, T)                       # sigma-t (unidades SI)\n    sig0 = (sigma[0] + sigma[1]) / 2 + .01\n    dml = np.max(ZZ[sigma >= sig0])\n    if hbl == 0:\n        hbl = abs(dml)\n    else:\n        hbl = (hbl0 + abs(dml)) / 2            # estimación inicial más cerca de dml\n    D[\"dml\"] = dml\n\n    # ---- Constantes del modelo KPP\n    KB = len(U)\n    KBM1 = KB - 1                              # número de niveles menos uno (en MATLAB, índice del penúltimo)\n\n    # Constantes de los perfiles de flujo de semejanza; LMD p. 392\n    zetas = -1.0\n    zetam = -0.2\n    cs = 24. * (1. - 16. * zetas)**(.50)\n    cm = 12. * (1. - 16. * zetam)**(-.25)\n    as_ = cs * zetas + (1. - 16. * zetas)**(1.50)     # \"as\" es palabra reservada en Python\n    am = cm * zetam + (1. - 16. * zetam)**(.75)\n\n    vonKar = 0.4                               # constante de von Kármán\n    tiny = 1.e-20                              # para evitar divisiones por cero\n    gravity = 9.81\n    D.update(zetas=zetas, zetam=zetam, cs=cs, cm=cm, as_=as_, am=am, vonKar=vonKar, gravity=gravity)\n\n    # Constantes para el espesor de la capa límite\n    Cv = 1.5                                   # LMD\n    if imod == 2:                              # SSCW\n        Cv = 1.0\n    Ric = 0.30                                 # LMD p. 377\n    D.update(Cv=Cv, Ric=Ric)\n\n    betaT = -0.20\n    epsilon = 0.1\n    hbl_max = 200\n    D.update(betaT=betaT, epsilon=epsilon, hbl_max=hbl_max)\n\n    # Parametrización de la turbulencia profunda con Ri (LMD 28, 29, p. 373)\n    Ri0 = 0.7\n    anu0 = 50.e-4\n    anum = 1.0e-4\n    anut = 0.1e-4\n    D.update(Ri0=Ri0, anu0=anu0, anum=anum, anut=anut)\n\n    # Flujos no locales (LMD p. 371). En LMD, Cg_m = 0.\n    C_s = 10.                                  # LMD\n    C_m = 0.0                                  # LMD\n    if imod == 2:                              # SSCW\n        C_s = 5.0\n        C_m = 3.0\n    Cg_s = C_s * vonKar * (cs * vonKar * epsilon)**(1 / 3.)\n    Cg_m = C_m * vonKar * (cm * vonKar * epsilon)**(1 / 3.)\n    D.update(C_s=C_s, C_m=C_m, Cg_s=Cg_s, Cg_m=Cg_m)\n\n    # Deriva de Stokes (MS01). En LMD, Cg_Stokes = 0; en Skyllingstad et al., 11.5.\n    Cg_Stokes = 0\n    if imod == 1:\n        Cg_Stokes = 11.5 * .4\n    if imod == 2:\n        Cg_Stokes = 11.5 * .4 * .7\n    Lam_Stokes = 30.\n    m_Stokes = 4. * np.pi / Lam_Stokes\n    D.update(Cg_Stokes=Cg_Stokes, Lam_Stokes=Lam_Stokes, m_Stokes=m_Stokes)\n\n    # Células de Langmuir. En MS00, Cw_m = Cw_s = 0.08; en LMD, 0.\n    La = .3\n    nms = 2\n    xce = 2\n    D.update(La=La, nms=nms, xce=xce)\n    Cw_m = 0                                   # LMD\n    if imod == 1:                              # MS\n        Cw_m = 0.08\n    if imod == 2:                              # SSCW\n        Cw_m = .15\n    Cw_s = Cw_m\n    D.update(Cw_m=Cw_m, Cw_s=Cw_s)\n\n    # Longitud de rugosidad z0 <= 0\n    z0 = -2. * .5 * 0\n    D[\"z0\"] = z0\n\n    # ---- Constantes iniciales\n    # Escala de velocidad de la turbulencia (m/s)\n    Vtc = Cv * np.sqrt(-betaT) / (np.sqrt(cs * epsilon) * Ric * vonKar * vonKar)\n    D[\"Vtc\"] = Vtc\n\n    # Velocidad de fricción en superficie (WUSURF y WVSURF en m^2/s^2)\n    ustar = np.sqrt(np.sqrt(WVSURF**2 + WUSURF**2))\n    ustar2 = ustar**2\n    ustar3 = ustar**3\n    ustar4 = ustar**4\n\n    # BoNet = flujo neto de flotabilidad en superficie SIN la onda corta (m^2/s^3)\n    # BoSol = flujo de flotabilidad de la radiación de onda corta\n    # WTSURF > 0 enfriamiento, < 0 calentamiento\n    alpha, beta = coef_expansion(S[0], T[0])\n    BoNet = gravity * (alpha * WTSURF - beta * WSSURF)\n    BoSol = gravity * alpha * SWRD\n\n    # ---- Ri, KM y KH en el interior\n    # Número de Richardson de gradiente Rig (malla uniforme). Si la malla es desplazada,\n    # bvf2, dudz, dvdz y Rig se calculan en ZP.\n    bvf2 = 0 * T\n    dudz = 0 * U\n    dvdz = 0 * V\n    g0 = gravity / 1030\n    if ZP[0] != ZZ[0]:\n        bvf2[1:] = -g0 * (sigma[:-1] - sigma[1:]) / (ZZ[:-1] - ZZ[1:])\n        dudz[1:] = (U[:-1] - U[1:]) / (ZZ[:-1] - ZZ[1:])\n        dvdz[1:] = (V[:-1] - V[1:]) / (ZZ[:-1] - ZZ[1:])\n        bvf2[0] = bvf2[1]\n        dudz[0] = dudz[1]\n        dvdz[0] = dvdz[1]\n    else:\n        bvf2[1:-1] = -g0 * (sigma[:-2] - sigma[2:]) / (ZZ[:-2] - ZZ[2:])\n        dudz[1:-1] = (U[:-2] - U[2:]) / (ZZ[:-2] - ZZ[2:])\n        dvdz[1:-1] = (V[:-2] - V[2:]) / (ZZ[:-2] - ZZ[2:])\n        bvf2[0] = -g0 * (sigma[0] - sigma[1]) / (ZZ[0] - ZZ[1])\n        dudz[0] = (U[0] - U[1]) / (ZZ[0] - ZZ[1])\n        dvdz[0] = (V[0] - V[1]) / (ZZ[0] - ZZ[1])\n        bvf2[-1] = -g0 * (sigma[-2] - sigma[-1]) / (ZZ[-2] - ZZ[-1])\n        dudz[-1] = (U[-2] - U[-1]) / (ZZ[-2] - ZZ[-1])\n        dvdz[-1] = (V[-2] - V[-1]) / (ZZ[-2] - ZZ[-1])\n    shear2 = dudz**2 + dvdz**2\n    # ¿Suavizar N^2 y la cizalla antes de dividir?\n    nsmooth = 0\n    if nsmooth >= 1:\n        bvf2 = smooth(bvf2, nsmooth)\n        shear2 = smooth(shear2, nsmooth)\n    Rig = bvf2 / (shear2 + tiny)\n\n    # KM y KH con el esquema basado en Ri de Large et al.\n    # (Se desprecian la doble difusión y los dedos de sal.)\n    fRi = np.ones_like(Rig)\n    m = (Rig > 0) & (Rig < Ri0)\n    fRi[m] = (1 - (Rig[m] / Ri0)**2)**3\n    fRi[(Rig > 0) & (Rig >= Ri0)] = 0\n    fRi = smooth(fRi, 1)\n    anusx = anu0 * fRi\n    # difusividades de fondo (ondas internas)\n    KM = anusx + anum\n    KH = anusx + anut\n\n    # ---- Ri bulk y hbl\n    # Se calcula Rib (en ZZ) y se busca la profundidad hbl donde Rib(hbl) = Ric.\n    # (El original avisa: este esquema iterativo no funciona muy bien.)\n    sl_depth0 = epsilon * hbl\n    niter = 0\n    kbl = np.flatnonzero(-ZP > hbl)[0]         # en MATLAB, kbl (1..KB) = kbl + 1\n    Rib = np.zeros(KB)                         # se conserva entre iteraciones, como en MATLAB\n    maxiter = 10\n    while niter < maxiter:\n        niter += 1\n        sl_depth = .5 * (epsilon * hbl + sl_depth0)\n\n        # medias en la capa superficial ZZ > -sl_depth (niveles 0..ksl)\n        ksl = np.flatnonzero(-ZZ > sl_depth)[0]\n        Z_top = np.mean(ZZ[:ksl + 1])\n        U_top = np.mean(U[:ksl + 1])\n        V_top = np.mean(V[:ksl + 1])\n        SIG_top = np.mean(sigma[:ksl + 1])\n\n        for k in range(ksl + 1, KBM1):         # MATLAB: k = ksl+1 : KBM1\n            # penetración de la radiación solar\n            swrdzz = r1 * np.exp(ZZ[k] / amu1) + r2 * np.exp(ZZ[k] / amu2)\n            # flujo de flotabilidad hasta la profundidad k (< 0 estable, > 0 inestable)\n            Bfsfc = BoNet + BoSol * (1.0 - swrdzz)\n            # escala de velocidad convectiva\n            wstar = 0.\n            if Bfsfc > 0.:\n                wstar = (Bfsfc * hbl)**(1. / 3.)\n            stab_lc = (ustar3 / (ustar3 + 0.6 * wstar**3))**xce\n            # escalas de velocidad turbulenta (teoría de semejanza)\n            zeta = vonKar * max(ZZ[k], -sl_depth) * Bfsfc / (ustar3 + tiny)\n            phis = phi_s(zeta, zetas, as_, cs)\n            w_s = vonKar * ustar / phis * (1. + stab_lc * Cw_s / La**(2 * nms))**(1. / nms)\n            # número de Richardson bulk\n            delU = U_top - U[k]\n            delV = V_top - V[k]\n            bvtop = -g0 * (SIG_top - sigma[k]) * (Z_top - ZZ[k])\n            dV2 = delU * delU + delV * delV\n            bvf2_1 = -g0 * (sigma[k - 1] - sigma[k + 1]) / (ZZ[k - 1] - ZZ[k + 1])\n            dVt2 = Vtc * (-ZZ[k]) * w_s * np.sqrt(abs(bvf2_1))\n            Rib[k] = bvtop / (dV2 + dVt2 + tiny)\n        Rib[KB - 1] = Rib[KB - 2]\n\n        it = np.flatnonzero(Rib >= Ric)\n        ib = np.flatnonzero(Rib < Ric)\n        hblt = -ZZ[it[0]] if it.size else None\n        hblb = -ZZ[ib[-1]] if ib.size else None\n        if hblb is not None and hblt is not None:\n            hbl = (hblb + hblt) / 2\n        elif hblb is not None:\n            hbl = hblb\n        elif hblt is not None:\n            hbl = hblt\n\n        # Comparación con otras escalas (Ekman y Monin-Obukhov) en condiciones estables\n        swrdhbl = r1 * np.exp(-hbl / amu1) + r2 * np.exp(-hbl / amu2)\n        Bfsfc = BoNet + BoSol * (1.0 - swrdhbl)\n        cekman = 0.7\n        cmonob = 1.0\n        if Bfsfc < 0:\n            hekman = cekman * ustar / max(abs(COR), tiny)\n            hmonob = -cmonob * ustar3 / (vonKar * (Bfsfc - tiny))\n            hlimit = min(hekman, hmonob)\n            hbl = min(hbl, hlimit)\n            hbl = max(hbl, abs(ZZ[0]))         # espesor mínimo\n            hbl = min(hbl, abs(ZZ[KB - 1]))\n\n        # nuevo índice kbl, justo por debajo de hbl\n        kbl = np.flatnonzero(-ZP > hbl)[0]\n        sl_depth0 = sl_depth\n        if abs(sl_depth - epsilon * hbl) < .25:\n            break\n\n    # ---- Magnitudes en la base de la capa límite\n    swrdhbl = r1 * np.exp(-abs(hbl) / amu1) + r2 * np.exp(-abs(hbl) / amu2)\n    Bfsfc = BoNet + BoSol * (1.0 - swrdhbl)    # flujo neto hacia la capa límite\n    wstar = 0.\n    if Bfsfc > 0:\n        wstar = (Bfsfc * hbl)**(1 / 3)\n    stab_lc = (ustar3 / (ustar3 + 0.6 * wstar**3))**xce\n\n    # escalas de velocidad (w_m, w_s) en hbl\n    zlmd = hbl * epsilon if Bfsfc >= 0 else hbl\n    zetapar = -vonKar * zlmd * Bfsfc / (ustar3 + tiny)\n    phim = phi_m(zetapar, zetam, am, cm)\n    w_m = vonKar * ustar / phim * (1. + stab_lc * Cw_m / La**(2 * nms))**(1. / nms)\n    phis = phi_s(zetapar, zetas, as_, cs)\n    w_s = vonKar * ustar / phis * (1. + stab_lc * Cw_s / La**(2 * nms))**(1. / nms)\n\n    # Si hbl es demasiado grande, se dibujan diagnósticos y se para\n    if hbl > hbl_max:\n        import matplotlib.pyplot as plt\n        fig, ax = plt.subplots(1, 3, figsize=(12, 5), num=103)\n        ax[0].plot(bvf2, ZZ, label=\"bvf2\"); ax[0].plot(shear2, ZZ, label=\"shear2\")\n        ax[0].set_ylim(-120, 0); ax[0].legend(); ax[0].set_ylabel(\"Z\")\n        ax[1].semilogx(Rig, ZZ); ax[1].axvline(Ri0, color=\"k\"); ax[1].set_ylim(-120, 0); ax[1].set_xlabel(\"Rig\")\n        ax[2].semilogx(KM, ZZ, \"b\", lw=2, label=\"KM\"); ax[2].semilogx(KH, ZZ, \"r\", lw=2, label=\"KH\")\n        ax[2].set_ylim(-120, 0); ax[2].set_xlim(1e-7, 1); ax[2].legend()\n        plt.show()\n        raise RuntimeError(f\"KPP: hbl = {hbl:.1f} m > hbl_max = {hbl_max} m\")\n\n    # ---- Funciones de forma y derivadas en hbl (LMD ec. 18 y D5a,b)\n    f1 = 0. if Bfsfc >= 0 else -5.0 * Bfsfc * vonKar / (ustar4 + tiny)\n    if hbl < abs(ZZ[KBM1 - 1]):                # MATLAB: abs(ZZ(KBM1))\n        k = kbl\n        cff_up = (-hbl - ZP[k]) / ((ZP[k - 1] - ZP[k]) * (ZP[k - 1] - ZP[k]))\n        cff_dn = (hbl + ZP[k - 1]) / ((ZP[k - 1] - ZP[k]) * (ZP[k] - ZP[k + 1]))\n        # momento\n        KMp = cff_up * max(0.0, KM[k - 1] - KM[k]) + cff_dn * max(0.0, KM[k] - KM[k + 1])\n        KMh = KM[k] + KMp * (-ZP[k] - hbl)\n        Gm1 = KMh / (hbl * w_m + tiny)\n        dGm1ds = min(0.0, KMh * f1 - KMp / (w_m + tiny))\n        # escalares (misma función de forma para temperatura y salinidad)\n        KHp = cff_up * max(0.0, KH[k - 1] - KH[k]) + cff_dn * max(0.0, KH[k] - KH[k + 1])\n        KHh = KH[k] + KHp * (-ZP[k] - hbl)\n        Gt1 = KHh / (hbl * w_s + tiny)\n        dGt1ds = min(0.0, KHh * f1 - KHp / (w_s + tiny))\n    else:\n        raise RuntimeError(\"KPP failed to find hbl\")\n    # (No se aplica la difusividad modificada de la ec. D6 de LMD.)\n\n    # ---- Coeficientes de mezcla y flujos no locales dentro de la capa límite\n    kbl = min(kbl, KB - 1)\n    # dirección del flujo no local de momento\n    dvec_x = -WUSURF / ustar2\n    dvec_y = -WVSURF / ustar2\n    # efecto de la estabilidad en el flujo no local de momento (Brown y Grant, 1998)\n    stab_nlm = 2.7 * wstar**3 / (ustar3 + 0.6 * wstar**3)\n\n    ghatu = 0 * U\n    ghatv = 0 * V\n    ghatt = 0 * T\n    ghats = 0 * S\n    KM = KM.copy()\n    KH = KH.copy()\n\n    # constantes de las funciones de forma, LMD (17)\n    a2_m = -2.0 + 3.0 * Gm1 - dGm1ds\n    a3_m = 1.0 - 2.0 * Gm1 + dGm1ds\n    a2_s = -2.0 + 3.0 * Gt1 - dGt1ds\n    a3_s = 1.0 - 2.0 * Gt1 + dGt1ds\n\n    for k in range(1, kbl):                    # MATLAB: k = 2 : kbl-1\n        sl_depth = hbl * epsilon\n        # escalas de velocidad\n        zetapar = -vonKar * abs(ZP[k]) * Bfsfc / (ustar3 + tiny)\n        zetapar0 = -vonKar * sl_depth * Bfsfc / (ustar3 + tiny)\n        zeta = max(zetapar0, zetapar)\n        phim = phi_m(zeta, zetam, am, cm)\n        phis = phi_s(zeta, zetas, as_, cs)\n        if ZP[k] > z0:\n            # (Nunca se ejecuta: z0 = 0 y ZP < 0. Se deja como en el original, que\n            #  además sobrescribía phim con phi_s.)\n            zeta0 = -vonKar * abs(z0) * Bfsfc / (ustar3 + tiny)\n            phim = phi_m(zeta0, zetam, am, cm)\n            phim = phi_s(zeta, zetas, as_, cs)\n            phim = phim * abs(ZP[k] / z0) / 100.\n            phis = phis * abs(ZP[k] / z0) / 100.\n        w_m = vonKar * ustar / phim\n        w_s = vonKar * ustar / phis\n        # parametrización de las células de Langmuir de McWilliams y Sullivan\n        w_m = w_m * (1. + stab_lc * Cw_m / La**(2 * nms))**(1. / nms)\n        w_s = w_s * (1. + stab_lc * Cw_s / La**(2 * nms))**(1. / nms)\n        # funciones de forma, LMD (11) con a0 = 0, a1 = 1\n        sigx = -ZP[k] / (hbl + tiny)\n        Gm = sigx * (1.0 + a2_m * sigx + a3_m * sigx**2)\n        Gs = sigx * (1.0 + a2_s * sigx + a3_s * sigx**2)\n        # LMD (10)\n        KM[k] = hbl * w_m * Gm\n        KH[k] = hbl * w_s * Gs\n        # términos no locales (LMD 19, 20, A4, 28, 29)\n        if Bfsfc >= 0:\n            ghatt[k] = WTSURF * Cg_s / (w_s * hbl + tiny)\n            ghats[k] = WSSURF * Cg_s / (w_s * hbl + tiny)\n        else:\n            ghatt[k] = 0.\n            ghats[k] = 0.\n        ghatu[k] = -Cg_m * ustar2 * stab_nlm * dvec_x / (w_m * hbl + tiny)\n        ghatv[k] = -Cg_m * ustar2 * stab_nlm * dvec_y / (w_m * hbl + tiny)\n        # cizalla de la deriva de Stokes\n        ghatu[k] -= (-WUSURF / (ustar2 + tiny)) * Cg_Stokes * ustar * m_Stokes * np.exp(m_Stokes * ZP[k])\n        ghatv[k] -= (-WVSURF / (ustar2 + tiny)) * Cg_Stokes * ustar * m_Stokes * np.exp(m_Stokes * ZP[k])\n\n    # KT y KS son iguales a KH\n    KT = KH\n    KS = KH.copy()\n    return KM, KT, KS, ghatu, ghatv, ghatt, ghats, hbl, D\n\n\ndef sigmat(SI, TI):\n    \"\"\"sigma-t = densidad - 1000 (kg/m^3), con T temperatura potencial\n    (ecuación de estado UNESCO 1981 a presión 0; véase Mellor, 1991, J. Atmos. Oceanic Tech., 609-611)\"\"\"\n    TR = np.asarray(TI, dtype=float)\n    SR = np.asarray(SI, dtype=float)\n    TR2 = TR * TR\n    TR3 = TR2 * TR\n    TR4 = TR3 * TR\n    TR5 = TR4 * TR\n    P = 0.0          # presión (bar) nula para obtener sigma-t\n    RHOR = (999.842594 + 6.793952E-2 * TR - 9.095290E-3 * TR2 + 1.001685E-4 * TR3\n            - 1.120083E-6 * TR4 + 6.536332E-9 * TR5)          # el original ponía TR4\n    RHOR = (RHOR + (0.824493 - 4.0899E-3 * TR + 7.6438E-5 * TR2 - 8.2467E-7 * TR3 + 5.3875E-9 * TR4) * SR\n            + (-5.72466E-3 + 1.0227E-4 * TR - 1.6546E-6 * TR2) * np.abs(SR)**1.5\n            + 4.8314E-4 * SR * SR)\n    CR = 1449.1 + .0821 * P + 4.55 * TR - .045 * TR2 + 1.34 * (SR - 35.)\n    RHOR = RHOR + 1.E5 * P / (CR * CR) * (1. - 2. * P / (CR * CR))\n    return RHOR - 1000\n\n\ndef coef_expansion(S, T, d=1e-3):\n    \"\"\"alpha = -1/rho drho/dT y beta = 1/rho drho/dS a presión 0 (sustituyen a\n    sw_alpha y sw_beta del paquete SEAWATER), derivando sigmat numéricamente.\"\"\"\n    rho = 1000 + sigmat(S, T)\n    alpha = -(sigmat(S, T + d) - sigmat(S, T - d)) / (2 * d) / rho\n    beta = (sigmat(S + d, T) - sigmat(S - d, T)) / (2 * d) / rho\n    return float(alpha), float(beta)\n\n\ndef phi_m(zeta, zetam, a, c):\n    \"\"\"Función de estructura vertical para el momento (LMD, apéndice B)\"\"\"\n    if zeta >= 0:                      # capa límite estable\n        return 1.0 + 5. * zeta\n    if zeta > zetam:                   # inestable\n        return (1.0 - 16. * zeta)**(-1. / 4.)\n    return (a - c * zeta)**(-1. / 3.)\n\n\ndef phi_s(zeta, zetas, a, c):\n    \"\"\"Función de estructura vertical para los escalares (LMD, apéndice B)\"\"\"\n    if zeta >= 0.0:\n        return 1.0 + 5. * zeta\n    if zeta > zetas:\n        return (1.0 - 16. * zeta)**(-1. / 2.)\n    return (a - c * zeta)**(-1. / 3.)\n\n\ndef smooth(x, f=1):\n    \"\"\"Suavizado binomial simple del vector x (los extremos no cambian).\n    f = 1 suavizado completo, f = 0 ninguno, f > 1 se repite floor(f) veces.\n    Ejemplo: smooth([1, 4, 9, 16, 25]) = [1, 4.5, 9.5, 16.5, 25]\"\"\"\n    x = np.asarray(x, dtype=float).copy()\n    if f <= 1:\n        xs = x.copy()\n        xs[1:-1] = (1 - .5 * f) * x[1:-1] + .25 * f * (x[:-2] + x[2:])\n        return xs\n    for _ in range(int(np.floor(f))):\n        xs = x.copy()\n        xs[1:-1] = .5 * x[1:-1] + .25 * (x[:-2] + x[2:])\n        x = xs\n    return x\n", "ejemplo_KPP.py": "\"\"\"\nejemplo_KPP.py: ejemplo de uso de KPP.py (no había ninguno en la carpeta de MATLAB).\n\nCapa de mezcla de 30 m sobre una termoclina, viento de 0.1 N/m^2 en x y un\nenfriamiento de 100 W/m^2 en superficie, sin radiación solar.\n\"\"\"\nimport numpy as np\nimport matplotlib.pyplot as plt\nfrom KPP import kpp\n\nrho0, cp = 1025.0, 3990.0\ndz = 1.0\nZZ = -dz * np.arange(1, 151)           # niveles cada metro hasta 150 m\nZP = ZZ.copy()                         # misma malla para las difusividades\nT = np.where(ZZ > -30, 20.0, 20.0 + 0.1 * (ZZ + 30))     # 20 °C hasta 30 m y luego -0.1 °C/m\nS = 35.0 * np.ones_like(ZZ)\nU = np.where(ZZ > -30, 0.1, 0.0)       # corriente de 10 cm/s en la capa de mezcla\nV = np.zeros_like(ZZ)\n\ntau = 0.1                              # N/m^2\nWUSURF, WVSURF = -tau / rho0, 0.0      # flujo de momento (m^2/s^2)\nWTSURF = 100 / (rho0 * cp)             # enfriamiento de 100 W/m^2 (> 0 = enfriamiento)\nWSSURF, SWRD = 0.0, 0.0\nCOR = 1e-4\n\nKM, KT, KS, ghatu, ghatv, ghatt, ghats, hbl, D = kpp(U, V, T, S, ZZ, ZP, WUSURF, WVSURF,\n                                                     WTSURF, WSSURF, SWRD, COR=COR, hbl=0)\nprint(f\"Profundidad de la capa de mezcla (criterio de densidad): {abs(D['dml']):.1f} m\")\nprint(f\"Espesor de la capa límite KPP: hbl = {hbl:.1f} m\")\nprint(f\"KM máximo = {KM.max():.3g} m^2/s, KT máximo = {KT.max():.3g} m^2/s\")\n\nfig, ax = plt.subplots(1, 3, figsize=(11, 5), sharey=True)\nax[0].plot(T, ZZ, \"r\"); ax[0].set_xlabel(\"T (°C)\"); ax[0].set_ylabel(\"z (m)\")\nax[1].semilogx(KM, ZZ, \"b\", label=\"KM\"); ax[1].semilogx(KT, ZZ, \"r--\", label=\"KT\")\nax[1].set_xlabel(\"K (m²/s)\"); ax[1].legend()\nax[2].plot(ghatt, ZZ, \"r\"); ax[2].set_xlabel(\"ghat_T (K/m)\")\nfor a in ax:\n    a.axhline(-hbl, color=\"0.5\", ls=\":\")\nax[0].set_ylim(-80, 0)\nfig.suptitle(f\"KPP: hbl = {hbl:.1f} m\")\nfig.tight_layout()\nplt.show()\n"}, "practica": {"solucion_practica_molde.py": "\"\"\"\nSistemas de fluidos - GITI\nPráctica: REFRIGERACIÓN DE UN MOLDE DE INYECCIÓN. ¿LAMINAR O TURBULENTO?\nSCRIPT DE SOLUCIÓN (profesor)\n\nReproduce todos los resultados de la solución. Requiere: numpy, scipy, matplotlib\n\"\"\"\nimport numpy as np\nimport matplotlib.pyplot as plt\nfrom scipy.optimize import brentq\n\n# ----------------------------------------------------------------- DATOS\nD = 0.010            # diámetro del canal taladrado (m)\nL = 3.0              # longitud de un circuito (m)\nK_TOT = 6.0          # suma de coeficientes de pérdidas menores (cambios de dirección, conexiones)\nN_CIRC = 8           # circuitos iguales en paralelo\nQ_MAX = 5.0          # caudal máximo por circuito que da el termorregulador (L/min)\nT_MIN, T_MAX = 20.0, 70.0      # rango de temperaturas de consigna (°C)\nT_NOM = 45.0                   # temperatura nominal (°C)\nH_MIN = 4000.0                 # coeficiente de convección mínimo exigido (W/m²K)\nRE_LAM, RE_TURB = 2300, 4000\nCP = 4180.0\nETA = 0.6                      # rendimiento de la bomba del termorregulador\nA = np.pi * D ** 2 / 4\n\n\n# ------------------------------------------------- PROPIEDADES DEL AGUA\ndef rho(T): return 1000 * (1 - (T + 288.9414) / (508929.2 * (T + 68.12963)) * (T - 3.9863) ** 2)\ndef mu(T): return 2.414e-5 * 10 ** (247.8 / (T + 273.15 - 140))                 # Vogel\ndef k(T):                                                                           # Ramires et al.\n    Tr = (T + 273.15) / 298.15\n    return 0.6065 * (-1.48445 + 4.12292 * Tr - 1.63866 * Tr ** 2)\ndef Pr(T): return mu(T) * CP / k(T)\n\n\n# ------------------------------------------------- CORRELACIONES\ndef f_lam(Re): return 64 / Re\ndef f_turb(Re): return brentq(lambda f: 1 / np.sqrt(f) + 2 * np.log10(2.51 / (Re * np.sqrt(f))), 1e-4, 1)\ndef Nu_lam(Re, Pr_): return 3.66                                   # T de pared cte., desarrollado\ndef Nu_turb(Re, Pr_):                                              # Gnielinski\n    f = f_turb(Re)\n    return (f / 8) * (Re - 1000) * Pr_ / (1 + 12.7 * np.sqrt(f / 8) * (Pr_ ** (2 / 3) - 1))\n\n\ndef estado(Qlmin, T):\n    \"\"\"Devuelve Re, régimen, h_min, h_max (W/m²K), Δp_min, Δp_max (Pa).\n    En la zona 2300-4000 se dan las dos cotas (laminar y turbulenta).\"\"\"\n    V = Qlmin / 60000 / A\n    Re = rho(T) * V * D / mu(T)\n    dyn = rho(T) * V ** 2 / 2\n    hl = Nu_lam(Re, Pr(T)) * k(T) / D\n    dpl = (f_lam(Re) * L / D + K_TOT) * dyn\n    if Re < RE_LAM:\n        return Re, \"laminar\", hl, hl, dpl, dpl\n    ht = Nu_turb(max(Re, 3000), Pr(T)) * k(T) / D       # Gnielinski: válida para Re > 3000\n    dpt = (f_turb(Re) * L / D + K_TOT) * dyn\n    if Re < RE_TURB:\n        return Re, \"transición\", hl, ht, min(dpl, dpt), max(dpl, dpt)\n    return Re, \"turbulento\", ht, ht, dpt, dpt\n\n\n# ===================================================== 1. DISEÑO \"DE MANUAL\"\nQ1 = RE_TURB * mu(T_NOM) / (rho(T_NOM) * D) * A * 60000\nprint(f\"1. Diseño 'de manual': Re = 4000 a {T_NOM:.0f} °C  ->  Q = {Q1:.2f} L/min por circuito\")\nRe, reg, hmin, hmax, *_ = estado(Q1, T_NOM)\nprint(f\"   A 45 °C: Re = {Re:.0f}, h = {hmin:.0f} W/m²K (exigido {H_MIN:.0f})\")\n\n# ===================================================== 2. BARRIDO EN TEMPERATURA\nprint(f\"\\n2. Barrido en temperatura con Q = {Q1:.2f} L/min\")\nfor T in [20, 30, 45, 60, 70]:\n    Re, reg, h1, h2, d1, d2 = estado(Q1, T)\n    hs = f\"{h1:.0f}\" if h1 == h2 else f\"{h1:.0f} – {h2:.0f}\"\n    print(f\"   {T:3.0f} °C: Re = {Re:6.0f} ({reg:10s}) h = {hs:>12s} W/m²K\")\nT_salida = brentq(lambda T: estado(Q1, T)[0] - RE_TURB, 10, T_NOM)\nprint(f\"   Por debajo de {T_salida:.0f} °C el flujo deja de ser claramente turbulento\")\nL_t = 0.05 * estado(Q1, T_MIN)[0] * Pr(T_MIN) * D\nprint(f\"   Longitud de entrada térmica laminar a 20 °C: 0.05·Re·Pr·D = {L_t:.1f} m (> L = {L} m)\")\nNu_ST = 1.86 * (estado(Q1, T_MIN)[0] * Pr(T_MIN) * D / L) ** (1 / 3)\nprint(f\"   Con Sieder-Tate (entrada térmica): h ≈ {Nu_ST*k(T_MIN)/D:.0f} W/m²K: sigue muy lejos de 4000\")\n\nprint(\"\\n   Δp en función de T para Q = 1.0 L/min (¡aumenta al calentar!):\")\nfor T in [20, 30, 45, 60, 70]:\n    Re, reg, *_, d1, d2 = estado(1.0, T)\n    print(f\"   {T:3.0f} °C: Re = {Re:5.0f} ({reg:10s}) Δp = {d1:6.0f} – {d2:6.0f} Pa\")\n\n# ===================================================== 3. REDISEÑO\nprint(\"\\n3. Rediseño: menor caudal (múltiplo de 0.5 L/min) con h ≥ 4000 W/m²K entre 20 y 70 °C\")\nTs = np.linspace(T_MIN, T_MAX, 51)\nfor q in np.arange(0.5, Q_MAX + 0.01, 0.5):\n    hmin_rango = min(estado(q, T)[2] for T in Ts)\n    if hmin_rango >= H_MIN:\n        print(f\"   Q = {q:.1f} L/min: h mínimo en el rango = {hmin_rango:.0f} W/m²K (a {T_MIN:.0f} °C)\")\n        Qd = q; break\nQr = Qd + 0.5\nprint(f\"   Recomendación con margen: Q = {Qr:.1f} L/min (≤ {Q_MAX} L/min del termorregulador)\")\nfor q in [Qd, Qr]:\n    Re20 = estado(q, T_MIN)[0]; dp20 = estado(q, T_MIN)[5]\n    W = N_CIRC * q / 60000 * dp20 / ETA\n    print(f\"   Q = {q:.1f}: Re(20 °C) = {Re20:.0f}, Δp(20 °C) = {dp20/1e5:.3f} bar, \"\n          f\"caudal total = {N_CIRC*q:.0f} L/min, potencia de bombeo ≈ {W:.0f} W\")\n\n# ===================================================== 4. SENSIBILIDAD\nprint(\"\\n4. Sensibilidad\")\nRe, reg, h1, h2, *_ = estado(Q1, T_MIN)\nprint(f\"   Diseño de manual a 20 °C: Re = {Re:.0f} ({reg}); h entre {h1:.0f} y {h2:.0f} W/m²K \"\n      f\"(incertidumbre × {h2/h1:.0f}): no se puede diseñar dentro de la zona de transición\")\nfor q in [Qd, Qr]:\n    Re20 = estado(q, T_MIN)[0]\n    print(f\"   Q = {q:.1f} L/min: Re mínimo (20 °C) = {Re20:.0f} -> margen respecto a Re = 4000: × {Re20/4000:.1f}\")\nh_10 = estado(Qr, T_MIN)[2] * 0.9\nprint(f\"   Si Gnielinski sobrestimase h un 10 % (su incertidumbre típica), con {Qr:.1f} L/min: h ≈ {h_10:.0f} W/m²K\")\n\n# ----------------------------------------------------------- FIGURAS\nT = np.linspace(15, 75, 241)\nfig, (a1, a2) = plt.subplots(1, 2, figsize=(11, 4.4))\nfor ax in (a1, a2):\n    ax.grid(color=\"#E3E3E3\", lw=0.8)\n    for s in (\"top\", \"right\"):\n        ax.spines[s].set_visible(False)\nfor q, col in [(Q1, \"#C00000\"), (Qr, \"#1F5A8C\")]:\n    E = np.array([estado(q, t)[2:4] for t in T])\n    a1.plot(T, E[:, 0], color=col, lw=2, label=f\"Q = {q:.2f} L/min\")\n    a1.fill_between(T, E[:, 0], E[:, 1], color=col, alpha=0.15, lw=0)\na1.axhline(H_MIN, color=\"#333333\", lw=1, ls=\"--\")\na1.text(52, H_MIN - 380, \"h mínimo exigido\", fontsize=9)\na1.axvspan(T_MIN, T_MAX, color=\"#F4F4F4\", zorder=0)\na1.set_xlabel(\"Temperatura del agua (°C)\"); a1.set_ylabel(\"h (W/m²K)\")\na1.set_title(\"(a) Coeficiente de convección (banda: zona de transición)\", fontsize=10, loc=\"left\")\na1.legend(frameon=False, fontsize=9, loc=(0.02, 0.4))\n\nE = np.array([estado(1.0, t)[4:6] for t in T])\na2.plot(T, E[:, 0], color=\"#333333\", lw=2)\na2.fill_between(T, E[:, 0], E[:, 1], color=\"#FFE08A\", alpha=0.6, lw=0, label=\"zona de transición\")\nlam = [(f_lam(estado(1.0, t)[0]) * L / D + K_TOT) * rho(t) * (1 / 60000 / A) ** 2 / 2 for t in T]\na2.plot(T, lam, color=\"#1F5A8C\", lw=1.5, ls=\":\", label=\"suponiendo siempre laminar\")\na2.set_xlabel(\"Temperatura del agua (°C)\"); a2.set_ylabel(\"Δp (Pa)\")\na2.set_title(\"(b) Pérdida de presión con Q = 1.0 L/min\", fontsize=10, loc=\"left\")\na2.legend(frameon=False, fontsize=9)\nfig.tight_layout(); fig.savefig(\"figura_solucion_molde.png\", dpi=200)\nplt.show()\n"}, "turbulencia2": {"ej10_escalas_kolmogorov.py": "\"\"\"\nSistemas de fluidos - GITI\nEjemplo numérico 10: ESCALAS DE KOLMOGOROV EN FLUJOS REALES\n\nPara una tubería, la disipación media por unidad de masa es exacta a partir de la\npérdida de carga (parte 1):  ε = Δp·Q / (ρ·A·L) = f V³ / (2D)\nCon ε se obtienen las escalas de Kolmogorov (diap. 32):\n    η = (ν³/ε)^(1/4),  τ_η = (ν/ε)^(1/2),  u_η = (νε)^(1/4)\ny una estimación del número de puntos de una simulación directa (DNS) de un tramo\nde 10 diámetros con resolución ~η:  N ≈ 10·(D/η)³\nRequiere: numpy, scipy\n\"\"\"\nimport numpy as np\nfrom scipy.optimize import brentq\n\n\ndef f_colebrook(Re, eD=0.0):\n    return brentq(lambda f: 1 / np.sqrt(f) + 2 * np.log10(eD / 3.7 + 2.51 / (Re * np.sqrt(f))), 1e-4, 1)\n\n\nNU_AGUA, NU_AIRE = 1.0e-6, 1.5e-5\ncasos = []\n# tuberías y conductos: (nombre, D, V, ν, ε/D)\nfor nom, D, V, nu, eD in [(\"Tubería doméstica de agua\", 0.015, 1.0, NU_AGUA, 0.0),\n                          (\"Conducción de agua (ejemplo 6)\", 0.30, 1.41, NU_AGUA, 1.5e-4),\n                          (\"Conducto de ventilación\", 0.40, 5.0, NU_AIRE, 2e-4),\n                          (\"Gasoducto (gas a 60 bar)\", 0.90, 10.0, 2.5e-7, 2e-5)]:\n    Re = V * D / nu\n    f = f_colebrook(Re, eD)\n    eps = f * V ** 3 / (2 * D)\n    casos.append((nom, Re, eps, nu, D))\n# otros flujos: ε estimada\ncasos.append((\"Biorreactor agitado (1 kW/m³)\", np.nan, 1.0, NU_AGUA, np.nan))\ncasos.append((\"Capa límite atmosférica (z = 10 m)\", np.nan, 0.4 ** 3 / (0.41 * 10), NU_AIRE, np.nan))\n\nprint(f\"{'flujo':38s} {'Re':>9} {'ε (W/kg)':>10} {'η (μm)':>9} {'τ_η (ms)':>9} {'N para DNS':>11}\")\nfor nom, Re, eps, nu, D in casos:\n    eta = (nu ** 3 / eps) ** 0.25\n    tau = (nu / eps) ** 0.5\n    N = 10 * (D / eta) ** 3 if not np.isnan(D) else np.nan\n    print(f\"{nom:38s} {Re:9.2e} {eps:10.3g} {eta*1e6:9.1f} {tau*1e3:9.2f} {N:11.1e}\")\nprint(\"\\nComparación: una malla RANS típica tiene 10⁶–10⁷ celdas.\")\nprint(\"Células animales en suspensión miden ~10–20 μm: en el biorreactor η es del mismo orden.\")\n", "ej11_ml_extrapolacion.py": "\"\"\"\nSistemas de fluidos - GITI\nEjemplo numérico 11: UN MODELO APRENDIDO DE DATOS, ¿FUNCIONA FUERA DE SUS DATOS?\n\n\"Medimos\" el factor de fricción de una tubería lisa solo entre Re = 5·10³ y 10⁵\n(datos de Colebrook con un 2 % de ruido) y ajustamos tres modelos:\n  (a) una red neuronal (perceptrón multicapa) que aprende log f = F(log Re),\n  (b) un polinomio de grado 6 en log Re,\n  (c) un modelo con forma física: 1/√f = A·log10(Re·√f) + B  (ley de Prandtl, 2 coeficientes).\nDespués los usamos fuera del rango de entrenamiento: Re hasta 10⁷ (gasoductos) y\nRe = 500 (laminar: ¡ninguno de los datos lo era!).\nRequiere: numpy, scipy, scikit-learn, matplotlib\n\"\"\"\nimport numpy as np\nimport matplotlib.pyplot as plt\nfrom scipy.optimize import brentq\nfrom sklearn.neural_network import MLPRegressor\n\nrng = np.random.default_rng(0)\n\n\ndef f_colebrook(Re):\n    return brentq(lambda f: 1 / np.sqrt(f) + 2 * np.log10(2.51 / (Re * np.sqrt(f))), 1e-4, 1)\n\n\n# ---------------------------------------------- \"datos experimentales\"\nRe_tr = np.logspace(np.log10(5e3), 5, 40)\nf_tr = np.array([f_colebrook(r) for r in Re_tr]) * (1 + 0.02 * rng.standard_normal(Re_tr.size))\nx_tr, y_tr = np.log10(Re_tr), np.log10(f_tr)\n\n# (a) red neuronal\nym, ys = y_tr.mean(), y_tr.std()\nmlp = MLPRegressor(hidden_layer_sizes=(32, 32), activation=\"tanh\", solver=\"lbfgs\", max_iter=20000,\n                   tol=1e-10, alpha=1e-4, random_state=0).fit(((x_tr - 4.2) / 0.4)[:, None], (y_tr - ym) / ys)\nf_mlp = lambda Re: 10 ** (ym + ys * mlp.predict(((np.log10(Re) - 4.2) / 0.4)[:, None]))\n# (b) polinomio\ncp = np.polyfit(x_tr - 4, y_tr, 6)\nf_pol = lambda Re: 10 ** np.polyval(cp, np.log10(Re) - 4)\n# (c) forma física: 1/√f = A log10(Re√f) + B  (lineal en A, B)\nAmat = np.c_[np.log10(Re_tr * np.sqrt(f_tr)), np.ones_like(Re_tr)]\nA, B = np.linalg.lstsq(Amat, 1 / np.sqrt(f_tr), rcond=None)[0]\nf_fis = lambda Re: np.array([brentq(lambda f: 1 / np.sqrt(f) - A * np.log10(r * np.sqrt(f)) - B, 1e-4, 1) for r in np.atleast_1d(Re)])\nprint(f\"Ley física ajustada: 1/√f = {A:.3f}·log10(Re√f) {B:+.3f}   (Prandtl: 2.0 y −0.8)\\n\")\n\nprint(f\"{'Re':>10} {'f real':>8} {'red neuronal':>14} {'polinomio':>12} {'forma física':>14}\")\nfor Re in [5e2, 5e3, 3e4, 1e5, 1e6, 1e7]:\n    fr = 64 / Re if Re < 2300 else f_colebrook(Re)\n    vals = [m(np.array([Re]))[0] for m in (f_mlp, f_pol, f_fis)]\n    txt = \"  \".join(f\"{v:.4f} ({100*(v/fr-1):+5.0f}%)\" for v in vals)\n    tag = \" (dentro)\" if 5e3 <= Re <= 1e5 else \" (FUERA)\"\n    print(f\"{Re:10.0e} {fr:8.4f}  {txt}{tag}\")\nprint(\"\\nNinguno predice el régimen laminar: los datos no lo contenían.\")\n\n# ----------------------------------------------------------- GRÁFICA\nRe = np.logspace(np.log10(400), 7, 300)\nfr = np.where(Re < 2300, 64 / Re, [f_colebrook(r) for r in Re])\nfig, (a1, a2) = plt.subplots(1, 2, figsize=(11, 4.3))\nfor ax in (a1, a2):\n    ax.grid(color=\"#E3E3E3\", lw=0.8, which=\"both\")\n    for sp in (\"top\", \"right\"): ax.spines[sp].set_visible(False)\n    ax.axvspan(5e3, 1e5, color=\"#E8F5E9\", zorder=0)\na1.loglog(Re, fr, color=\"#333333\", lw=2.5, label=\"real\")\na1.loglog(Re_tr, f_tr, \"o\", ms=4, color=\"#333333\", mfc=\"white\", label=\"datos de entrenamiento\")\nfor fun, c, lab in [(f_mlp, \"#C00000\", \"red neuronal\"), (f_pol, \"#7A5A00\", \"polinomio grado 6\"), (f_fis, \"#1F5A8C\", \"forma física (2 coef.)\")]:\n    a1.loglog(Re, fun(Re), color=c, lw=1.8, label=lab)\na1.set_ylim(4e-3, 0.1); a1.set_xlabel(\"Re\"); a1.set_ylabel(\"f\")\na1.set_title(\"(a) Factor de fricción\", fontsize=11, loc=\"left\"); a1.legend(frameon=False, fontsize=8)\nfor fun, c, lab in [(f_mlp, \"#C00000\", \"red neuronal\"), (f_pol, \"#7A5A00\", \"polinomio\"), (f_fis, \"#1F5A8C\", \"forma física\")]:\n    a2.semilogx(Re, 100 * (fun(Re) / fr - 1), color=c, lw=1.8, label=lab)\na2.axhline(0, color=\"#999999\", lw=1); a2.set_ylim(-60, 60)\na2.text(6e3, 50, \"zona de\\nentrenamiento\", fontsize=9, color=\"#2E7D32\")\na2.set_xlabel(\"Re\"); a2.set_ylabel(\"error (%)\")\na2.set_title(\"(b) Error: bien dentro, mal fuera\", fontsize=11, loc=\"left\"); a2.legend(frameon=False, fontsize=8, loc=\"lower right\")\nfig.tight_layout(); fig.savefig(\"ej11_ml_extrapolacion.png\", dpi=200)\nplt.show()\n", "ej8_kelvin_helmholtz.py": "\"\"\"\nSistemas de fluidos - GITI\nEjemplo numérico 8: KELVIN-HELMHOLTZ EN INGENIERÍA. ¿CUÁNTA CIZALLA HACE FALTA?\n\nRelación de dispersión de Kelvin-Helmholtz (diap. 15-16) con tensión superficial σ_s\n(fluido 1 ligero arriba, fluido 2 pesado abajo). La interfase es inestable si\n\n    ρ1ρ2 ΔU² / (ρ1+ρ2)²  >  [ (ρ2-ρ1) g / k + σ_s k ] / (ρ1+ρ2)\n\nLa gravedad estabiliza las ondas largas y la tensión superficial las cortas, así que\nexiste una diferencia de velocidades mínima:\n    k* = sqrt((ρ2-ρ1) g / σ_s),   ΔU_min² = 2 (ρ1+ρ2)/(ρ1 ρ2) · sqrt((ρ2-ρ1) g σ_s)\n\nComparamos tres casos con la MISMA física y propiedades distintas.\nRequiere: numpy, matplotlib\n\"\"\"\nimport numpy as np\nimport matplotlib.pyplot as plt\n\nG = 9.81\nCASOS = {\n    \"aire sobre agua (viento y oleaje)\": dict(r1=1.2, r2=1000.0, s=0.073),\n    \"gas a 60 bar sobre petróleo (tubería)\": dict(r1=50.0, r2=850.0, s=0.020),\n    \"aire frío bajo aire cálido (inversión térmica, ±1 %)\": dict(r1=1.20, r2=1.212, s=0.0),\n}\n\n\ndef tasa(k, dU, r1, r2, s):\n    \"\"\"tasa de crecimiento k·c_i (1/s); 0 si es estable\"\"\"\n    disc = r1 * r2 * dU ** 2 / (r1 + r2) ** 2 - ((r2 - r1) * G / k + s * k) / (r1 + r2)\n    return k * np.sqrt(np.clip(disc, 0, None))\n\n\nprint(f\"{'caso':55s} {'ΔU mínima':>10} {'λ más inestable al umbral':>26}\")\nfor nom, p in CASOS.items():\n    if p[\"s\"] > 0:\n        ks = np.sqrt((p[\"r2\"] - p[\"r1\"]) * G / p[\"s\"])\n        dUmin = np.sqrt(2 * (p[\"r1\"] + p[\"r2\"]) / (p[\"r1\"] * p[\"r2\"]) * np.sqrt((p[\"r2\"] - p[\"r1\"]) * G * p[\"s\"]))\n        print(f\"{nom:55s} {dUmin:8.2f} m/s {100*2*np.pi/ks:22.2f} cm\")\n    else:\n        print(f\"{nom:55s} {'0 (sin σ)':>10}   inestable si λ < 2π ρ1ρ2ΔU²/(g(ρ2²-ρ1²))\")\np = CASOS[\"aire frío bajo aire cálido (inversión térmica, ±1 %)\"]\nfor dU in (2, 5, 10):\n    lmax = 2 * np.pi * p[\"r1\"] * p[\"r2\"] * dU ** 2 / (G * (p[\"r2\"] ** 2 - p[\"r1\"] ** 2))\n    print(f\"   inversión, ΔU = {dU:2d} m/s: inestables las ondas con λ < {lmax:6.0f} m\")\n\n# ----------------------------------------------------------- GRÁFICAS\nfig, (a1, a2) = plt.subplots(1, 2, figsize=(11, 4.3))\nfor ax in (a1, a2):\n    ax.grid(color=\"#E3E3E3\", lw=0.8, which=\"both\")\n    for sp in (\"top\", \"right\"): ax.spines[sp].set_visible(False)\nlam = np.logspace(-3, 0, 400); k = 2 * np.pi / lam\np = CASOS[\"aire sobre agua (viento y oleaje)\"]\nfor dU, c in [(6.0, \"#999999\"), (7.0, \"#1F5A8C\"), (8.0, \"#7A5A00\"), (10.0, \"#C00000\")]:\n    a1.semilogx(lam * 100, tasa(k, dU, **p), color=c, lw=2, label=f\"ΔU = {dU:.0f} m/s\")\na1.set_xlabel(\"longitud de onda λ (cm)\"); a1.set_ylabel(\"tasa de crecimiento k·c$_i$ (1/s)\")\na1.set_title(\"(a) Aire sobre agua: hace falta ΔU > 6.7 m/s\", fontsize=11, loc=\"left\"); a1.legend(frameon=False)\ndU = np.linspace(0.1, 12, 300)\ncols = [\"#1F5A8C\", \"#C00000\"]\nfor (nom, p), c in zip(list(CASOS.items())[:2], cols):\n    kk = np.logspace(0, 5, 1500)\n    sm = [tasa(kk, d, **p).max() for d in dU]\n    a2.plot(dU, sm, color=c, lw=2.2, label=nom)\na2.set_xlabel(\"ΔU (m/s)\"); a2.set_ylabel(\"tasa de crecimiento máxima (1/s)\")\na2.set_title(\"(b) Misma física, umbral 10 veces menor\", fontsize=11, loc=\"left\"); a2.legend(frameon=False, fontsize=9)\na2.set_yscale(\"log\"); a2.set_ylim(1, 1e5)\nfig.tight_layout(); fig.savefig(\"ej8_kelvin_helmholtz.png\", dpi=200)\nplt.show()\n", "ej9_tiempo_medida.py": "\"\"\"\nSistemas de fluidos - GITI\nEjemplo numérico 9: ¿CUÁNTO TIEMPO HAY QUE MEDIR PARA OBTENER LA VELOCIDAD MEDIA?\n\nAplicación de la separación de escalas (diap. 23-24) a una medida real: un anemómetro\nen un emplazamiento eólico mide u(t) = U(t) + u'(t).\n  - u'(t): turbulencia, simulada como un proceso aleatorio con escala integral T_int\n    (proceso de Ornstein-Uhlenbeck) e intensidad de turbulencia I = σ_u / U.\n  - U(t): el viento medio cambia lentamente (aquí, un ciclo diario).\nError aleatorio de la media en un intervalo Δt (teoría, Δt >> T_int):\n    σ_media ≈ σ_u · sqrt(2 T_int / Δt)\nError sistemático si Δt es comparable a la escala de variación de U(t).\nRequiere: numpy, matplotlib\n\"\"\"\nimport numpy as np\nimport matplotlib.pyplot as plt\n\nrng = np.random.default_rng(1)\nU0, AMP, PERIODO = 8.0, 3.0, 86400.0      # viento medio (m/s), amplitud del ciclo diario, periodo (s)\nI, T_INT, DT = 0.12, 10.0, 0.5             # intensidad de turbulencia, escala integral (s), muestreo (s)\nDURACION = 2 * 86400.0\n\nt = np.arange(0, DURACION, DT)\nUmed = U0 + AMP * np.sin(2 * np.pi * t / PERIODO)\nsig = I * U0\na = np.exp(-DT / T_INT)\nup = np.empty_like(t); up[0] = 0.0\nruido = rng.standard_normal(t.size) * sig * np.sqrt(1 - a ** 2)\nfor i in range(1, t.size):\n    up[i] = a * up[i - 1] + ruido[i]\nu = Umed + up\n\nprint(f\"Viento medio {U0} m/s, ciclo diario ±{AMP} m/s, I = {100*I:.0f} %, T_int = {T_INT} s\\n\")\nprint(f\"{'Δt':>9} {'error aleatorio (teoría)':>25} {'(simulado)':>11} {'sesgo máx. por el ciclo diario':>31}\")\nres = []\nfor dt_av in [10, 60, 600, 3600, 6 * 3600]:\n    n = int(dt_av / DT)\n    nb = t.size // n\n    medias = u[: nb * n].reshape(nb, n).mean(axis=1)\n    verd = Umed[: nb * n].reshape(nb, n).mean(axis=1)\n    err_sim = np.std(medias - verd)\n    err_teo = sig * np.sqrt(2 * T_INT / dt_av)\n    x = np.pi * dt_av / PERIODO\n    sesgo = AMP * (1 - np.sin(x) / x)    # el promedio \"aplana\" el pico del ciclo\n    res.append((dt_av, err_teo, err_sim, sesgo))\n    lab = f\"{dt_av/60:.0f} min\" if dt_av >= 60 else f\"{dt_av} s\"\n    print(f\"{lab:>9} {err_teo:22.3f} m/s {err_sim:8.3f} m/s {sesgo:27.3f} m/s\")\nprint(\"\\n-> 10 minutos (el estándar en energía eólica) cumple T_int << Δt << periodo del viento medio\")\n\n# ----------------------------------------------------------- GRÁFICAS\nfig, (a1, a2) = plt.subplots(1, 2, figsize=(11, 4.3))\nfor ax in (a1, a2):\n    ax.grid(color=\"#E3E3E3\", lw=0.8, which=\"both\")\n    for sp in (\"top\", \"right\"): ax.spines[sp].set_visible(False)\nh = t / 3600\nsel = slice(0, int(86400 / DT))\na1.plot(h[sel], u[sel], color=\"#BBBBBB\", lw=0.3, label=\"medida instantánea\")\nfor dt_av, c in [(600, \"#1F5A8C\"), (6 * 3600, \"#C00000\")]:\n    n = int(dt_av / DT); nb = int(86400 / DT) // n\n    m = u[: nb * n].reshape(nb, n).mean(axis=1)\n    a1.stairs(m, np.arange(nb + 1) * dt_av / 3600, color=c, lw=2, label=f\"media en {dt_av/60:.0f} min\")\na1.plot(h[sel], Umed[sel], color=\"#333333\", lw=1.2, ls=\"--\", label=\"viento medio real\")\na1.set_xlabel(\"t (h)\"); a1.set_ylabel(\"u (m/s)\"); a1.set_xlim(0, 24)\na1.set_title(\"(a) Un día de medida\", fontsize=11, loc=\"left\"); a1.legend(frameon=False, fontsize=8, loc=\"lower left\")\nR = np.array(res)\ndts = np.logspace(1, np.log10(6 * 3600), 100)\na2.loglog(dts / 60, sig * np.sqrt(2 * T_INT / dts), color=\"#1F5A8C\", lw=2, label=\"error aleatorio (turbulencia), teoría\")\na2.text(0.2, 0.35, \"puntos: simulación\\n(Δt = 10 s no cumple Δt ≫ T$_{int}$)\", fontsize=8, color=\"#1F5A8C\")\na2.loglog(R[:, 0] / 60, R[:, 2], \"o\", color=\"#1F5A8C\", mec=\"white\")\nx = np.pi * dts / PERIODO\na2.loglog(dts / 60, AMP * (1 - np.sin(x) / x), color=\"#C00000\", lw=2, label=\"sesgo (ciclo diario)\")\na2.axvspan(5, 30, color=\"#E8F5E9\", zorder=0); a2.text(6, 1.5, \"≈ 10 min\", color=\"#2E7D32\", fontsize=9)\na2.set_xlabel(\"tiempo de promediado Δt (min)\"); a2.set_ylabel(\"error (m/s)\"); a2.set_ylim(1e-3, 3)\na2.set_title(\"(b) Ni muy corto ni muy largo\", fontsize=11, loc=\"left\"); a2.legend(frameon=False, fontsize=9)\nfig.tight_layout(); fig.savefig(\"ej9_tiempo_medida.png\", dpi=200)\nplt.show()\n"}, "computacional": {"cfd1_tamano_malla.py": "\"\"\"\nSistemas de fluidos - GITI · Dinámica de fluidos computacional\nEjemplo C1: ¿CUÁNTAS CELDAS NECESITO? (antes de abrir el programa de CFD)\n\nDos estimaciones de orden de magnitud que conviene hacer SIEMPRE antes de mallar:\n\n1) Coste de una simulación directa (DNS) que resuelva todas las escalas.\n   Escala de Kolmogorov: η/L ~ Re^(-3/4)  →  puntos por dirección ~ Re^(3/4)\n   puntos en 3D ~ Re^(9/4);  pasos de tiempo (CFL con Δx ~ η) ~ Re^(3/4)\n   coste total ~ Re^3.  (Solo órdenes de magnitud: las constantes dependen del flujo.)\n\n2) Altura de la primera celda junto a la pared en una simulación RANS.\n   y+ = y·u_τ/ν,   u_τ = sqrt(τ_w/ρ)\n   - \"resolver la pared\" (modelos de bajo Re, k-ω SST sin funciones de pared): y+ ≈ 1\n   - funciones de pared: 30 < y+ < 300\n   - y+ entre 5 y 30 (capa de amortiguamiento): ni lo uno ni lo otro → error típico.\nRequiere: numpy\n\"\"\"\nimport numpy as np\n\n# ---------------------------------------------------------------- 1) DNS\nCASOS = [  # nombre, U (m/s), L (m), ν (m²/s)\n    (\"tubería de agua D = 10 cm, 2 m/s\", 2.0, 0.10, 1.0e-6),\n    (\"coche, 30 m/s, L = 4 m\", 30.0, 4.0, 1.5e-5),\n    (\"ala de avión comercial, 70 m/s, cuerda 5 m\", 70.0, 5.0, 1.5e-5),\n]\nFLOP_PUNTO_PASO = 1e3        # operaciones por punto y paso de tiempo (orden de magnitud)\nMAQUINA = 1e15               # 1 PFLOP/s sostenido (un superordenador mediano)\n\nprint(\"1) Coste de una DNS (órdenes de magnitud)\\n\")\nprint(f\"{'caso':44s} {'Re':>9s} {'puntos':>9s} {'pasos':>8s} {'tiempo con 1 PFLOP/s':>22s}\")\nfor nombre, U, L, nu in CASOS:\n    Re = U * L / nu\n    N = Re ** (9 / 4); Nt = Re ** (3 / 4)\n    seg = N * Nt * FLOP_PUNTO_PASO / MAQUINA\n    if seg < 3600:\n        t = f\"{seg/60:.1f} min\"\n    elif seg < 3.15e7:\n        t = f\"{seg/86400:.1f} días\"\n    else:\n        t = f\"{seg/3.15e7:.1e} años\"\n    print(f\"{nombre:44s} {Re:9.1e} {N:9.1e} {Nt:8.1e} {t:>22s}\")\nprint(\"\\n→ Por eso en ingeniería casi nunca se hace DNS: se usan RANS o LES, que MODELAN parte de la física.\")\n\n# ------------------------------------------------- 2) primera celda (RANS)\nprint(\"\\n2) Altura de la primera celda en una tubería de agua (D = 10 cm, ν = 1e-6 m²/s, lisa)\\n\")\nD, NU, RHO = 0.10, 1.0e-6, 998.0\nprint(f\"{'V (m/s)':>8s} {'Re':>9s} {'f':>7s} {'u_τ (m/s)':>10s} {'y(y+=1)':>10s} {'y(y+=30)':>10s} {'y(y+=300)':>10s}\")\nfor V in [0.5, 1.0, 2.0, 4.0]:\n    Re = V * D / NU\n    f = (-1.8 * np.log10(6.9 / Re)) ** -2               # Haaland, tubo liso\n    ut = V * np.sqrt(f / 8)\n    y = lambda yp: yp * NU / ut\n    print(f\"{V:8.1f} {Re:9.1e} {f:7.4f} {ut:10.4f} {y(1)*1e6:8.1f} µm {y(30)*1e3:7.2f} mm {y(300)*1e3:7.2f} mm\")\n\nV = 2.0; Re = V * D / NU; f = (-1.8 * np.log10(6.9 / Re)) ** -2; ut = V * np.sqrt(f / 8)\ny1 = NU / ut\nprint(f\"\\nCon V = 2 m/s, y+ = 1 exige una primera celda de {y1*1e6:.0f} µm, es decir D/{D/y1:.0f}.\")\n# capas prismáticas con crecimiento geométrico r hasta alcanzar ~ el 20 % del radio\nfor r in [1.1, 1.2]:\n    n = int(np.ceil(np.log(1 + 0.2 * D / 2 * (r - 1) / y1) / np.log(r)))\n    print(f\"  capas con razón de crecimiento {r}: hacen falta {n} capas para cubrir el 20 % del radio\")\nprint(\"Si la malla se hizo para una velocidad y luego se calcula otra, y+ cambia (∝ V^0.9):\\n\"\n      \"¡hay que comprobar y+ en CADA cálculo, no solo en el primero!\")\n", "cfd2_orden_error.py": "\"\"\"\nSistemas de fluidos - GITI · Dinámica de fluidos computacional\nEjemplo C2: ORDEN DE UN ESQUEMA, ERROR DE REDONDEO Y MALLAS NO UNIFORMES\n\nProblema de ingeniería: calcular el flujo de calor en la pared q_w = -k (dT/dy)_pared a partir\nde un perfil de temperatura conocido solo en nodos (como hace un programa de CFD).\nPerfil de prueba (capa límite térmica aproximada), temperaturas absolutas en K:\n    T(y) = T_w - ΔT·(1 - exp(-y/δ))  →  q_w = k·ΔT/δ\n\n(a) Derivada descentrada en la pared:\n      1er orden:  (u1 - u0)/Δy                     error ~ Δy\n      2º orden :  (-3u0 + 4u1 - u2)/(2Δy)           error ~ Δy²\n    Si Δy es MUY pequeño aparece el error de redondeo (~ ε_máquina/Δy):\n    afinar más la malla EMPEORA el resultado. En simple precisión (float32, habitual\n    en GPU) ocurre mucho antes.\n(b) Derivada centrada en mallas no uniformes: el mismo esquema \"de 2º orden\" pasa a\n    ser de 1er orden si el espaciado cambia bruscamente de un nodo a otro.\nRequiere: numpy, matplotlib\n\"\"\"\nimport numpy as np\nimport matplotlib.pyplot as plt\n\nTW, DT_, DELTA, K = 350.0, 20.0, 1.0e-3, 0.6   # K, K, m, W/(m·K) (agua)\nexacto = K * DT_ / DELTA                         # q_w exacto (W/m²)\n\n# ---------------------------------------------------------------- (a)\ndys = np.logspace(-12, -3.7, 120)\nres = {}\nfor dt in (np.float64, np.float32):\n    e1, e2 = [], []\n    for dy in dys:\n        y = np.array([0, dy, 2 * dy], dtype=dt)\n        u = (dt(TW) - dt(DT_) * (1 - np.exp(-y / dt(DELTA)))).astype(dt)\n        g1 = (u[1] - u[0]) / dt(dy)\n        g2 = (-3 * u[0] + 4 * u[1] - u[2]) / (2 * dt(dy))\n        e1.append(abs(-K * float(g1) - exacto) / exacto)\n        e2.append(abs(-K * float(g2) - exacto) / exacto)\n    res[dt.__name__] = (np.array(e1), np.array(e2))\n\ni = np.argmin(res[\"float64\"][1])\nprint(f\"q_w exacto = {exacto:.0f} W/m²\")\nprint(f\"float64: mejor Δy para 2º orden ≈ {dys[i]:.1e} m (error relativo {res['float64'][1][i]:.1e})\")\nj = np.argmin(res[\"float32\"][1])\nprint(f\"float32: mejor Δy para 2º orden ≈ {dys[j]:.1e} m (error relativo {res['float32'][1][j]:.1e})\")\n\n# ---------------------------------------------------------------- (b)\nf = lambda x: np.sin(2 * np.pi * x)\ndf = lambda x: 2 * np.pi * np.cos(2 * np.pi * x)\nrng = np.random.default_rng(3)\nNs = np.array([10, 20, 40, 80, 160, 320, 640])\nerr_u, err_s, err_r = [], [], []\n\n\ndef centrada(x):\n    \"\"\"derivada centrada (u_{i+1}-u_{i-1})/(x_{i+1}-x_{i-1}), la que se usa a menudo sin pensar\"\"\"\n    u = f(x)\n    d = (u[2:] - u[:-2]) / (x[2:] - x[:-2])\n    return np.max(np.abs(d - df(x[1:-1])))\n\n\nfor N in Ns:\n    xu = np.linspace(0, 1, N + 1)\n    xs = (np.exp(2 * xu) - 1) / (np.exp(2) - 1)               # estiramiento SUAVE\n    h = 1 + 0.5 * rng.random(N); xr = np.concatenate([[0], np.cumsum(h)]) / h.sum()  # espaciado irregular\n    err_u.append(centrada(xu)); err_s.append(centrada(xs)); err_r.append(centrada(xr))\n\norden = lambda e: np.polyfit(np.log(1 / Ns[-4:]), np.log(np.array(e)[-4:]), 1)[0]\nprint(f\"\\nOrden observado de la derivada centrada: malla uniforme {orden(err_u):.2f}, \"\n      f\"estiramiento suave {orden(err_s):.2f}, espaciado irregular {orden(err_r):.2f}\")\n\n# ----------------------------------------------------------- GRÁFICAS\nfig, (a1, a2) = plt.subplots(1, 2, figsize=(11, 4.4))\nfor ax in (a1, a2):\n    ax.grid(color=\"#E3E3E3\", lw=0.8, which=\"both\")\n    for s in (\"top\", \"right\"):\n        ax.spines[s].set_visible(False)\na1.loglog(dys / DELTA, res[\"float64\"][0], color=\"#7A5A00\", lw=1.6, label=\"1er orden, doble precisión\")\na1.loglog(dys / DELTA, res[\"float64\"][1], color=\"#1F5A8C\", lw=2, label=\"2º orden, doble precisión\")\na1.loglog(dys / DELTA, res[\"float32\"][1], color=\"#C00000\", lw=1.6, ls=\"--\", label=\"2º orden, simple precisión\")\na1.set_ylim(1e-13, 10); a1.set_xlabel(\"Δy / δ\"); a1.set_ylabel(\"error relativo en q$_w$\")\na1.text(3e-4, 1e-7, \"error de\\ntruncamiento\", fontsize=9)\na1.text(3e-9, 1e-4, \"error de\\nredondeo\", fontsize=9, color=\"#555555\")\na1.set_title(\"(a) Más fino no siempre es mejor\", fontsize=11, loc=\"left\")\na1.legend(frameon=False, fontsize=8.5, loc=\"lower left\")\n\na2.loglog(1 / Ns, err_u, \"o-\", color=\"#1F5A8C\", lw=2, label=f\"uniforme (orden {orden(err_u):.1f})\")\na2.loglog(1 / Ns, err_s, \"s-\", color=\"#7A5A00\", lw=1.6, label=f\"estiramiento suave (orden {orden(err_s):.1f})\")\na2.loglog(1 / Ns, err_r, \"^-\", color=\"#C00000\", lw=1.6, label=f\"espaciado irregular (orden {orden(err_r):.1f})\")\na2.set_xlabel(\"1/N  (tamaño medio de celda)\"); a2.set_ylabel(\"error máximo en f'(x)\")\na2.set_title(\"(b) Derivada centrada en mallas no uniformes\", fontsize=11, loc=\"left\")\na2.legend(frameon=False, fontsize=8.5, loc=\"lower right\")\nfig.tight_layout(); fig.savefig(\"cfd2_orden_error.png\", dpi=200)\nplt.show()\n", "cfd3_difusion_estabilidad.py": "\"\"\"\nSistemas de fluidos - GITI · Dinámica de fluidos computacional\nEjemplo C3: ARRANQUE DE UN FLUJO DE COUETTE. ESTABLE NO ES LO MISMO QUE CORRECTO\n\nAceite entre dos placas separadas h = 1 cm. En t = 0 la placa inferior se pone a U = 1 m/s.\nLa velocidad obedece a la ecuación de difusión  ∂u/∂t = ν ∂²u/∂y²  con\nu(0,t) = U, u(h,t) = 0, u(y,0) = 0. Solución exacta (serie):\n    u/U = 1 - y/h - Σ 2/(nπ) sin(nπy/h) exp(-n²π² ν t / h²)\n\nDiscretización espacial centrada (N celdas) y tres esquemas temporales.\nNúmero de difusión d = ν Δt / Δy²   (en los apuntes, CFL = 2d)\n  - Euler explícito: estable solo si d ≤ 1/2.\n  - Euler implícito: estable para todo d, pero con d grande el transitorio sale retrasado.\n  - Crank-Nicolson: estable para todo d y de 2º orden... pero con d grande produce\n    oscilaciones sin sentido físico cerca del arranque brusco.\nMagnitud de diseño: esfuerzo sobre la placa FIJA, τ = -μ (∂u/∂y)_{y=h}, que es la\nfuerza que \"nota\" la placa cuando el movimiento se ha transmitido.\nRequiere: numpy, scipy, matplotlib\n\"\"\"\nimport numpy as np\nimport matplotlib.pyplot as plt\nfrom scipy.linalg import solve_banded\n\nH, U, NU, RHO = 0.01, 1.0, 1.0e-4, 880.0        # m, m/s, m²/s, kg/m³ (aceite)\nMU = RHO * NU\nN = 40\ndy = H / N\ny = np.linspace(0, H, N + 1)\nt_dif = H ** 2 / NU\nprint(f\"tiempo característico de difusión h²/ν = {t_dif:.2f} s;  Δy²/ν = {dy**2/NU*1e3:.2f} ms\")\n\n\ndef exacta(t, yy=y, nmax=400):\n    n = np.arange(1, nmax + 1)[:, None]\n    return U * (1 - yy / H) - U * np.sum(2 / (n * np.pi) * np.sin(n * np.pi * yy / H)\n                                         * np.exp(-n ** 2 * np.pi ** 2 * NU * t / H ** 2), axis=0)\n\n\ndef tau_fija(u):            # 2º orden descentrado en y = h\n    return -MU * (3 * u[-1] - 4 * u[-2] + u[-3]) / (2 * dy)\n\n\ndef resolver(esquema, d, t_fin):\n    dt = d * dy ** 2 / NU\n    nt = int(round(t_fin / dt))\n    u = np.zeros(N + 1); u[0] = U\n    th = {\"explícito\": 0.0, \"implícito\": 1.0, \"Crank-Nicolson\": 0.5}[esquema]\n    # matriz (1 + 2θd) en la diagonal, -θd fuera, para nodos interiores\n    m = N - 1\n    ab = np.zeros((3, m)); ab[0, 1:] = -th * d; ab[1, :] = 1 + 2 * th * d; ab[2, :-1] = -th * d\n    hist_t, hist_tau = [0.0], [tau_fija(u)]\n    for k in range(nt):\n        lap = u[2:] - 2 * u[1:-1] + u[:-2]\n        rhs = u[1:-1] + (1 - th) * d * lap\n        rhs[0] += th * d * U                         # contorno (u = U en y = 0)\n        u[1:-1] = rhs if th == 0 else solve_banded((1, 1), ab, rhs)\n        if not np.all(np.isfinite(u)) or np.max(np.abs(u)) > 1e6:\n            u[:] = np.nan; break\n        hist_t.append((k + 1) * dt); hist_tau.append(tau_fija(u))\n    return u, np.array(hist_t), np.array(hist_tau), dt\n\n\nT1 = 0.05 * t_dif            # instante en que se comparan los perfiles\ncasos = [(\"explícito\", 0.49), (\"explícito\", 0.51), (\"implícito\", 10.0), (\"Crank-Nicolson\", 10.0)]\nue = exacta(T1)\nprint(f\"\\nPerfil en t = {T1:.3f} s ({T1/t_dif:.2f}·h²/ν):\")\nsol = {}\nfor esq, d in casos:\n    u, ht, htau, dt = resolver(esq, d, T1)\n    sol[(esq, d)] = (u, ht, htau)\n    err = np.max(np.abs(u - ue)) / U\n    print(f\"  {esq:15s} d = {d:5.2f}  Δt = {dt*1e3:7.2f} ms   error máximo = {100*err:7.2f} % de U\")\nfor tf in (0.1, 0.15):\n    u, _, _, _ = resolver(\"explícito\", 0.51, tf)\n    print(f\"  explícito, d = 0.51, en t = {tf} s: max|u| = {np.nanmax(np.abs(u)):.1e} m/s  → la solución explota\")\n\n# Crank-Nicolson: oscilaciones con d grande en el primer paso\nu_cn1, _, _, _ = resolver(\"Crank-Nicolson\", 10.0, 10.0 * dy ** 2 / NU)\nprint(f\"\\nCrank-Nicolson, d = 10, tras UN paso: u mínima = {u_cn1.min():.3f} m/s, máxima = {u_cn1.max():.3f} m/s \"\n      f\"(la física exige 0 ≤ u ≤ {U})\")\n\n# ----------------------------------------------------------- GRÁFICAS\nfig, (a1, a2) = plt.subplots(1, 2, figsize=(11, 4.4))\nfor ax in (a1, a2):\n    ax.grid(color=\"#E3E3E3\", lw=0.8)\n    for s in (\"top\", \"right\"):\n        ax.spines[s].set_visible(False)\nyf = np.linspace(0, H, 400)\na1.plot(exacta(T1, yf), yf * 1000, color=\"#333333\", lw=3, alpha=0.5, label=\"exacta\")\nestilos = {(\"explícito\", 0.51): (\"#999999\", \"x\"), (\"explícito\", 0.49): (\"#1F5A8C\", \"o\"), (\"implícito\", 10.0): (\"#7A5A00\", \"s\"),\n           (\"Crank-Nicolson\", 10.0): (\"#C00000\", \"^\")}\nfor k, (c, m) in estilos.items():\n    a1.plot(sol[k][0], y * 1000, m + \"-\", ms=3.5, lw=1.2, color=c, label=f\"{k[0]}, d = {k[1]:g}\")\na1.plot(u_cn1, y * 1000, \":\", color=\"#C00000\", lw=1.2, label=\"Crank-Nicolson, d = 10, primer paso\")\na1.set_xlabel(\"u (m/s)\"); a1.set_ylabel(\"y (mm)\"); a1.set_xlim(-0.4, 1.4)\na1.set_title(f\"(a) Perfil de velocidad en t = {T1:.2f} s\", fontsize=11, loc=\"left\")\na1.legend(frameon=False, fontsize=8.5)\n\nts = np.linspace(1e-3, 0.6 * t_dif, 300)\na2.plot(ts, [-MU * np.gradient(exacta(t, np.array([H - 2e-6, H - 1e-6, H])), 1e-6)[-1] for t in ts],\n        color=\"#333333\", lw=3, alpha=0.5, label=\"exacta\")\nfor esq, d, c in [(\"explícito\", 0.49, \"#1F5A8C\"), (\"implícito\", 10.0, \"#7A5A00\"), (\"Crank-Nicolson\", 10.0, \"#C00000\")]:\n    _, ht, htau, _ = resolver(esq, d, 0.6 * t_dif)\n    a2.plot(ht, htau, \"-\", color=c, lw=1.5, label=f\"{esq}, d = {d:g}\")\n_, ht, htau, _ = resolver(\"explícito\", 0.51, 0.6 * t_dif)\nok = np.abs(htau) < 20\na2.plot(ht[ok], htau[ok], color=\"#999999\", lw=1, label=\"explícito, d = 0.51\")\na2.set_ylim(-2, 12)\na2.set_xlabel(\"t (s)\"); a2.set_ylabel(\"τ sobre la placa fija (Pa)\")\na2.set_title(\"(b) Esfuerzo sobre la placa fija\", fontsize=11, loc=\"left\")\na2.legend(frameon=False, fontsize=8.5, loc=\"lower right\")\nfig.tight_layout(); fig.savefig(\"cfd3_difusion_estabilidad.png\", dpi=200)\nplt.show()\n", "cfd4_conveccion_vertido.py": "\"\"\"\nSistemas de fluidos - GITI · Dinámica de fluidos computacional\nEjemplo C4: TRANSPORTE DE UN VERTIDO. DIFUSIÓN Y DISPERSIÓN NUMÉRICAS\n\nUn vertido accidental forma una mancha de contaminante (pulso gaussiano, σ0 = 2 m) en un\ncanal con velocidad c = 0.5 m/s. Interesa la concentración MÁXIMA que llega a una toma de\nagua situada 60 m aguas abajo (si supera el límite, hay que cerrar la toma).\nEcuación: ∂C/∂t + c ∂C/∂x = D ∂²C/∂x²   con D = 0.01 m²/s (dispersión física, pequeña)\nSolución exacta: el pulso se traslada y se ensancha, σ² = σ0² + 2 D t.\n\nEsquemas (σ = cΔt/Δx, número de Courant = \"CFL convectivo\"):\n  - upwind (descentrado aguas arriba) + Euler explícito: estable si 0 ≤ σ ≤ 1, pero añade\n    una difusión numérica D_num = cΔx(1-σ)/2  (ecuación modificada).\n  - centrado + Euler explícito (FTCS): inestable para convección pura, para cualquier Δt.\n    Con difusión física solo es estable si σ² ≤ 2d y d ≤ 1/2 (d = DΔt/Δx²): con Δx = 0.1 m\n    no llega a explotar en 120 s, pero la perturbación ya está creciendo (C máx > exacta).\n  - Lax-Wendroff (2º orden): poca difusión, pero error dispersivo → oscilaciones y\n    concentraciones NEGATIVAS (imposibles).\n  - upwind \"del lado equivocado\" (si el flujo se invierte y el código no lo detecta): inestable.\nRequiere: numpy, matplotlib\n\"\"\"\nimport numpy as np\nimport matplotlib.pyplot as plt\n\nC_VEL, D, SIG0, X0, LONG = 0.5, 0.01, 2.0, 20.0, 120.0\nX_TOMA = X0 + 60.0\nT_FIN = 60.0 / C_VEL                              # llega a la toma\n\n\ndef exacta(x, t):\n    s2 = SIG0 ** 2 + 2 * D * t\n    return SIG0 / np.sqrt(s2) * np.exp(-(x - X0 - C_VEL * t) ** 2 / (2 * s2))\n\n\ndef resolver(esquema, dx, sigma=0.5, t_fin=T_FIN):\n    x = np.arange(0, LONG + dx / 2, dx)\n    dt = sigma * dx / C_VEL\n    dt = min(dt, 0.4 * dx ** 2 / D)              # que la parte difusiva no limite\n    nt = int(round(t_fin / dt)); dt = t_fin / nt\n    s, d = C_VEL * dt / dx, D * dt / dx ** 2\n    C = exacta(x, 0.0)\n    for _ in range(nt):\n        Cp, Cm = np.roll(C, -1), np.roll(C, 1)   # periódico (el pulso no llega a los bordes)\n        dif = d * (Cp - 2 * C + Cm)\n        if esquema == \"upwind\":\n            C = C - s * (C - Cm) + dif\n        elif esquema == \"upwind al revés\":\n            C = C - s * (Cp - C) + dif\n        elif esquema == \"centrado (FTCS)\":\n            C = C - s / 2 * (Cp - Cm) + dif\n        elif esquema == \"Lax-Wendroff\":\n            C = C - s / 2 * (Cp - Cm) + s ** 2 / 2 * (Cp - 2 * C + Cm) + dif\n        if np.max(np.abs(C)) > 1e3:\n            return x, np.full_like(x, np.nan), s\n    return x, C, s\n\n\nxe = np.linspace(0, LONG, 2000)\nCmax = exacta(X0 + C_VEL * T_FIN, T_FIN)\nprint(f\"Concentración máxima exacta en la toma: {Cmax:.3f} (relativa a la inicial)\\n\")\nprint(f\"{'esquema':18s} {'Δx (m)':>7s} {'Courant':>8s} {'D_num/D':>8s} {'C máx':>7s} {'C mín':>7s} {'error en C máx':>15s}\")\nfor esq in [\"upwind\", \"Lax-Wendroff\", \"centrado (FTCS)\", \"upwind al revés\"]:\n    for dx in [1.0, 0.5, 0.1]:\n        x, C, s = resolver(esq, dx)\n        Dn = C_VEL * dx * (1 - s) / 2 / D if esq == \"upwind\" else np.nan\n        if np.isnan(C).any():\n            print(f\"{esq:18s} {dx:7.2f} {s:8.2f} {'':>8s} {'DIVERGE':>7s}\")\n            continue\n        print(f\"{esq:18s} {dx:7.2f} {s:8.2f} {Dn:8.1f} {C.max():7.3f} {C.min():7.3f} {100*(C.max()/Cmax-1):+14.0f} %\")\n\n# ----------------------------------------------------------- GRÁFICAS\nfig, (a1, a2) = plt.subplots(1, 2, figsize=(11, 4.4))\nfor ax in (a1, a2):\n    ax.grid(color=\"#E3E3E3\", lw=0.8)\n    for s_ in (\"top\", \"right\"):\n        ax.spines[s_].set_visible(False)\na1.plot(xe, exacta(xe, 0), color=\"#999999\", lw=1.2, ls=\"--\", label=\"vertido inicial\")\na1.plot(xe, exacta(xe, T_FIN), color=\"#333333\", lw=3, alpha=0.5, label=\"exacta en t = 120 s\")\nfor esq, dx, c in [(\"upwind\", 1.0, \"#C00000\"), (\"upwind\", 0.1, \"#E08080\"), (\"Lax-Wendroff\", 1.0, \"#1F5A8C\")]:\n    x, C, _ = resolver(esq, dx)\n    a1.plot(x, C, color=c, lw=1.6, label=f\"{esq}, Δx = {dx:g} m\")\na1.axvline(X_TOMA, color=\"#7A5A00\", lw=1, ls=\":\"); a1.text(X_TOMA + 1, 0.9, \"toma\\nde agua\", fontsize=9, color=\"#7A5A00\")\na1.set_xlim(0, 110); a1.set_ylim(-0.15, 1.05)\na1.set_xlabel(\"x (m)\"); a1.set_ylabel(\"C / C$_0$\")\na1.set_title(\"(a) Llegada del vertido a la toma (Courant 0.5)\", fontsize=11, loc=\"left\")\na1.legend(frameon=False, fontsize=8.5, loc=\"upper left\", bbox_to_anchor=(0.0, 0.88))\n\ndxs = np.array([2.0, 1.0, 0.5, 0.25, 0.1, 0.05])\nfor esq, c, m in [(\"upwind\", \"#C00000\", \"o\"), (\"Lax-Wendroff\", \"#1F5A8C\", \"s\")]:\n    e = [abs(resolver(esq, dx)[1].max() / Cmax - 1) * 100 for dx in dxs]\n    a2.loglog(dxs, e, m + \"-\", color=c, lw=2, label=esq)\na2.set_xlabel(\"Δx (m)\"); a2.set_ylabel(\"
