error en la concentración máxima (%)\")\na2.set_title(\"(b) Convergencia con la malla\", fontsize=11, loc=\"left\")\na2.legend(frameon=False, fontsize=9)\nfig.tight_layout(); fig.savefig(\"cfd4_conveccion_vertido.png\", dpi=200)\nplt.show()\n", "cfd5_oscilacion_manometro.py": "\"\"\"\nSistemas de fluidos - GITI · Dinámica de fluidos computacional\nEjemplo C5: OSCILACIÓN DE UN MANÓMETRO EN U. ¿AMORTIGUAMIENTO FÍSICO O NUMÉRICO?\n\nColumna de agua de longitud total L = 1 m en un tubo en U de diámetro D = 1 cm. Se desplaza\nel menisco z0 = 5 cm y se suelta. Con flujo laminar casi estacionario (Poiseuille):\n    d²z/dt² + 2γ dz/dt + ω0² z = 0,    ω0² = 2g/L,    γ = 16ν/D²\nComo sistema de primer orden (u1 = z, u2 = dz/dt):  du/dt = A u.\nSe integra con los esquemas temporales de los apuntes y con el MISMO Δt.\n\nLección: Euler explícito hace crecer la oscilación salvo que Δt < 2γ/ω0² (aquí 16 ms,\nunas T/87); sin rozamiento (γ = 0) la hace crecer para CUALQUIER Δt, porque los\nautovalores imaginarios quedan fuera de su región de estabilidad. Euler implícito, al\nrevés, la amortigua de más. Si con ese resultado\n\"calibramos\" la fricción del tubo, ¡estaremos ajustando un error numérico!\nRequiere: numpy, matplotlib\n\"\"\"\nimport numpy as np\nimport matplotlib.pyplot as plt\n\nG, L, D, NU, Z0 = 9.81, 1.0, 0.01, 1.0e-6, 0.05\nw0 = np.sqrt(2 * G / L); gam = 16 * NU / D ** 2\nwd = np.sqrt(w0 ** 2 - gam ** 2); T = 2 * np.pi / wd\nA = np.array([[0, 1], [-w0 ** 2, -2 * gam]])\nprint(f\"Euler explícito estable solo si Δt < 2γ/ω0² = {2*gam/w0**2*1e3:.1f} ms\")\nprint(f\"ω0 = {w0:.2f} rad/s, periodo = {T:.2f} s, γ = {gam:.2f} 1/s \"\n      f\"(la amplitud física cae a la mitad en {np.log(2)/gam:.1f} s)\")\n\n\ndef exacta(t):\n    return Z0 * np.exp(-gam * t) * (np.cos(wd * t) + gam / wd * np.sin(wd * t))\n\n\nF = lambda u: A @ u\nI2 = np.eye(2)\n\n\ndef paso(esq, u, dt):\n    if esq == \"Euler explícito\":\n        return u + dt * F(u)\n    if esq == \"Euler implícito\":\n        return np.linalg.solve(I2 - dt * A, u)\n    if esq == \"Crank-Nicolson\":\n        return np.linalg.solve(I2 - dt / 2 * A, (I2 + dt / 2 * A) @ u)\n    if esq == \"predictor-corrector (Heun)\":\n        us = u + dt * F(u)\n        return u + dt / 2 * (F(u) + F(us))\n    if esq == \"Runge-Kutta 4\":\n        k1 = dt * F(u); k2 = dt * F(u + k1 / 2); k3 = dt * F(u + k2 / 2); k4 = dt * F(u + k3)\n        return u + (k1 + 2 * k2 + 2 * k3 + k4) / 6\n\n\nESQ = [\"Euler explícito\", \"Euler implícito\", \"Crank-Nicolson\", \"predictor-corrector (Heun)\", \"Runge-Kutta 4\"]\nCOL = [\"#C00000\", \"#7A5A00\", \"#1F5A8C\", \"#2E7D32\", \"#555555\"]\nT_FIN = 10.0\n\n\ndef integrar(esq, dt):\n    n = int(round(T_FIN / dt)); u = np.array([Z0, 0.0]); z = [Z0]\n    for _ in range(n):\n        u = paso(esq, u, dt); z.append(u[0])\n    return np.arange(n + 1) * dt, np.array(z)\n\n\ndef gamma_aparente(t, z):\n    \"\"\"amortiguamiento que deduciría quien ajustase una exponencial a los máximos\"\"\"\n    i = np.where((z[1:-1] > z[:-2]) & (z[1:-1] > z[2:]))[0] + 1\n    if len(i) < 2:\n        return np.nan\n    return -np.polyfit(t[i], np.log(np.abs(z[i])), 1)[0]\n\n\nprint(f\"\\n{'esquema':28s} {'Δt = T/20':>22s} {'Δt = T/50':>22s}\")\nprint(f\"{'':28s} {'amplitud 10 s  γ ap.':>22s} {'amplitud 10 s  γ ap.':>22s}\")\nfor esq in ESQ:\n    lin = f\"{esq:28s}\"\n    for frac in (20, 50):\n        t, z = integrar(esq, T / frac)\n        amp = np.max(np.abs(z[t > T_FIN - T])) / Z0\n        lin += f\" {100*amp:9.1f} %   {gamma_aparente(t, z):6.3f}\"\n    print(lin)\nte = np.linspace(T_FIN - T, T_FIN, 2000)\nprint(f\"{'exacta':28s} {100*np.max(np.abs(exacta(te)))/Z0:9.0f} %   {gam:6.3f}\")\nprint(\"(amplitud = máximo de |z| en el último periodo, en % de z0)\")\n\n# factor de amplificación por paso para un oscilador sin amortiguar (λ = iω0)\nprint(\"\\nFactor de amplificación |r| por paso con γ = 0 (debería ser 1):\")\nfor frac in (8, 20, 50):\n    x = w0 * T / frac\n    r = {\"Euler explícito\": abs(1 + 1j * x), \"Euler implícito\": abs(1 / (1 - 1j * x)),\n         \"Crank-Nicolson\": abs((1 + 1j * x / 2) / (1 - 1j * x / 2)),\n         \"Heun\": abs(1 + 1j * x + (1j * x) ** 2 / 2),\n         \"RK4\": abs(1 + 1j * x + (1j * x) ** 2 / 2 + (1j * x) ** 3 / 6 + (1j * x) ** 4 / 24)}\n    print(f\"  Δt = T/{frac:<3d} ω0Δt = {x:.2f}: \" + \", \".join(f\"{k} {v:.4f}\" for k, v in r.items()))\n\n# ----------------------------------------------------------- GRÁFICAS\nfig, (a1, a2) = plt.subplots(1, 2, figsize=(11, 4.4))\nfor ax in (a1, a2):\n    ax.grid(color=\"#E3E3E3\", lw=0.8)\n    for s in (\"top\", \"right\"):\n        ax.spines[s].set_visible(False)\ntt = np.linspace(0, T_FIN, 2000)\na1.plot(tt, exacta(tt) * 100, color=\"#333333\", lw=3, alpha=0.4, label=\"exacta\")\nfor esq, c in zip(ESQ[:3], COL[:3]):\n    t, z = integrar(esq, T / 20)\n    a1.plot(t, z * 100, color=c, lw=1.4, label=esq)\na1.set_xlabel(\"t (s)\"); a1.set_ylabel(\"z (cm)\"); a1.set_ylim(-12, 12)\na1.set_title(\"(a) Menisco con Δt = T/20\", fontsize=11, loc=\"left\")\na1.legend(frameon=False, fontsize=8.5, ncol=2, loc=\"upper center\")\n\nfr = np.array([8, 12, 20, 35, 50, 100, 200])\nfor esq, c in zip(ESQ, COL):\n    g = [gamma_aparente(*integrar(esq, T / f)) for f in fr]\n    a2.plot(T / fr, g, \"o-\", color=c, lw=1.6, ms=4, label=esq)\na2.axhline(gam, color=\"#333333\", lw=2, ls=\"--\"); a2.text(0.01, gam + 0.02, \"γ físico (Poiseuille)\", fontsize=9)\na2.set_xscale(\"log\"); a2.set_ylim(-0.6, 1.0)\na2.set_xlabel(\"Δt (s)\"); a2.set_ylabel(\"amortiguamiento aparente γ (1/s)\")\na2.set_title(\"(b) La fricción que 'mediríamos' en el cálculo\", fontsize=11, loc=\"left\")\na2.legend(frameon=False, fontsize=8, loc=\"lower left\")\nfig.tight_layout(); fig.savefig(\"cfd5_oscilacion_manometro.png\", dpi=200)\nplt.show()\n", "cfd6_convergencia_conducto.py": "\"\"\"\nSistemas de fluidos - GITI · Dinámica de fluidos computacional\nEjemplo C6: ¿ES SUFICIENTE MI MALLA? CONVERGENCIA, RICHARDSON Y GCI\n\nFlujo laminar desarrollado en un conducto de sección cuadrada de lado a (el mismo del\nejemplo 2 de Turbulencia 1). La velocidad axial w(y,z) cumple\n      μ ∇²w = dp/dx = -G     con w = 0 en las paredes.\nAdimensional (w* = μ w / (G a²), lado 1):  ∇²w* = -1.\nResultado de diseño: f·Re = 2 / w*_media   (con D_h = a).  Valor de referencia: 56.91.\n\nSe resuelve con diferencias finitas centradas (5 puntos, 2º orden) en mallas N×N y se\ncalcula f·Re de DOS maneras:\n  (A) con el caudal (integral de w): converge con orden 2.\n  (B) con el esfuerzo en la pared, derivada de 1er orden (w1 - w0)/Δ, como\n      hacen algunos postprocesados: converge solo con orden 1.\nDespués: extrapolación de Richardson y GCI (Roache) con tres mallas, que es lo que se\npide en una verificación de un cálculo de CFD (ASME V&V 20).\nRequiere: numpy, scipy, matplotlib\n\"\"\"\nimport numpy as np\nimport matplotlib.pyplot as plt\nimport scipy.sparse as sp\nimport scipy.sparse.linalg as spla\n\n# ------------------------------------------- referencia (serie de Fourier)\nm = np.arange(1, 400, 2)\nM, Nn = np.meshgrid(m, m)\nw_media_ex = np.sum(64 / (np.pi ** 6 * M ** 2 * Nn ** 2 * (M ** 2 + Nn ** 2)))\nfRe_ex = 2 / w_media_ex\nprint(f\"f·Re exacto (serie) = {fRe_ex:.3f}\")\n\n\ndef resolver(N):\n    \"\"\"N celdas por lado; incógnitas en los (N-1)² nodos interiores\"\"\"\n    h = 1.0 / N; n = N - 1\n    T = sp.diags([-np.ones(n - 1), 2 * np.ones(n), -np.ones(n - 1)], [-1, 0, 1]) / h ** 2\n    I = sp.identity(n)\n    Lap = sp.kron(I, T) + sp.kron(T, I)\n    w = spla.spsolve(Lap.tocsc(), np.ones(n * n)).reshape(n, n)\n    W = np.zeros((N + 1, N + 1)); W[1:-1, 1:-1] = w\n    # (A) caudal: regla del trapecio\n    wq = W.sum() * h * h          # regla del trapecio (w = 0 en el contorno)\n    fA = 2 / wq\n    # (B) esfuerzo medio en la pared con derivada de 1er orden; equilibrio de fuerzas:\n    #     G·a² = τ_media·4a  →  f·Re = 2 D_h² G /(μ V) con τ deducido del gradiente\n    tau = np.mean(W[1, 1:-1]) / h                 # (w1 - 0)/h, en una pared (simetría)\n    # f = 8 τ_w/(ρV²), Re = ρVa/μ  →  f·Re = 8 τ* / w*_media   (exacto: τ* = 1/4 por equilibrio)\n    fB = 8 * tau / wq\n    return fA, fB\n\n\nNs = [4, 8, 16, 32, 64, 128]\nprint(f\"\\n{'N':>4s} {'f·Re (caudal)':>14s} {'error':>8s} {'f·Re (pared, 1er orden)':>24s} {'error':>8s}\")\nA, B = [], []\nfor N in Ns:\n    fA, fB = resolver(N); A.append(fA); B.append(fB)\n    print(f\"{N:4d} {fA:14.3f} {100*(fA/fRe_ex-1):+7.2f}% {fB:24.3f} {100*(fB/fRe_ex-1):+7.2f}%\")\n\n# ---------------------------------------- Richardson + GCI con 3 mallas\ndef gci(f1, f2, f3, r=2.0, Fs=1.25):\n    \"\"\"f1 la malla más fina; devuelve orden observado, valor extrapolado y GCI de la fina\"\"\"\n    p = np.log(abs((f3 - f2) / (f2 - f1))) / np.log(r)\n    fext = f1 + (f1 - f2) / (r ** p - 1)\n    g = Fs * abs((f1 - f2) / f1) / (r ** p - 1)\n    return p, fext, g\n\n\nprint(\"\\nVerificación con tres mallas (r = 2):\")\nfor nombre, F in [(\"caudal\", A), (\"pared 1er orden\", B)]:\n    for k in (2, 4):            # k = índice de la malla más fina del trío\n        f3, f2, f1 = F[k - 2], F[k - 1], F[k]\n        p, fe, g = gci(f1, f2, f3)\n        aviso = \"\" if 0.5 < p < 3 else \"  ← ¡p sin sentido: mallas fuera del rango asintótico, GCI NO fiable!\"\n        print(f\"  {nombre:16s} mallas {Ns[k-2]:>3d}-{Ns[k-1]:>3d}-{Ns[k]:>3d}: orden observado p = {p:.2f}, \"\n              f\"Richardson = {fe:.3f} (error {100*(fe/fRe_ex-1):+.3f} %), GCI = {100*g:.2f} %{aviso}\")\n\n# ----------------------------------------------------------- GRÁFICAS\nfig, (a1, a2) = plt.subplots(1, 2, figsize=(11, 4.4))\nfor ax in (a1, a2):\n    ax.grid(color=\"#E3E3E3\", lw=0.8, which=\"both\")\n    for s in (\"top\", \"right\"):\n        ax.spines[s].set_visible(False)\na1.plot(Ns, A, \"o-\", color=\"#1F5A8C\", lw=2, label=\"con el caudal (2º orden)\")\na1.plot(Ns, B, \"s-\", color=\"#C00000\", lw=2, label=\"con τ$_w$ de 1er orden\")\na1.axhline(fRe_ex, color=\"#333333\", lw=1.5, ls=\"--\"); a1.text(40, fRe_ex + 1, f\"exacto {fRe_ex:.2f}\", fontsize=9)\na1.set_xscale(\"log\", base=2); a1.set_xticks(Ns, [str(n) for n in Ns]); a1.set_xlabel(\"celdas por lado N\"); a1.set_ylabel(\"f·Re\")\na1.set_title(\"(a) El resultado depende de la malla\", fontsize=11, loc=\"left\")\na1.legend(frameon=False, fontsize=9)\nh = 1 / np.array(Ns)\na2.loglog(h, np.abs(np.array(A) / fRe_ex - 1) * 100, \"o-\", color=\"#1F5A8C\", lw=2, label=\"caudal\")\na2.loglog(h, np.abs(np.array(B) / fRe_ex - 1) * 100, \"s-\", color=\"#C00000\", lw=2, label=\"τ$_w$ 1er orden\")\na2.loglog(h, 40 * h ** 2 / h[0] ** 2 * 0.1, \":\", color=\"#555555\", lw=1); a2.text(0.05, 0.25, \"pendiente 2\", fontsize=9)\na2.loglog(h, 60 * h / h[0], \":\", color=\"#555555\", lw=1); a2.text(0.03, 12, \"pendiente 1\", fontsize=9)\na2.set_xlabel(\"Δ = 1/N\"); a2.set_ylabel(\"error en f·Re (%)\")\na2.set_title(\"(b) Orden de convergencia\", fontsize=11, loc=\"left\")\na2.legend(frameon=False, fontsize=9, loc=\"lower right\")\nfig.tight_layout(); fig.savefig(\"cfd6_convergencia_conducto.png\", dpi=200)\nplt.show()\n", "cfd7_conveccion_difusion.py": "\"\"\"\nSistemas de fluidos - GITI · Dinámica de fluidos computacional (2)\nEjemplo C7: CONVECCIÓN-DIFUSIÓN ESTACIONARIA. ¿CENTRADO O UPWIND?\n\nProblema clásico de los volúmenes finitos (Patankar, 1980): una magnitud φ (temperatura,\nconcentración) es arrastrada por un flujo de velocidad u y se difunde con difusividad Γ:\n        u dφ/dx = Γ d²φ/dx²,   φ(0) = 1,  φ(L) = 0\nSolución exacta:  φ = 1 - (exp(Pe x/L) - 1)/(exp(Pe) - 1),   Pe = uL/Γ\nCon N volúmenes, el número de Péclet de celda es Pe_Δ = uΔx/Γ = Pe/N.\n  - Centrado: 2º orden, pero si Pe_Δ > 2 aparecen oscilaciones sin sentido físico.\n  - Upwind: siempre acotado (sin oscilaciones), pero de 1er orden: difusión numérica uΔx/2.\n  - Híbrido (Spalding): centrado si Pe_Δ < 2, upwind si no.\nRequiere: numpy, matplotlib\n\"\"\"\nimport numpy as np\nimport matplotlib.pyplot as plt\n\nPE = 50.0\n\n\ndef exacta(x):\n    return 1 - np.expm1(PE * x) / np.expm1(PE)\n\n\ndef resolver(N, esquema):\n    \"\"\"N intervalos en una malla uniforme (equivale a volúmenes finitos con nodos en los extremos)\"\"\"\n    dx = 1.0 / N\n    x = np.linspace(0, 1, N + 1)\n    D, F = 1.0 / dx**2, PE / dx              # Γ = 1, u = Pe, L = 1\n    PeD = PE * dx\n    central = esquema == \"centrado\" or (esquema == \"híbrido\" and PeD < 2)\n    if central:\n        aW, aP, aE = D + F / 2, 2 * D, D - F / 2\n    else:                                     # upwind (u > 0): difusión centrada + convección hacia atrás\n        aW, aP, aE = D + F, 2 * D + F, D\n    n = N - 1\n    A = np.diag(np.full(n, aP)) - np.diag(np.full(n - 1, aE), 1) - np.diag(np.full(n - 1, aW), -1)\n    b = np.zeros(n); b[0] = aW * 1.0          # φ(0) = 1 ; φ(1) = 0\n    phi = np.concatenate([[1.0], np.linalg.solve(A, b), [0.0]])\n    return x, phi, PeD\n\n\nif __name__ == \"__main__\":\n    print(f\"Pe = {PE:.0f}\")\n    for N in (10, 25, 50, 200):\n        line = f\"N = {N:3d} (Pe_Δ = {PE/N:4.1f}):\"\n        for esq in (\"centrado\", \"upwind\", \"híbrido\"):\n            x, phi, _ = resolver(N, esq)\n            err = np.max(np.abs(phi - exacta(x)))\n            osc = \"SÍ (oscila)\" if (phi.max() > 1 + 1e-9 or phi.min() < -1e-9) else \"no\"\n            line += f\"  {esq}: error máx {err:.3f}, sale de [0, 1]: {osc};\"\n        print(line)\n\n    fig, (a1, a2) = plt.subplots(1, 2, figsize=(11, 4.4))\n    xe = np.linspace(0, 1, 500)\n    for ax, N in ((a1, 10), (a2, 50)):\n        ax.plot(xe, exacta(xe), color=\"#333333\", lw=3, alpha=0.45, label=\"exacta\")\n        for esq, c, m in ((\"centrado\", \"#C00000\", \"o\"), (\"upwind\", \"#1F5A8C\", \"s\")):\n            x, phi, PeD = resolver(N, esq)\n            ax.plot(x, phi, m + \"-\", color=c, ms=4, lw=1.4, label=esq)\n        ax.set_title(f\"({'a' if N == 10 else 'b'}) N = {N}, Pe de celda = {PE/N:g}\", fontsize=11, loc=\"left\")\n        ax.set_xlabel(\"x / L\"); ax.set_ylabel(\"φ\"); ax.set_ylim(-0.6, 1.6)\n        ax.grid(color=\"#E3E3E3\", lw=0.8); ax.legend(frameon=False, fontsize=9, loc=\"lower left\")\n        for s in (\"top\", \"right\"):\n            ax.spines[s].set_visible(False)\n    fig.tight_layout(); fig.savefig(\"cfd7_conveccion_difusion.png\", dpi=200)\n    plt.show()\n", "cfd8_canal_proyeccion.py": "\"\"\"\nSistemas de fluidos - GITI · Dinámica de fluidos computacional (2)\nEjemplo C8: FLUJO EN LA ENTRADA DE UN CANAL CON EL MÉTODO DE PROYECCIÓN\n\nUn programa de Navier-Stokes incompresible completo en ~100 líneas:\n  - malla desplazada (MAC): p en el centro de las celdas, u y v en las caras\n  - método de proyección de Chorin (paso fraccionado):\n        1) u* = uⁿ + Δt [ -(u·∇)u + (1/Re) ∇²u ]          (sin presión)\n        2) ∇²p = (1/Δt) ∇·u*                               (ecuación de Poisson)\n        3) uⁿ⁺¹ = u* - Δt ∇p                               (velocidad sin divergencia)\n  - se avanza en el tiempo hasta llegar al estado estacionario.\nCanal de placas planas de altura H (adimensional: H = 1, velocidad media de entrada U = 1),\nlongitud L = 10 H, Re = U H / ν = 100. Entrada uniforme, salida con p = 0.\nSe comprueba con la solución exacta del flujo desarrollado (Poiseuille plano):\n        u = 6 U (y/H)(1 - y/H),  u_max = 1.5 U,  dp/dx = -12 μ U / H²\nRequiere: numpy, scipy, matplotlib\n\"\"\"\nimport time\nimport numpy as np\nimport matplotlib.pyplot as plt\nimport scipy.sparse as sp\nimport scipy.sparse.linalg as spla\n\nRE, L, H = 100.0, 10.0, 1.0\n\n\ndef poisson(nx, ny, dx, dy):\n    \"\"\"laplaciano de p con dp/dn = 0 en entrada y paredes y p = 0 en la salida\"\"\"\n    def lap1(n, d, dir_derecha):\n        main = -2 * np.ones(n); main[0] = -1\n        main[-1] = -3 if dir_derecha else -1\n        return sp.diags([np.ones(n - 1), main, np.ones(n - 1)], [-1, 0, 1]) / d**2\n    Ax = lap1(nx, dx, True); Ay = lap1(ny, dy, False)\n    A = sp.kron(Ax, sp.identity(ny)) + sp.kron(sp.identity(nx), Ay)\n    return spla.splu(A.tocsc())\n\n\ndef resolver(nx, ny, t_fin=30.0, verbose=True):\n    dx, dy = L / nx, H / ny\n    nu = 1.0 / RE\n    # Δt: límite difusivo, límite de Euler explícito con convección centrada (Δt < 2ν/u²) y CFL\n    dt = min(0.25 * dx * dy / nu, 0.8 * 2 * nu / 1.5**2, 0.5 * dx / 1.5)\n    u = np.ones((nx + 1, ny)); v = np.zeros((nx, ny + 1))\n    LU = poisson(nx, ny, dx, dy)\n    nt = int(t_fin / dt)\n    for it in range(nt):\n        # --- contornos de u: paredes (u = 0 con celdas fantasma), entrada, salida\n        ug = np.zeros((nx + 1, ny + 2)); ug[:, 1:-1] = u\n        ug[:, 0] = -u[:, 0]; ug[:, -1] = -u[:, -1]\n        vg = np.zeros((nx + 2, ny + 1)); vg[1:-1, :] = v\n        vg[0, :] = -v[0, :]; vg[-1, :] = v[-1, :]\n        # --- términos de u en las caras interiores i = 1..nx-1\n        ui = ug[1:-1, 1:-1]\n        lap_u = (ug[2:, 1:-1] - 2 * ui + ug[:-2, 1:-1]) / dx**2 + (ug[1:-1, 2:] - 2 * ui + ug[1:-1, :-2]) / dy**2\n        dudx = (ug[2:, 1:-1] - ug[:-2, 1:-1]) / (2 * dx)\n        dudy = (ug[1:-1, 2:] - ug[1:-1, :-2]) / (2 * dy)\n        v_at_u = 0.25 * (v[:-1, :-1] + v[:-1, 1:] + v[1:, :-1] + v[1:, 1:])\n        us = u.copy()\n        us[1:-1, :] = ui + dt * (-(ui * dudx + v_at_u * dudy) + nu * lap_u)\n        # --- términos de v en las caras interiores j = 1..ny-1\n        vi = vg[1:-1, 1:-1]\n        lap_v = (vg[2:, 1:-1] - 2 * vi + vg[:-2, 1:-1]) / dx**2 + (vg[1:-1, 2:] - 2 * vi + vg[1:-1, :-2]) / dy**2\n        dvdx = (vg[2:, 1:-1] - vg[:-2, 1:-1]) / (2 * dx)\n        dvdy = (vg[1:-1, 2:] - vg[1:-1, :-2]) / (2 * dy)\n        u_at_v = 0.25 * (u[:-1, :-1] + u[1:, :-1] + u[:-1, 1:] + u[1:, 1:])\n        vs = v.copy()\n        vs[:, 1:-1] = vi + dt * (-(u_at_v * dvdx + vi * dvdy) + nu * lap_v)\n        # --- salida: gradiente nulo, corregido para conservar el caudal\n        us[-1, :] = us[-2, :]\n        us[-1, :] *= np.sum(us[0, :]) / np.sum(us[-1, :])\n        # --- Poisson y corrección\n        div = (us[1:, :] - us[:-1, :]) / dx + (vs[:, 1:] - vs[:, :-1]) / dy\n        p = LU.solve((div / dt).ravel()).reshape(nx, ny)\n        u = us.copy(); v = vs.copy()\n        u[1:-1, :] -= dt * (p[1:, :] - p[:-1, :]) / dx\n        u[-1, :] -= dt * (0 - 2 * p[-1, :]) / dx         # p = 0 en la cara de salida\n        v[:, 1:-1] -= dt * (p[:, 1:] - p[:, :-1]) / dy\n        u[0, :] = 1.0; v[:, 0] = 0; v[:, -1] = 0\n    x_c = (np.arange(nx) + 0.5) * dx; y_c = (np.arange(ny) + 0.5) * dy\n    div = (u[1:, :] - u[:-1, :]) / dx + (v[:, 1:] - v[:, :-1]) / dy\n    if verbose:\n        print(f\"  malla {nx}×{ny}, Δt = {dt:.4f}, {nt} pasos, |∇·u| máx = {np.abs(div).max():.1e}\")\n    return x_c, y_c, u, v, p\n\n\nif __name__ == \"__main__\":\n    t0 = time.time()\n    res = {}\n    for nx, ny in ((200, 20), (400, 40)):\n        res[ny] = resolver(nx, ny)\n    print(f\"tiempo de cálculo: {time.time()-t0:.0f} s\\n\")\n    x, y, u, v, p = res[40]\n    nx, ny = len(x), len(y)\n    uc = 0.5 * (u[1:, :] + u[:-1, :])                   # u en el centro de las celdas\n    umax = uc.max(axis=1)\n    Lh = x[np.argmax(umax >= 0.99 * 1.5)]\n    dpdx = np.polyfit(x[x > 7], p.mean(axis=1)[x > 7], 1)[0]\n    p_in = p.mean(axis=1)[0] + 0.5 * (x[1] - x[0]) * (-dpdx)   # extrapolada a la entrada\n    K = (p_in - (-dpdx) * L) / 0.5                        # caída de presión extra respecto al desarrollado\n    Re_Dh = RE * 2\n    Lh_corr = (0.315 / (1 + 0.0175 * Re_Dh) + 0.011 * Re_Dh) * 2 * H   # Chen (1973), Dh = 2H\n    print(f\"u_max en la salida = {umax[-1]:.4f} (exacto 1.5)\")\n    print(f\"dp/dx desarrollado = {dpdx:.4f} (exacto -12/Re = {-12/RE:.4f})\")\n    print(f\"longitud de entrada (u_max = 99 % de 1.5): Lh = {Lh:.2f} H; correlación de Chen para placas: {Lh_corr:.2f} H\")\n    print(f\"pérdida extra por la entrada: K = {K:.2f} (Δp = K ρU²/2 además de la de flujo desarrollado)\")\n    for ny_ in (20, 40):\n        xx, yy, uu, vv, pp = res[ny_]\n        ucc = 0.5 * (uu[1:, :] + uu[:-1, :]); um = ucc.max(axis=1)\n        print(f\"  malla con {ny_} celdas en H: Lh = {xx[np.argmax(um >= 0.99*1.5)]:.2f} H, u_max salida = {um[-1]:.4f}\")\n\n    fig, (a1, a2) = plt.subplots(1, 2, figsize=(11, 4.4))\n    for ax in (a1, a2):\n        ax.grid(color=\"#E3E3E3\", lw=0.8)\n        for s in (\"top\", \"right\"):\n            ax.spines[s].set_visible(False)\n    cols = [\"#9DB9D3\", \"#6A95BD\", \"#3E72A3\", \"#1F5A8C\", \"#0B2E4F\"]\n    for xs, c in zip((0.25, 1, 2, 4, 9), cols):\n        i = np.argmin(np.abs(x - xs))\n        a1.plot(uc[i], y, color=c, lw=2, label=f\"x = {xs:g} H\")\n    yy = np.linspace(0, 1, 100)\n    a1.plot(6 * yy * (1 - yy), yy, \"k--\", lw=1.2, label=\"Poiseuille (exacta)\")\n    a1.set_xlabel(\"u / U\"); a1.set_ylabel(\"y / H\"); a1.legend(frameon=False, fontsize=8.5, loc=\"center left\")\n    a1.set_title(\"(a) Perfiles de velocidad\", fontsize=11, loc=\"left\")\n    a2.plot(x, umax, color=\"#1F5A8C\", lw=2, label=\"u_max / U (eje)\")\n    a2.axhline(1.5, color=\"#333333\", ls=\"--\", lw=1); a2.axvline(Lh, color=\"#C00000\", ls=\":\", lw=1.2)\n    a2.text(Lh + 0.15, 1.1, f\"Lh ≈ {Lh:.1f} H\", color=\"#C00000\", fontsize=9)\n    a2b = a2.twinx(); a2b.plot(x, p.mean(axis=1), color=\"#7A5A00\", lw=1.5); a2b.set_ylabel(\"presión media p / ρU²\", color=\"#7A5A00\")\n    a2.set_xlabel(\"x / H\"); a2.set_ylabel(\"u en el eje / U\", color=\"#1F5A8C\"); a2.set_ylim(1, 1.6)\n    a2.set_title(\"(b) Desarrollo del flujo y caída de presión\", fontsize=11, loc=\"left\")\n    fig.tight_layout(); fig.savefig(\"cfd8_canal_proyeccion.png\", dpi=200)\n    plt.show()\n"}, "turbulencia1": {"ej1_cambio_regimen.py": "\"\"\"\nSistemas de fluidos - GITI\nEjemplo numérico 1: CAMBIO DE RÉGIMEN AL AUMENTAR EL CAUDAL\n\nAbrimos poco a poco un grifo. El agua sale por un tubo de diámetro D.\n¿Para qué caudal deja el flujo de ser laminar? ¿Influye la temperatura del agua?\n\nEl script:\n  1. calcula V y Re para una serie de caudales y dos temperaturas,\n  2. imprime una tabla con el régimen de cada caso,\n  3. calcula la pérdida de presión por metro con la ecuación de Churchill\n     (válida en laminar, transición y turbulento),\n  4. dibuja Re(Q) y (Δp/L)(Q) con las zonas de régimen sombreadas.\n\nPrueba a cambiar D, las temperaturas o el rango de caudales (bloque DATOS).\nRequiere: numpy, matplotlib\n\"\"\"\nimport numpy as np\nimport matplotlib.pyplot as plt\n\n# ----------------------------------------------------------------- DATOS\nD = 0.012                 # diámetro interior del tubo (m)\neps = 0.0015e-3           # rugosidad (m): tubo de cobre/latón\nTEMPS = [20.0, 60.0]      # temperaturas del agua (°C)\nQ_LMIN = np.linspace(0.1, 8.0, 400)       # caudales a barrer (L/min)\nQ_TABLA = [0.5, 1, 1.5, 2, 3, 4, 6, 8]    # caudales para la tabla (L/min)\nRE_LAM, RE_TURB = 2300, 4000              # límites \"de libro\"\nCOLORES = {20.0: \"#1F5A8C\", 60.0: \"#C00000\"}\n\n\n# ------------------------------------------------- PROPIEDADES DEL AGUA\ndef rho_agua(T):\n    \"\"\"Densidad del agua líquida (kg/m3), T en °C (ajuste de Tanaka et al.).\"\"\"\n    return 1000 * (1 - (T + 288.9414) / (508929.2 * (T + 68.12963)) * (T - 3.9863) ** 2)\n\n\ndef mu_agua(T):\n    \"\"\"Viscosidad dinámica (Pa·s), T en °C (ecuación de Vogel).\"\"\"\n    return 2.414e-5 * 10 ** (247.8 / (T + 273.15 - 140))\n\n\ndef churchill(Re, eps_D):\n    \"\"\"Factor de fricción de Darcy, válido para cualquier Re (Churchill, 1977).\"\"\"\n    A = (-2.457 * np.log((7 / Re) ** 0.9 + 0.27 * eps_D)) ** 16\n    B = (37530 / Re) ** 16\n    return 8 * ((8 / Re) ** 12 + (A + B) ** -1.5) ** (1 / 12)\n\n\ndef regimen(Re):\n    if Re < RE_LAM:\n        return \"laminar\"\n    if Re < RE_TURB:\n        return \"transición\"\n    return \"turbulento\"\n\n\n# ----------------------------------------------------------- CÁLCULO\nA = np.pi * D ** 2 / 4\nprint(f\"Tubo D = {D*1000:.0f} mm, A = {A*1e6:.1f} mm²\\n\")\nfor T in TEMPS:\n    rho, mu = rho_agua(T), mu_agua(T)\n    nu = mu / rho\n    print(f\"Agua a {T:.0f} °C: ρ = {rho:.1f} kg/m³, μ = {mu:.3e} Pa·s, ν = {nu:.3e} m²/s\")\n    print(f\"{'Q (L/min)':>10} {'V (m/s)':>9} {'Re':>8}  régimen\")\n    for q in Q_TABLA:\n        V = q / 60000 / A\n        Re = V * D / nu\n        print(f\"{q:10.1f} {V:9.3f} {Re:8.0f}  {regimen(Re)}\")\n    q_lam = RE_LAM * nu / D * A * 60000\n    q_turb = RE_TURB * nu / D * A * 60000\n    print(f\"  -> laminar si Q < {q_lam:.2f} L/min;  turbulento si Q > {q_turb:.2f} L/min\\n\")\n\n# ----------------------------------------------------------- GRÁFICAS\nfig, (ax1, ax2) = plt.subplots(1, 2, figsize=(11, 4.4))\nfor ax in (ax1, ax2):\n    ax.grid(color=\"#E3E3E3\", lw=0.8)\n    for s in (\"top\", \"right\"):\n        ax.spines[s].set_visible(False)\n\n# (a) Re frente a Q, con bandas de régimen\nax1.axhspan(0, RE_LAM, color=\"#E8F0F7\", zorder=0)\nax1.axhspan(RE_LAM, RE_TURB, color=\"#FFF4D6\", zorder=0)\nax1.axhspan(RE_TURB, 30000, color=\"#FBEAEA\", zorder=0)\nfor y, txt in [(1150, \"laminar\"), (3150, \"transición\"), (6500, \"turbulento\")]:\n    ax1.text(7.9, y, txt, ha=\"right\", va=\"center\", fontsize=10, color=\"#555555\")\nfor T in TEMPS:\n    nu = mu_agua(T) / rho_agua(T)\n    Re = Q_LMIN / 60000 / A * D / nu\n    ax1.plot(Q_LMIN, Re, lw=2, color=COLORES[T])\n    i = int(len(Q_LMIN) * 0.22)\n    ax1.annotate(f\"{T:.0f} °C\", (Q_LMIN[i], Re[i]), xytext=(-8, 8), textcoords=\"offset points\",\n                 ha=\"right\", color=COLORES[T], fontsize=11, fontweight=\"bold\")\nax1.set_xlim(0, 8); ax1.set_ylim(0, 12000)\nax1.set_xlabel(\"Caudal Q (L/min)\"); ax1.set_ylabel(\"Re = VD/ν\")\nax1.set_title(\"(a) Número de Reynolds al abrir el grifo\", fontsize=11, loc=\"left\")\n\n# (b) pérdida de presión por metro (log-log): pendiente 1 en laminar, ~1.75 en turbulento\nfor T in TEMPS:\n    rho, mu = rho_agua(T), mu_agua(T)\n    V = Q_LMIN / 60000 / A\n    Re = rho * V * D / mu\n    dpL = churchill(Re, eps / D) / D * rho * V ** 2 / 2\n    ax2.loglog(Q_LMIN, dpL, lw=2, color=COLORES[T], label=f\"{T:.0f} °C\")\n    for Rec, ls in [(RE_LAM, \":\"), (RE_TURB, \"--\")]:\n        qc = Rec * mu / rho / D * A * 60000\n        ax2.axvline(qc, color=COLORES[T], lw=1, ls=ls, alpha=0.7)\nax2.text(0.13, 2.0, \"pendiente 1\\n(Δp ∝ Q)\", fontsize=9, color=\"#555555\")\nax2.text(3.0, 40, \"pendiente ≈ 1.75\\n(Δp ∝ Q$^{1.75}$)\", fontsize=9, color=\"#555555\")\nax2.set_xlabel(\"Caudal Q (L/min)\"); ax2.set_ylabel(\"Δp / L (Pa/m)\")\nax2.set_title(\"(b) Pérdida de presión por metro (Churchill)\", fontsize=11, loc=\"left\")\nax2.plot([], [], color=\"#777777\", lw=1, ls=\":\", label=\"Re = 2300\")\nax2.plot([], [], color=\"#777777\", lw=1, ls=\"--\", label=\"Re = 4000\")\nax2.legend(frameon=False, loc=\"upper left\")\n\nfig.tight_layout()\nfig.savefig(\"cambio_regimen.png\", dpi=200)\nplt.show()\n", "ej2_conducto_circular_cuadrado.py": "\"\"\"\nSistemas de fluidos - GITI\nEjemplo numérico 2: ¿TUBO CIRCULAR O CONDUCTO CUADRADO?\n\nComparamos un tubo circular y un conducto cuadrado con la MISMA área de paso\n(misma sección de material \"hueco\") por los que circula el MISMO caudal de agua.\n\n  1. Diámetro hidráulico, Re y pérdida de presión para varios caudales.\n  2. Solución numérica del flujo laminar en el conducto cuadrado (ecuación de\n     Poisson, diferencias finitas): obtenemos f·Re y lo comparamos con 64 (círculo).\n  3. Gráficas: perfiles de velocidad laminar y pérdida de presión frente a Q.\n\nPrueba a cambiar el área, el fluido o los caudales en el bloque DATOS.\nRequiere: numpy, scipy, matplotlib\n\"\"\"\nimport numpy as np\nimport matplotlib.pyplot as plt\nfrom scipy.optimize import brentq\nfrom scipy.sparse import diags, kron, identity\nfrom scipy.sparse.linalg import spsolve\n\n# ----------------------------------------------------------------- DATOS\nA = 1.0e-4                    # área de paso (m²) = 1 cm²\nrho, mu = 998.0, 1.002e-3     # agua a 20 °C\nQ_TABLA = [0.5, 1.3, 1.5, 3.0, 6.0]   # caudales (L/min)\nRE_CR = 2300                          # transición \"de libro\" (con D_h)\nN = 81                                # nodos por lado para resolver Poisson\nC_CIRC, C_CUAD = \"#1F5A8C\", \"#C00000\"\n\n\n# --------------------------------------- 1. f·Re LAMINAR DEL CUADRADO (POISSON)\ndef fRe_cuadrado(N):\n    \"\"\"Resuelve  ∇²u = -1  en el cuadrado [0,1]² con u = 0 en las paredes.\n    Con μ = 1 y -dp/dx = 1:  f·Re = 2·D_h²/ū  (D_h = 1 para el cuadrado de lado 1).\"\"\"\n    h = 1.0 / (N - 1)\n    n = N - 2                                   # nodos interiores\n    T = diags([1.0, -2.0, 1.0], [-1, 0, 1], shape=(n, n)) / h ** 2\n    Lap = kron(identity(n), T) + kron(T, identity(n))\n    u_int = spsolve(Lap.tocsr(), -np.ones(n * n))\n    u = np.zeros((N, N)); u[1:-1, 1:-1] = u_int.reshape(n, n)\n    # media por la regla del trapecio en 2D\n    w = np.ones(N); w[0] = w[-1] = 0.5\n    u_med = (w @ u @ w) * h * h\n    return 2 * 1.0 ** 2 / u_med, u\n\n\nfRe_sq, u_sq = fRe_cuadrado(N)\nprint(f\"Flujo laminar totalmente desarrollado:  f·Re (círculo) = 64,  f·Re (cuadrado) = {fRe_sq:.2f}\"\n      f\"  (valor tabulado 56.92)\")\n\n# --------------------------------------------------------- 2. GEOMETRÍA\nD = np.sqrt(4 * A / np.pi)          # diámetro del círculo de área A\na = np.sqrt(A)                      # lado del cuadrado de área A\ngeo = {\"circular\": dict(Dh=D, P=np.pi * D, C=64.0, col=C_CIRC),\n       \"cuadrado\": dict(Dh=a, P=4 * a, C=fRe_sq, col=C_CUAD)}\nprint(f\"\\nÁrea A = {A*1e4:.2f} cm²\")\nfor k, g in geo.items():\n    print(f\"  {k:9s}: D_h = {g['Dh']*1000:.2f} mm, perímetro = {g['P']*1000:.1f} mm\")\nprint(f\"  -> el cuadrado tiene un {100*(geo['cuadrado']['P']/geo['circular']['P']-1):.0f} % más de pared \"\n      f\"y un D_h un {100*(1-a/D):.0f} % menor\")\n\n\ndef f_darcy(Re, C):\n    \"\"\"Laminar (C/Re) por debajo de RE_CR; turbulento liso (Colebrook) por encima.\n    OJO: transición brusca en RE_CR, solo con fines ilustrativos.\"\"\"\n    if Re < RE_CR:\n        return C / Re\n    return brentq(lambda f: 1 / np.sqrt(f) + 2 * np.log10(2.51 / (Re * np.sqrt(f))), 1e-4, 1)\n\n\ndef dp_por_metro(Q, g):\n    V = Q / A\n    Re = rho * V * g[\"Dh\"] / mu\n    f = f_darcy(Re, g[\"C\"])\n    return Re, f, f / g[\"Dh\"] * rho * V ** 2 / 2\n\n\nprint(f\"\\n{'Q (L/min)':>9} {'V (m/s)':>8} | {'Re circ':>7} {'Δp/L circ':>10} | {'Re cuad':>7} {'Δp/L cuad':>10} | cuad/circ\")\nfor q in Q_TABLA:\n    Q = q / 60000\n    Rc, _, dc = dp_por_metro(Q, geo[\"circular\"])\n    Rs, _, ds = dp_por_metro(Q, geo[\"cuadrado\"])\n    reg = lambda R: \"L\" if R < RE_CR else \"T\"\n    print(f\"{q:9.1f} {Q/A:8.3f} | {Rc:6.0f}{reg(Rc)} {dc:10.1f} | {Rs:6.0f}{reg(Rs)} {ds:10.1f} | {ds/dc:6.2f}\")\nprint(\"(L = laminar, T = turbulento, Δp/L en Pa/m)\")\n\n# --------------------------------------------------------- 3. GRÁFICAS\n# Figura 1: perfiles laminares (misma escala de color, normalizados con la velocidad media)\nfig1, axs = plt.subplots(1, 2, figsize=(9, 4.2))\nlev = np.linspace(0, 2.2, 12)\n# círculo: u/ū = 2(1 - r²/R²)\nx = np.linspace(-1, 1, 301); X, Y = np.meshgrid(x, x); R2 = X ** 2 + Y ** 2\nuc = np.where(R2 <= 1, 2 * (1 - R2), np.nan)\ncs = axs[0].contourf(X, Y, uc, levels=lev, cmap=\"Blues\")\naxs[0].add_patch(plt.Circle((0, 0), 1, fill=False, lw=2, color=\"#333333\"))\n# cuadrado\nw = np.ones(N); w[0] = w[-1] = 0.5; h = 1 / (N - 1)\nus = u_sq / ((w @ u_sq @ w) * h * h)\ns = np.sqrt(np.pi) / 2               # mismo área que el círculo de radio 1\nxs = np.linspace(-s, s, N); XS, YS = np.meshgrid(xs, xs)\naxs[1].contourf(XS, YS, us, levels=lev, cmap=\"Blues\")\naxs[1].add_patch(plt.Rectangle((-s, -s), 2 * s, 2 * s, fill=False, lw=2, color=\"#333333\"))\nfor ax, t in zip(axs, [f\"Circular\\nu$_{{máx}}$/ū = 2.00,  f·Re = 64\",\n                        f\"Cuadrado (misma área)\\nu$_{{máx}}$/ū = {us.max():.2f},  f·Re = {fRe_sq:.1f}\"]):\n    ax.set_aspect(\"equal\"); ax.axis(\"off\"); ax.set_title(t, fontsize=10)\n    ax.set_xlim(-1.1, 1.1); ax.set_ylim(-1.2, 1.1)\naxs[1].annotate(\"esquinas: fluido casi en reposo\", (s * 0.92, -s * 0.92), xytext=(-0.6, -1.08),\n                fontsize=9, arrowprops=dict(arrowstyle=\"->\", color=\"#333333\"))\ncb = fig1.colorbar(cs, ax=axs, shrink=0.8, label=\"u / ū\")\nfig1.savefig(\"perfiles_circular_cuadrado.png\", dpi=200, bbox_inches=\"tight\")\n\n# Figura 2: pérdida de presión frente al caudal\nq = np.logspace(np.log10(0.2), np.log10(10), 300)\nfig2, (ax1, ax2) = plt.subplots(1, 2, figsize=(11, 4.4))\nres = {}\nfor k, g in geo.items():\n    vals = np.array([dp_por_metro(qq / 60000, g) for qq in q])\n    res[k] = vals\n    ax1.loglog(q, vals[:, 2], color=g[\"col\"], lw=2, label=k)\n    qcr = RE_CR * mu / (rho * g[\"Dh\"]) * A * 60000\n    ax1.axvline(qcr, color=g[\"col\"], lw=1, ls=\":\")\nax1.set_xlabel(\"Caudal Q (L/min)\"); ax1.set_ylabel(\"Δp / L (Pa/m)\")\nax1.set_title(\"(a) Pérdida de presión (transición brusca en Re = 2300)\", fontsize=10, loc=\"left\")\nax1.legend(frameon=False)\nratio = res[\"cuadrado\"][:, 2] / res[\"circular\"][:, 2]\nax2.semilogx(q, ratio, color=\"#333333\", lw=2)\nax2.axhline(1, color=\"#999999\", lw=1)\nax2.set_ylim(0, 1.5)\nax2.set_xlabel(\"Caudal Q (L/min)\"); ax2.set_ylabel(\"Δp cuadrado / Δp circular\")\nax2.set_title(\"(b) Cociente de pérdidas\", fontsize=10, loc=\"left\")\nax2.text(0.25, 1.2, \"laminar: +13 %\", fontsize=9)\nax2.text(4.0, 1.25, \"turbulento: +16 %\", fontsize=9)\nax2.text(1.45, 0.45, \"el círculo ya es\\nturbulento y el\\ncuadrado aún laminar\", fontsize=9, ha=\"left\")\nfor ax in (ax1, ax2):\n    ax.grid(color=\"#E3E3E3\", lw=0.8, which=\"both\")\n    for sp in (\"top\", \"right\"):\n        ax.spines[sp].set_visible(False)\nfig2.tight_layout()\nfig2.savefig(\"dp_circular_cuadrado.png\", dpi=200)\nplt.show()\n", "ej3_incertidumbre_Recrit.py": "\"\"\"\nSistemas de fluidos - GITI\nEjemplo numérico 3: LOS NÚMEROS DE REYNOLDS CRÍTICOS NO SON EXACTOS\n\nRe = 2300 (tuberías) o Re_x = 5e5 (placa plana) NO son constantes físicas:\ndependen de las perturbaciones a la entrada, la rugosidad, las vibraciones...\n\n  (a) Tubería: en la zona 2000 < Re < 4000 (o más, si el flujo es muy \"limpio\")\n      el flujo puede ser laminar o turbulento. Si nos equivocamos de régimen,\n      ¿cuánto nos equivocamos en la pérdida de carga y en la potencia de bombeo?\n  (b) Placa plana: la posición donde empieza la transición depende de qué\n      Re_x,cr usemos. Caso del camión del problema 9 (aire a 30 °C, 29.1 m/s).\n\nPrueba a cambiar los datos del caso de diseño (bloque DATOS).\nRequiere: numpy, matplotlib, scipy\n\"\"\"\nimport numpy as np\nimport matplotlib.pyplot as plt\nfrom scipy.optimize import brentq\n\n# ----------------------------------------------------------------- DATOS\n# Caso de diseño: circuito de refrigeración de una máquina (agua a 20 °C)\nD, L = 0.010, 5.0               # diámetro (m) y longitud (m) del tubo\nrho, mu = 998.0, 1.002e-3       # agua a 20 °C\nRe_diseno = 3000                # el caudal elegido da este Re\n# Placa plana (problema 9)\nU, rho_a, mu_a = 29.1, 1.164, 1.872e-5\n\n# Valores de Re crítico en tubería publicados (orientativos)\nHISTORIA = [\n    (\"Límite inferior: por debajo, toda perturbación se amortigua\", 2040),\n    (\"Valor 'de libro' (Çengel)\", 2300),\n    (\"Reynolds (1883), entrada muy tranquila\", 12000),\n    (\"Ekman (1910), entrada cuidadosamente diseñada\", 40000),\n    (\"Pfenniger (1961), perturbaciones minimizadas\", 100000),\n]\nC_LAM, C_TURB = \"#1F5A8C\", \"#C00000\"\n\n\ndef f_colebrook(Re, eps_D=0.0):\n    g = lambda f: 1 / np.sqrt(f) + 2 * np.log10(eps_D / 3.7 + 2.51 / (Re * np.sqrt(f)))\n    return brentq(g, 1e-4, 1)\n\n\n# ------------------------------------------------- (a) TUBERÍA: CASO DE DISEÑO\nprint(\"Re crítico en tuberías: valores publicados\")\nfor txt, Re in HISTORIA:\n    print(f\"  {Re:>7,d}\".replace(\",\", \" \") + f\"  {txt}\")\n\nA = np.pi * D ** 2 / 4\nV = Re_diseno * mu / (rho * D)\nQ = V * A\nf_lam, f_turb = 64 / Re_diseno, f_colebrook(Re_diseno)\ndp_lam = f_lam * L / D * rho * V ** 2 / 2\ndp_turb = f_turb * L / D * rho * V ** 2 / 2\nprint(f\"\\nCaso de diseño: D = {D*1000:.0f} mm, L = {L} m, Re = {Re_diseno}\")\nprint(f\"  V = {V:.3f} m/s, Q = {Q*60000:.2f} L/min\")\nprint(f\"  Si es laminar:    f = {f_lam:.4f}  Δp = {dp_lam:7.0f} Pa  W = {Q*dp_lam:.3f} W\")\nprint(f\"  Si es turbulento: f = {f_turb:.4f}  Δp = {dp_turb:7.0f} Pa  W = {Q*dp_turb:.3f} W\")\nprint(f\"  -> la pérdida de presión puede variar en un factor {dp_turb/dp_lam:.1f}\")\nprint(\"  -> diseñar la bomba para el caso más desfavorable (turbulento)\")\n\n# ------------------------------------------------- (b) PLACA PLANA\nprint(\"\\nPlaca plana (camión, U = 29.1 m/s):\")\nfor Rex, txt in [(1e5, \"inicio de transición, placa lisa ideal\"), (5e5, \"valor ingenieril\"),\n                 (3e6, \"totalmente turbulenta\")]:\n    print(f\"  Re_x = {Rex:.0e}: x = {mu_a*Rex/(rho_a*U):.3f} m  ({txt})\")\n\n# ----------------------------------------------------------- GRÁFICAS\nfig, (ax1, ax2) = plt.subplots(1, 2, figsize=(11, 4.4))\nfor ax in (ax1, ax2):\n    ax.grid(color=\"#E3E3E3\", lw=0.8, which=\"both\")\n    for s in (\"top\", \"right\"):\n        ax.spines[s].set_visible(False)\n\nRe = np.logspace(np.log10(800), 5, 400)\nax1.axvspan(2040, 4000, color=\"#FFF4D6\", zorder=0)\nax1.loglog(Re[Re <= 2300], 64 / Re[Re <= 2300], color=C_LAM, lw=2)\nax1.loglog(Re[Re >= 2300], 64 / Re[Re >= 2300], color=C_LAM, lw=2, ls=\"--\")\nRet = Re[Re >= 2000]\nax1.loglog(Ret, [f_colebrook(r) for r in Ret], color=C_TURB, lw=2)\nax1.annotate(\"\", xy=(Re_diseno, f_turb), xytext=(Re_diseno, f_lam),\n             arrowprops=dict(arrowstyle=\"<->\", color=\"#333333\", lw=1.2))\nax1.text(Re_diseno * 1.08, np.sqrt(f_lam * f_turb), f\"× {f_turb/f_lam:.1f}\", fontsize=11, va=\"center\")\nax1.text(900, 0.022, \"laminar\\nf = 64/Re\", color=C_LAM, fontsize=10)\nax1.text(1.2e4, 0.034, \"turbulento\\n(Colebrook, liso)\", color=C_TURB, fontsize=10)\nax1.text(2.2e4, 0.0042, \"laminar mantenido\\nen laboratorio\", color=C_LAM, fontsize=9)\nax1.text(2100, 0.0011, \"zona\\nincierta\", fontsize=9, color=\"#555555\")\nax1.set_ylim(0.0008, 0.1)\nax1.set_xlabel(\"Re\"); ax1.set_ylabel(\"factor de fricción f\")\nax1.set_title(\"(a) Tubería: ¿laminar o turbulento?\", fontsize=11, loc=\"left\")\n\nRex = np.logspace(4.7, 6.7, 200)\nax2.semilogx(Rex, mu_a * Rex / (rho_a * U) * 100, color=\"#333333\", lw=2)\nfor r, txt, col in [(1e5, \"1×10⁵\", C_LAM), (5e5, \"5×10⁵\", \"#7A5A00\"), (3e6, \"3×10⁶\", C_TURB)]:\n    x = mu_a * r / (rho_a * U) * 100\n    ax2.plot(r, x, \"o\", ms=9, color=col, mec=\"white\", mew=2)\n    ax2.annotate(f\"Re$_x$ = {txt}\\nx = {x:.0f} cm\" if x >= 10 else f\"Re$_x$ = {txt}\\nx = {x:.1f} cm\",\n                 (r, x), xytext=(-10, 10), textcoords=\"offset points\", ha=\"right\", fontsize=9)\nax2.set_xlabel(\"Re$_{x,cr}$ supuesto\"); ax2.set_ylabel(\"posición de la transición x (cm)\")\nax2.set_title(\"(b) Placa plana: el camión del problema 9\", fontsize=11, loc=\"left\")\n\nfig.tight_layout()\nfig.savefig(\"incertidumbre_Recrit.png\", dpi=200)\nplt.show()\n", "ej4_longitud_entrada.py": "\"\"\"\nSistemas de fluidos - GITI\nEjemplo numérico 4: ENFRIADOR DE ACEITE DE TUBOS CORTOS. ¿IMPORTA LA LONGITUD DE ENTRADA?\n\nLos tubos de un enfriador de aceite son cortos y el flujo es laminar. La fórmula\nf = 64/Re supone flujo totalmente desarrollado, pero la longitud de entrada laminar,\nL_h ≈ 0.05·Re·D, puede ser comparable a la longitud del tubo.\n\nEn la región de entrada el esfuerzo en la pared es mayor, así que la pérdida de presión\nreal es mayor. Se calcula con el factor de fricción aparente de Shah (1978), válido para\nflujo laminar en desarrollo en un tubo circular:\n\n    f_app·Re (Fanning) = 3.44/√ξ + [1.25/(4ξ) + 16 − 3.44/√ξ] / (1 + 0.00021·ξ⁻²),   ξ = L/(D·Re)\n    f_app (Darcy) = 4·f_app (Fanning)\n\nPrueba a cambiar la longitud de los tubos, la velocidad o el aceite (bloque DATOS).\nRequiere: numpy, matplotlib\n\"\"\"\nimport numpy as np\nimport matplotlib.pyplot as plt\n\n# ----------------------------------------------------------------- DATOS\nD = 0.010          # diámetro interior de los tubos (m)\nL = 0.60           # longitud de los tubos (m)\nV = 1.5            # velocidad media en los tubos (m/s)\nN_TUBOS = 40\nTEMPS = [40, 60, 80]   # temperaturas del aceite (°C)\n\n\n# --------------------------------------- aceite ISO VG 46 (46 cSt a 40 °C, 6.8 cSt a 100 °C)\ndef nu(T):\n    T1, T2, n1, n2 = 313.15, 373.15, 46.0, 6.8\n    y1, y2 = np.log10(np.log10(n1 + 0.7)), np.log10(np.log10(n2 + 0.7))\n    B = (y1 - y2) / (np.log10(T2) - np.log10(T1)); A = y1 + B * np.log10(T1)\n    return (10 ** (10 ** (A - B * np.log10(T + 273.15))) - 0.7) * 1e-6       # Walther (ASTM D341)\n\n\ndef rho(T): return 870.0 * (1 - 0.00064 * (T - 15))\n\n\ndef fRe_app(xi):\n    \"\"\"f·Re aparente (Darcy) para flujo laminar en desarrollo en tubo circular (Shah, 1978).\"\"\"\n    fan = 3.44 / np.sqrt(xi) + (1.25 / (4 * xi) + 16 - 3.44 / np.sqrt(xi)) / (1 + 0.00021 * xi ** -2)\n    return 4 * fan\n\n\n# ----------------------------------------------------------- CÁLCULO\nQ = N_TUBOS * np.pi * D ** 2 / 4 * V\nprint(f\"Enfriador: {N_TUBOS} tubos de D = {D*1000:.0f} mm y L = {L*1000:.0f} mm, V = {V} m/s, \"\n      f\"Q = {Q*60000:.0f} L/min de aceite ISO VG 46\\n\")\nprint(f\"{'T (°C)':>6} {'ν (cSt)':>8} {'Re':>6} {'L_h (m)':>8} {'L_h/L':>6} {'Δp desarr. (kPa)':>17} \"\n      f\"{'Δp real (kPa)':>14} {'error':>7}\")\nres = []\nfor T in TEMPS:\n    Re = V * D / nu(T)\n    Lh = 0.05 * Re * D\n    xi = L / (D * Re)\n    dyn = rho(T) * V ** 2 / 2\n    dp_des = 64 / Re * L / D * dyn\n    dp_real = fRe_app(xi) / Re * L / D * dyn\n    res.append((T, xi, dp_real / dp_des))\n    print(f\"{T:6d} {nu(T)*1e6:8.1f} {Re:6.0f} {Lh:8.2f} {Lh/L:6.2f} {dp_des/1000:17.1f} {dp_real/1000:14.1f} \"\n          f\"{100*(dp_real/dp_des-1):6.0f} %\")\n\n# ----------------------------------------------------------- GRÁFICA\nxi = np.logspace(-3, 0, 300)\nfig, ax = plt.subplots(figsize=(6.5, 4.2))\nax.semilogx(xi, fRe_app(xi) / 64, color=\"#333333\", lw=2)\nax.axhline(1, color=\"#999999\", lw=1)\ncols = {40: \"#1F5A8C\", 60: \"#7A5A00\", 80: \"#C00000\"}\nfor T, x, r in res:\n    ax.plot(x, r, \"o\", ms=9, color=cols[T], mec=\"white\", mew=2)\n    ax.annotate(f\"{T} °C: +{100*(r-1):.0f} %\", (x, r), xytext=(8, 6), textcoords=\"offset points\",\n                fontsize=10, color=cols[T])\nax.axvline(0.05, color=\"#999999\", lw=1, ls=\":\")\nax.text(0.055, 2.7, \"L = L$_h$\\n(ξ = 0.05)\", fontsize=9, color=\"#555555\")\nax.set_ylim(0.9, 3.2)\nax.set_xlabel(\"ξ = L / (D·Re)\"); ax.set_ylabel(\"Δp real / Δp con f = 64/Re\")\nax.set_title(\"Pérdida de presión en tubos cortos en régimen laminar\", fontsize=11, loc=\"left\")\nax.grid(color=\"#E3E3E3\", lw=0.8, which=\"both\")\nfor s in (\"top\", \"right\"):\n    ax.spines[s].set_visible(False)\nfig.tight_layout(); fig.savefig(\"longitud_entrada.png\", dpi=200)\nplt.show()\n", "ej5_modelo_turbulencia_laminar.py": "\"\"\"\nSistemas de fluidos - GITI\nEjemplo numérico 5: ¿QUÉ PASA SI APLICAMOS UN MODELO DE TURBULENCIA A UN FLUJO LAMINAR?\n\nLos programas de CFD suelen usar por defecto un modelo de turbulencia. El modelo\nañade un esfuerzo de Reynolds (viscosidad turbulenta) aunque el flujo real sea laminar.\n\nAquí lo hacemos \"a mano\" con el modelo de longitud de mezcla de Prandtl (diap. 36):\nflujo totalmente desarrollado en una tubería lisa, con\n  - longitud de mezcla de Nikuradse:  l_m/R = 0.14 − 0.08(1−y/R)² − 0.06(1−y/R)⁴\n  - amortiguamiento de van Driest cerca de la pared: × (1 − exp(−y⁺/26))\nEn variables de pared (y⁺ = y·u*/ν, u⁺ = u/u*, R⁺ = R·u*/ν) el equilibrio de fuerzas\n    (1 + ν_t/ν)·du⁺/dy⁺ = 1 − y/R,      ν_t/ν = l⁺²·du⁺/dy⁺\ntiene solución explícita para du⁺/dy⁺. Integrando se obtiene la velocidad media y\n    f = 8/U⁺²,   Re = 2·R⁺·U⁺.\n\nComparamos con la solución EXACTA laminar (f = 64/Re) y con Colebrook (tubo liso).\nRequiere: numpy, scipy, matplotlib\n\"\"\"\nimport numpy as np\nimport matplotlib.pyplot as plt\nfrom scipy.optimize import brentq\n\nA_PLUS, KAPPA = 26.0, 0.41\nN = 4000\n\n\ndef perfil(Rplus):\n    \"\"\"Perfil u⁺(y⁺) y velocidad media U⁺ con el modelo de longitud de mezcla.\"\"\"\n    eta = np.linspace(0, 1, N)                    # y/R\n    yp = eta * Rplus\n    lm = (0.14 - 0.08 * (1 - eta) ** 2 - 0.06 * (1 - eta) ** 4) * (1 - np.exp(-yp / A_PLUS))\n    lp = lm * Rplus                               # l⁺\n    S = 1 - eta\n    dudy = 2 * S / (1 + np.sqrt(1 + 4 * lp ** 2 * S))\n    up = np.concatenate([[0], np.cumsum(0.5 * (dudy[1:] + dudy[:-1]) * np.diff(yp))])\n    g = up * (1 - eta)\n    Ub = 2 * np.sum(0.5 * (g[1:] + g[:-1]) * np.diff(eta))   # V/u* = 2∫u⁺ (r/R) d(r/R)\n    nut = lp ** 2 * dudy\n    return eta, up, Ub, nut\n\n\ndef f_modelo(Re):\n    Rp = brentq(lambda Rp: 2 * Rp * perfil(Rp)[2] - Re, 1.0, 1e5)\n    _, _, Ub, _ = perfil(Rp)\n    return 8 / Ub ** 2, Rp\n\n\ndef f_colebrook(Re):\n    return brentq(lambda f: 1 / np.sqrt(f) + 2 * np.log10(2.51 / (Re * np.sqrt(f))), 1e-4, 1)\n\n\n# ----------------------------------------------------------- TABLA\nprint(\"Tubería lisa, flujo desarrollado. Modelo de longitud de mezcla frente a valores de referencia\\n\")\nprint(f\"{'Re':>7} {'f modelo':>9} {'f laminar 64/Re':>16} {'f Colebrook':>12}  comentario\")\nfor Re in [500, 1000, 2000, 5000, 1e4, 1e5, 1e6]:\n    fm, Rp = f_modelo(Re)\n    fl, fc = 64 / Re, f_colebrook(Re)\n    if Re < 2300:\n        com = f\"real laminar: el modelo se equivoca un {100*(fm/fl-1):+.0f} %\"\n    else:\n        com = f\"turbulento: modelo vs Colebrook {100*(fm/fc-1):+.0f} %\"\n    print(f\"{Re:7.0f} {fm:9.4f} {fl:16.4f} {fc:12.4f}  {com}\")\n\n# ----------------------------------------------------------- PLACA PLANA (fórmulas de Çengel)\nReL = 1e6\ncf_lam = 1.328 / np.sqrt(ReL)\ncf_turb = 0.074 / ReL ** 0.2\ncf_mix = 0.074 / ReL ** 0.2 - 1742 / ReL\nprint(f\"\\nPlaca plana, Re_L = {ReL:.0e} (coeficiente de fricción medio):\")\nprint(f\"  toda laminar: {cf_lam:.5f}   toda turbulenta: {cf_turb:.5f}   mixta (Re_cr = 5e5): {cf_mix:.5f}\")\nprint(f\"  suponer turbulencia desde el borde: {100*(cf_turb/cf_mix-1):+.0f} % respecto al caso mixto\")\n\n# ----------------------------------------------------------- GRÁFICAS\nfig, (a1, a2) = plt.subplots(1, 2, figsize=(11, 4.4))\nfor ax in (a1, a2):\n    ax.grid(color=\"#E3E3E3\", lw=0.8, which=\"both\")\n    for s in (\"top\", \"right\"):\n        ax.spines[s].set_visible(False)\nRe = np.logspace(np.log10(300), 5, 60)\nfm = [f_modelo(r)[0] for r in Re]\na1.axvspan(300, 2300, color=\"#E8F0F7\", zorder=0)\na1.text(330, 0.0085, \"flujo real\\nlaminar\", fontsize=9, color=\"#1F5A8C\")\na1.loglog(Re, fm, color=\"#C00000\", lw=2.5, label=\"modelo de turbulencia (longitud de mezcla)\")\na1.loglog(Re[Re <= 2300], 64 / Re[Re <= 2300], color=\"#1F5A8C\", lw=2, label=\"exacto laminar: 64/Re\")\na1.loglog(Re[Re >= 2300], [f_colebrook(r) for r in Re[Re >= 2300]], color=\"#333333\", lw=1.5, ls=\"--\",\n          label=\"Colebrook (liso)\")\na1.set_xlabel(\"Re\"); a1.set_ylabel(\"f\"); a1.set_ylim(0.007, 0.25)\na1.set_title(\"(a) Factor de fricción\", fontsize=11, loc=\"left\")\na1.legend(frameon=False, fontsize=9, loc=\"upper right\")\n\nRe0 = 1000\nfm0, Rp0 = f_modelo(Re0)\neta, up, Ub, nut = perfil(Rp0)\nr = 1 - eta\na2.plot(up / Ub, r, color=\"#C00000\", lw=2.5, label=f\"modelo (f = {fm0:.3f})\")\na2.plot(2 * (1 - r ** 2), r, color=\"#1F5A8C\", lw=2, label=f\"exacto: Poiseuille (f = {64/Re0:.3f})\")\na2.set_xlabel(\"u / V\"); a2.set_ylabel(\"r / R\"); a2.set_xlim(0, 2.1)\na2.set_title(f\"(b) Perfil de velocidad a Re = {Re0}\", fontsize=11, loc=\"left\")\na2.legend(frameon=False, fontsize=9, loc=\"lower left\")\na2.text(0.05, 0.55, f\"$\\\\nu_t$ máx ≈ {nut.max():.1f}·$\\\\nu$\\n(una viscosidad que no existe)\", fontsize=9, color=\"#C00000\")\nfig.tight_layout(); fig.savefig(\"modelo_turbulencia_laminar.png\", dpi=200)\nplt.show()\n", "ej6_envejecimiento.py": "\"\"\"\nSistemas de fluidos - GITI\nEjemplo numérico 6: ENVEJECIMIENTO DE UNA CONDUCCIÓN DE ACERO\n\nUna bomba centrífuga se elige para que, con la tubería NUEVA, dé el caudal de diseño.\nCon los años la corrosión y las incrustaciones aumentan la rugosidad, sube la pérdida\nde carga y el punto de funcionamiento se desplaza: la bomba da menos caudal.\n\nModelo de envejecimiento (Colebrook y White, 1937): la rugosidad crece linealmente,\n    ε(t) = ε0 + α·t\nα depende MUCHO del agua y del material (de centésimas a décimas de mm/año en acero\nsin protección). Aquí se toma un valor orientativo: cámbialo y mira qué pasa.\n\nRequiere: numpy, scipy, matplotlib\n\"\"\"\nimport numpy as np\nimport matplotlib.pyplot as plt\nfrom scipy.optimize import brentq\n\n# ----------------------------------------------------------------- DATOS\nD, L = 0.30, 3000.0          # diámetro (m) y longitud (m) de la conducción\nDZ = 20.0                    # desnivel a vencer (m)\nK_TOT = 10.0                 # pérdidas menores (válvulas, codos, entrada/salida)\nQ_DIS = 0.100                # caudal de diseño (m³/s)\nEPS0 = 0.045e-3              # rugosidad de acero comercial nuevo (m)\nALFA = 0.05e-3               # crecimiento de la rugosidad (m/año), ORIENTATIVO\nNU, RHO, G = 1.0e-6, 998.0, 9.81\nAÑOS = [0, 5, 10, 20, 30]\n\n\ndef f_colebrook(Re, eD):\n    return brentq(lambda f: 1 / np.sqrt(f) + 2 * np.log10(eD / 3.7 + 2.51 / (Re * np.sqrt(f))), 1e-4, 1)\n\n\ndef H_sistema(Q, eps):\n    V = Q / (np.pi * D ** 2 / 4)\n    f = f_colebrook(V * D / NU, eps / D)\n    return DZ + (f * L / D + K_TOT) * V ** 2 / (2 * G), f\n\n\n# Bomba: H = H0·(1 − (Q/Qmax)²), elegida para pasar por el punto de diseño con tubería nueva\nH_dis, _ = H_sistema(Q_DIS, EPS0)\nQMAX = 1.8 * Q_DIS\nH0 = H_dis / (1 - (Q_DIS / QMAX) ** 2)\nH_bomba = lambda Q: H0 * (1 - (Q / QMAX) ** 2)\nprint(f\"Punto de diseño (tubería nueva): Q = {Q_DIS*1000:.0f} L/s, H = {H_dis:.1f} m; bomba con H0 = {H0:.1f} m\\n\")\n\nprint(f\"{'años':>4} {'ε (mm)':>7} {'ε/D':>9} {'f':>7} {'h_L a Q dis. (m)':>17} {'Q real (L/s)':>13} {'pérdida de Q':>13}\")\nres = []\nfor t in AÑOS:\n    eps = EPS0 + ALFA * t\n    H, f = H_sistema(Q_DIS, eps)\n    Qop = brentq(lambda Q: H_bomba(Q) - H_sistema(Q, eps)[0], 1e-4, QMAX)\n    res.append((t, eps, Qop))\n    print(f\"{t:4d} {eps*1000:7.3f} {eps/D:9.2e} {f:7.4f} {H-DZ:17.1f} {Qop*1000:13.1f} {100*(Qop/Q_DIS-1):12.0f} %\")\n\n# ----------------------------------------------------------- GRÁFICAS\nQ = np.linspace(0.01, 0.16, 200)\ncols = [\"#1F5A8C\", \"#4F7FA8\", \"#7A5A00\", \"#C05A00\", \"#C00000\"]\nfig, (a1, a2) = plt.subplots(1, 2, figsize=(11, 4.4))\nfor ax in (a1, a2):\n    ax.grid(color=\"#E3E3E3\", lw=0.8)\n    for s in (\"top\", \"right\"):\n        ax.spines[s].set_visible(False)\na1.plot(Q * 1000, H_bomba(Q), color=\"#333333\", lw=2.5, label=\"bomba\")\nfor (t, eps, Qop), c in zip(res, cols):\n    a1.plot(Q * 1000, [H_sistema(q, eps)[0] for q in Q], color=c, lw=1.8, label=f\"tubería, {t} años\")\n    a1.plot(Qop * 1000, H_bomba(Qop), \"o\", ms=8, color=c, mec=\"white\", mew=1.5)\na1.set_xlabel(\"Q (L/s)\"); a1.set_ylabel(\"H (m)\"); a1.set_ylim(0, 1.3 * H0)\na1.set_title(\"(a) Punto de funcionamiento\", fontsize=11, loc=\"left\")\na1.legend(frameon=False, fontsize=8.5, loc=(0.18, 0.02), ncol=2)\n\nt = np.linspace(0, 30, 61)\nQt = [brentq(lambda q: H_bomba(q) - H_sistema(q, EPS0 + ALFA * tt)[0], 1e-4, QMAX) for tt in t]\na2.plot(t, np.array(Qt) * 1000, color=\"#C00000\", lw=2.5)\na2.axhline(Q_DIS * 1000, color=\"#333333\", lw=1, ls=\"--\")\na2.text(20, Q_DIS * 1000 - 1.6, \"caudal de diseño\", fontsize=9); a2.set_ylim(80, 102)\na2.set_xlabel(\"años de servicio\"); a2.set_ylabel(\"Q real (L/s)\")\na2.set_title(f\"(b) Caudal con la misma bomba (α = {ALFA*1000:.2f} mm/año)\", fontsize=11, loc=\"left\")\nfig.tight_layout(); fig.savefig(\"envejecimiento.png\", dpi=200)\nplt.show()\n", "ej7_transicion_placa.py": "\"\"\"\nSistemas de fluidos - GITI\nEjemplo numérico 7: ¿Y SI NOS EQUIVOCAMOS EN LA POSICIÓN DE LA TRANSICIÓN?\n\nPlaca plana lisa del ejemplo de capa límite del tema: aire a 20 °C, V = 10 m/s,\nL = 1.52 m (Re_L ≈ 10⁶). Calculamos el arrastre por fricción y el coeficiente de\nconvección medio según dónde empiece la turbulencia (Re_x,cr), con transición\nbrusca (aproximación habitual de los libros):\n\n  laminar   (x < x_cr): C_f,x = 0.664/Re_x^0.5      Nu_x = 0.332 Re_x^0.5 Pr^1/3\n  turbulento(x > x_cr): C_f,x = 0.059/Re_x^0.2      Nu_x = 0.0296 Re_x^0.8 Pr^1/3\n\n  medios:  C_f = [1.328 Re_cr^0.5 + 0.074 (Re_L^0.8 − Re_cr^0.8)] / Re_L\n           Nu  = [0.664 Re_cr^0.5 + 0.037 (Re_L^0.8 − Re_cr^0.8)] Pr^1/3\nRequiere: numpy, matplotlib\n\"\"\"\nimport numpy as np\nimport matplotlib.pyplot as plt\n\n# ----------------------------------------------------------------- DATOS\nV, L = 10.0, 1.52                   # velocidad (m/s) y longitud de la placa (m)\nRHO, NU, K, PR = 1.204, 1.516e-5, 0.02514, 0.7309   # aire a 20 °C\nRE_L = V * L / NU\nCASOS = [(1e5, \"1·10⁵ (flujo libre muy perturbado)\"), (3e5, \"3·10⁵\"), (5e5, \"5·10⁵ (valor ingenieril)\"),\n         (RE_L, \"toda laminar (Re_cr ≥ Re_L)\")]\n\n\ndef medios(Recr):\n    Recr = min(Recr, RE_L)\n    Cf = (1.328 * Recr ** 0.5 + 0.074 * (RE_L ** 0.8 - Recr ** 0.8)) / RE_L\n    Nu = (0.664 * Recr ** 0.5 + 0.037 * (RE_L ** 0.8 - Recr ** 0.8)) * PR ** (1 / 3)\n    return Cf, Nu * K / L\n\n\ndef h_local(x, Recr):\n    Rex = V * x / NU\n    lam = 0.332 * Rex ** 0.5 * PR ** (1 / 3)\n    tur = 0.0296 * Rex ** 0.8 * PR ** (1 / 3)\n    return np.where(Rex <= Recr * (1 + 1e-9), lam, tur) * K / x\n\n\nprint(f\"Placa: V = {V} m/s, L = {L} m, Re_L = {RE_L:.3g}\\n\")\nprint(f\"{'Re_x,cr':>36} {'x_cr (m)':>9} {'C_f medio':>10} {'F/b (N/m)':>10} {'h medio (W/m²K)':>16}\")\nref = medios(5e5)\nfor Recr, lab in CASOS:\n    Cf, h = medios(Recr)\n    F = Cf * 0.5 * RHO * V ** 2 * L          # fuerza por unidad de anchura, una cara\n    xcr = min(Recr, RE_L) * NU / V\n    print(f\"{lab:>36} {xcr:9.2f} {Cf:10.5f} {F:10.3f} {h:16.1f}\"\n          f\"   ({100*(Cf/ref[0]-1):+.0f} % en C_f, {100*(h/ref[1]-1):+.0f} % en h respecto a 5·10⁵)\")\n\n# ----------------------------------------------------------- GRÁFICAS\nfig, (a1, a2) = plt.subplots(1, 2, figsize=(11, 4.4))\nfor ax in (a1, a2):\n    ax.grid(color=\"#E3E3E3\", lw=0.8)\n    for s in (\"top\", \"right\"):\n        ax.spines[s].set_visible(False)\nx = np.linspace(0.005, L, 600)\nfor (Recr, lab), c in zip(CASOS, [\"#C00000\", \"#7A5A00\", \"#333333\", \"#1F5A8C\"]):\n    a1.plot(x, h_local(x, Recr), color=c, lw=2, label=f\"Re$_{{x,cr}}$ = {lab.split(' (')[0]}\" if Recr < RE_L else \"toda laminar\")\na1.set_ylim(0, 60); a1.set_xlabel(\"x (m)\"); a1.set_ylabel(\"h local (W/m²K)\")\na1.set_title(\"(a) Coeficiente de convección local\", fontsize=11, loc=\"left\")\na1.legend(frameon=False, fontsize=9)\n\nRecr = np.logspace(5, np.log10(RE_L), 100)\nxcr = Recr * NU / V\nM = np.array([medios(r) for r in Recr])\na2.plot(xcr / L, M[:, 0] / ref[0], color=\"#C00000\", lw=2.5)\na2.axvline(5e5 * NU / V / L, color=\"#999999\", lw=1, ls=\":\")\na2.text(5e5 * NU / V / L + 0.015, 1.42, \"Re$_{x,cr}$ = 5·10⁵\", fontsize=9, color=\"#555555\")\na2.axhline(1, color=\"#999999\", lw=1)\na2.text(0.12, 0.55, \"C$_f$ medio y h medio varían igual\\n(analogía de Reynolds–Colburn:\\nNu = C$_f$·Re$_L$·Pr$^{1/3}$/2)\", fontsize=9)\na2.set_xlabel(\"posición de la transición x$_{cr}$ / L\"); a2.set_ylabel(\"valor / valor con Re$_{x,cr}$ = 5·10⁵\")\na2.set_title(\"(b) Arrastre y calor medios\", fontsize=11, loc=\"left\")\nfig.tight_layout(); fig.savefig(\"transicion_placa.png\", dpi=200)\nplt.show()\n"}, "turb2_ejercicios": {"t2e1_richardson.py": "\"\"\"\nTurbulencia 2 · Ejercicio 1: número de Richardson en un estuario y en la atmósfera.\nRi = N²/(dU/dz)²;  con perfiles lineales en una capa de espesor h:  Ri = g' h / ΔU²,  g' = g Δρ/ρ0\nCriterio de Miles-Howard: si Ri > 1/4 en todo el flujo, el flujo estratificado es estable.\n\"\"\"\nimport numpy as np\nG = 9.81\n# --- a) y b) estuario (cuña salina)\nr1, r2, h = 1000.0, 1025.0, 1.0\nr0 = (r1 + r2) / 2\ngp = G * (r2 - r1) / r0\nprint(f\"g' = {gp:.4f} m/s²,  N² = g'/h = {gp/h:.4f} s⁻²\")\nfor dU in (0.5, 1.0, 1.5):\n    print(f\"  ΔU = {dU} m/s: Ri = {gp*h/dU**2:.3f}\")\nfor hh in (1.0, 3.0):\n    print(f\"  h = {hh} m: ΔU crítica (Ri = 1/4) = {np.sqrt(4*gp*hh):.2f} m/s\")\n# --- c) inversión nocturna\nT, dth, H = 283.0, 5.0, 100.0\nN2 = G / T * dth / H\nfor U0, U1 in ((2, 8), (2, 12)):\n    S = (U1 - U0) / H\n    print(f\"Atmósfera, viento {U0}→{U1} m/s en {H:.0f} m: N² = {N2:.2e} s⁻², (dU/dz)² = {S**2:.2e} s⁻², Ri = {N2/S**2:.2f}\")\nprint(f\"Cizalla crítica: dU/dz = {np.sqrt(4*N2):.4f} s⁻¹ → ΔU = {np.sqrt(4*N2)*H:.1f} m/s en {H:.0f} m\")\n", "t2e2_kh_viento.py": "\"\"\"\nTurbulencia 2 · Ejercicio 2: ¿puede el viento levantar olas por Kelvin-Helmholtz?\nAire (1) sobre agua (2). Inestable si\n   ρ1ρ2 ΔU²/(ρ1+ρ2)² > [(ρ2-ρ1) g/k + σs k]/(ρ1+ρ2)\nSin tensión superficial (σs = 0):  ΔU² > g(ρ2²-ρ1²)/(k ρ1 ρ2)\nRequiere: numpy, matplotlib\n\"\"\"\nimport numpy as np\nimport matplotlib.pyplot as plt\n\nG, R1, R2, SIG = 9.81, 1.2, 1000.0, 0.073\n\ndef dU_crit(k, s):\n    return np.sqrt((R1 + R2) / (R1 * R2) * ((R2 - R1) * G / k + s * k))\n\nprint(\"a) Sin tensión superficial\")\nfor lam in (1.0, 0.1, 0.01):\n    k = 2 * np.pi / lam\n    print(f\"   λ = {lam*100:5.0f} cm: ΔU crítica = {dU_crit(k, 0):5.1f} m/s\")\nks = np.sqrt((R2 - R1) * G / SIG)\nprint(f\"b) Con tensión superficial: k* = {ks:.0f} 1/m, λ* = {200*np.pi/ks:.2f} cm, ΔU mínima = {dU_crit(ks, SIG):.2f} m/s\")\nfor lam in (1.0, 0.1, 0.01):\n    print(f\"   λ = {lam*100:5.0f} cm: ΔU crítica = {dU_crit(2*np.pi/lam, SIG):5.1f} m/s\")\n# tasa de crecimiento con 10 m/s\ndU = 10.0\nlam = np.logspace(-3.3, 0, 400); k = 2 * np.pi / lam\ndisc = R1 * R2 * dU**2 / (R1 + R2)**2 - ((R2 - R1) * G / k + SIG * k) / (R1 + R2)\nsig = k * np.sqrt(np.clip(disc, 0, None))\ni = np.argmax(sig)\nprint(f\"c) ΔU = {dU} m/s: inestable para {lam[sig>0].min()*100:.2f} < λ < {lam[sig>0].max()*100:.1f} cm; \"\n      f\"máxima tasa {sig[i]:.0f} 1/s en λ = {lam[i]*100:.2f} cm (tiempo de e-plegado {1000/sig[i]:.0f} ms)\")\n\nfig, ax = plt.subplots(figsize=(7, 4.2))\nlam2 = np.logspace(-3, 0.5, 400)\nax.loglog(lam2 * 100, dU_crit(2 * np.pi / lam2, 0), color=\"#7A5A00\", lw=2, label=\"sin tensión superficial\")\nax.loglog(lam2 * 100, dU_crit(2 * np.pi / lam2, SIG), color=\"#1F5A8C\", lw=2.5, label=\"con tensión superficial\")\nax.axhline(dU_crit(ks, SIG), color=\"#C00000\", ls=\":\", lw=1.2)\nax.text(0.12, dU_crit(ks, SIG) * 1.08, f\"ΔU mín ≈ {dU_crit(ks, SIG):.1f} m/s\", color=\"#C00000\", fontsize=9)\nax.text(30, 3, \"ESTABLE\", color=\"#555555\", fontsize=10); ax.text(0.15, 40, \"INESTABLE\", color=\"#555555\", fontsize=10)\nax.set_xlabel(\"longitud de onda λ (cm)\"); ax.set_ylabel(\"ΔU crítica (m/s)\")\nax.grid(color=\"#E3E3E3\", which=\"both\", lw=0.6); ax.legend(frameon=False, fontsize=9, loc=\"upper center\")\nfor s in (\"top\", \"right\"):\n    ax.spines[s].set_visible(False)\nfig.tight_layout(); fig.savefig(\"t2e2_kh_viento.png\", dpi=200)\nplt.show()\n", "t2e3_capa_mezcla.py": "\"\"\"\nTurbulencia 2 · Ejercicio 3: capa de mezcla tras una placa separadora (densidades iguales).\nLámina de vorticidad (Kelvin-Helmholtz con ρ1 = ρ2):  c = (U1+U2)/2 ± i |U1-U2|/2\nTasa de crecimiento σ = k c_i = k ΔU/2 = π ΔU/λ ; la perturbación viaja con Uc = (U1+U2)/2.\n\"\"\"\nimport numpy as np\nU1, U2 = 20.0, 10.0\ndU, Uc = U1 - U2, (U1 + U2) / 2\nprint(f\"Velocidad de convección Uc = {Uc} m/s\")\nfor lam in (0.05, 0.005):\n    s = np.pi * dU / lam\n    te = 1 / s\n    print(f\"λ = {lam*100:4.1f} cm: σ = {s:6.0f} 1/s, tiempo de e-plegado {te*1e3:.2f} ms, \"\n          f\"recorre {Uc*te*100:.2f} cm por e-plegado; factor 10⁴ (≈ e^9.2) en x = {Uc*np.log(1e4)/s*100:.1f} cm\")\nd = 0.005\nprint(f\"Capa real de espesor δω = {d*1000:.0f} mm: λ más amplificada ≈ 7 δω = {7*d*100:.1f} cm \"\n      f\"(frecuencia en un punto fijo f = Uc/λ = {Uc/(7*d):.0f} Hz)\")\n", "t2e4_promediado.py": "\"\"\"\nTurbulencia 2 · Ejercicio 4: ¿cuánto hay que promediar? (promedio móvil de ventana Δt)\nu(t) = A e^{-t/τ} + B cos ωt   →   ū = F1·A e^{-t/τ} + F2·B cos ωt\n   F1 = sinh(x1)/x1, x1 = Δt/(2τ)   (sesgo del flujo medio: F1 - 1)\n   F2 = sin(x2)/x2,  x2 = ωΔt/2     (ráfagas que se cuelan en la media)\nRequiere: numpy, matplotlib, scipy\n\"\"\"\nimport numpy as np\nimport matplotlib.pyplot as plt\nfrom scipy.optimize import brentq\n\nTAU, PER = 7200.0, 10.0\nW = 2 * np.pi / PER\nF1 = lambda dt: np.sinh(dt / (2 * TAU)) / (dt / (2 * TAU))\nF2env = lambda dt: 1 / (W * dt / 2)                      # envolvente de |sin x / x|\ndt_min = brentq(lambda dt: F2env(dt) - 0.05, 1, 1e4)\ndt_max = brentq(lambda dt: F1(dt) - 1.01, 1, 1e5)\nprint(f\"Ráfagas < 5 % (envolvente): Δt ≥ {dt_min:.0f} s;  sesgo de la media < 1 %: Δt ≤ {dt_max:.0f} s = {dt_max/60:.0f} min\")\nfor dt in (60, 600, 3600):\n    x2 = W * dt / 2\n    print(f\"  Δt = {dt/60:4.0f} min: F1 - 1 = {100*(F1(dt)-1):.3f} %,  |F2| = {abs(np.sin(x2)/x2):.4f} (envolvente {F2env(dt):.4f})\")\n\ndts = np.logspace(0, 4.5, 800)\nfig, ax = plt.subplots(figsize=(7, 4.2))\nax.loglog(dts, np.abs(np.sin(W * dts / 2) / (W * dts / 2)), color=\"#1F5A8C\", lw=1, label=\"|F₂|: fracción de las ráfagas que queda\")\nax.loglog(dts, F1(dts) - 1, color=\"#C00000\", lw=2, label=\"F₁ − 1: error en el flujo medio\")\nax.axhline(0.05, color=\"#1F5A8C\", ls=\":\", lw=1); ax.axhline(0.01, color=\"#C00000\", ls=\":\", lw=1)\nax.axvspan(dt_min, dt_max, color=\"#2E7D32\", alpha=0.12); ax.text(700, 1e-5, \"ventana\\nadecuada\", color=\"#2E7D32\")\nax.set_xlabel(\"ventana de promediado Δt (s)\"); ax.set_ylabel(\"factor\"); ax.set_ylim(1e-6, 2)\nax.grid(color=\"#E3E3E3\", which=\"both\", lw=0.6); ax.legend(frameon=False, fontsize=9, loc=\"lower left\")\nfor s in (\"top\", \"right\"):\n    ax.spines[s].set_visible(False)\nfig.tight_layout(); fig.savefig(\"t2e4_promediado.png\", dpi=200)\nplt.show()\n", "t2e5_esfuerzos_reynolds.py": "\"\"\"\nTurbulencia 2 · Ejercicio 5: esfuerzos de Reynolds a partir de medidas.\nAnemómetro de hilo caliente en la capa límite de un túnel (aire, ρ = 1.2 kg/m³, ν = 1.5e-5 m²/s).\n\"\"\"\nimport numpy as np\nu = np.array([12.1, 11.4, 13.0, 12.6, 10.9, 11.8, 12.9, 11.2, 12.4, 11.7])\nv = np.array([-0.1, 0.5, -0.2, -0.4, 0.3, 0.3, -0.6, 0.1, 0.2, -0.1])\nRHO, NU, DUDY = 1.2, 1.5e-5, 40.0\nU, V = u.mean(), v.mean()\nup, vp = u - U, v - V\nuu, vv, uv = np.mean(up**2), np.mean(vp**2), np.mean(up * vp)\nprint(f\"ū = {U:.3f} m/s, v̄ = {V:.3f} m/s\")\nprint(\"u' =\", np.round(up, 2)); print(\"v' =\", np.round(vp, 2)); print(\"u'v' =\", np.round(up * vp, 3))\nprint(f\"u'² medio = {uu:.4f}, v'² medio = {vv:.4f}, u'v' medio = {uv:.4f} m²/s²\")\nprint(f\"intensidad de turbulencia u_rms/ū = {np.sqrt(uu)/U*100:.1f} %;  coef. de correlación = {uv/np.sqrt(uu*vv):.2f}\")\nk = 0.5 * (uu + 2 * vv)          # suponiendo w'² ≈ v'²\nprint(f\"k ≈ ½(u'²+v'²+w'²) con w'² ≈ v'²: {k:.4f} m²/s²\")\ntau_t = -RHO * uv\ntau_l = RHO * NU * DUDY\nprint(f\"τ_turb = -ρ u'v' = {tau_t:.3f} Pa;  τ_lam = μ dU/dy = {tau_l*1000:.2f} mPa;  cociente = {tau_t/tau_l:.0f}\")\nnuT = -uv / DUDY\nprint(f\"ν_T = -u'v'/(dU/dy) = {nuT:.2e} m²/s = {nuT/NU:.0f} ν\")\nprint(f\"longitud de mezcla l = sqrt(ν_T/|dU/dy|) = {np.sqrt(nuT/DUDY)*1000:.1f} mm\")\n", "t2e6_kolmogorov_tanque.py": "\"\"\"\nTurbulencia 2 · Ejercicio 6: escalas de la turbulencia en un tanque agitado.\nAgitador que transmite P = 1 kW a V = 1 m³ de agua (ν = 1e-6 m²/s, ρ = 1000 kg/m³).\nEn régimen estacionario toda la potencia se disipa: ε = P/(ρV).\n\"\"\"\nimport numpy as np\nP, VOL, RHO, NU, L = 1000.0, 1.0, 1000.0, 1.0e-6, 0.5\nfor pot in (P, 2 * P):\n    eps = pot / (RHO * VOL)\n    eta, teta, ueta = (NU**3 / eps) ** 0.25, (NU / eps) ** 0.5, (NU * eps) ** 0.25\n    U0 = (eps * L) ** (1 / 3)\n    Re = U0 * L / NU\n    print(f\"P = {pot/1000:.0f} kW: ε = {eps:.2f} W/kg; η = {eta*1e6:.1f} µm, τη = {teta*1e3:.2f} ms, uη = {ueta*100:.2f} cm/s\")\n    print(f\"     escala grande L = {L} m: U0 ~ (εL)^(1/3) = {U0:.2f} m/s, Re_L = {Re:.2e}, \"\n          f\"L/η = {L/eta:.2e} frente a Re^(3/4) = {Re**0.75:.2e}; puntos DNS ~ (L/η)³ = {(L/eta)**3:.1e}\")\nprint(\"Cizalla en la escala de Kolmogorov: γ ~ 1/τη; tensión sobre una partícula ~ μ/τη\")\neps = P / (RHO * VOL)\nprint(f\"  μ/τη = {1e-3*np.sqrt(eps/NU):.2f} Pa\")\n", "t2e7_cierre_tuberia.py": "\"\"\"\nTurbulencia 2 · Ejercicio 7: modelos de cierre en una tubería de agua (D = 10 cm, V = 2 m/s).\n(a) Longitud de mezcla l = κ y cerca de la pared con τ ≈ τw  →  ley logarítmica.\n(b) Valores de k, ε y ν_T a la entrada para un cálculo k-ε (recetas habituales de los programas de CFD):\n    I = 0.16 Re^(-1/8),  k = 3/2 (V I)²,  l = 0.07 D,  ε = Cμ^(3/4) k^(3/2)/l,  ν_T = Cμ k²/ε\nRequiere: numpy, scipy, matplotlib\n\"\"\"\nimport numpy as np\nimport matplotlib.pyplot as plt\nfrom scipy.optimize import brentq\n\nD, V, NU, KAP, B, CMU = 0.10, 2.0, 1.0e-6, 0.41, 5.0, 0.09\nRe = V * D / NU\nf = brentq(lambda f: 1 / np.sqrt(f) + 2 * np.log10(2.51 / (Re * np.sqrt(f))), 1e-4, 1)\nut = V * np.sqrt(f / 8)\nR = D / 2\nuc = ut * (np.log(R * ut / NU) / KAP + B)\nprint(f\"(a) Re = {Re:.2e}, f (Colebrook, liso) = {f:.4f}, u* = {ut:.4f} m/s\")\nprint(f\"    velocidad en el eje con la ley log: u_c = {uc:.2f} m/s, u_c/V = {uc/V:.2f} (laminar: 2)\")\n# velocidad media integrando la ley logarítmica en la sección (sin corregir la subcapa)\nr = np.linspace(0, R * (1 - 1e-6), 20000); y = R - r\nu = ut * (np.log(np.maximum(y * ut / NU, 1e-9)) / KAP + B)\nu = np.where(y * ut / NU < 11, ut * y * ut / NU, u)\nVm = np.sum(u * 2 * np.pi * r) * (r[1] - r[0]) / (np.pi * R**2)\nprint(f\"    velocidad media integrando el perfil: {Vm:.2f} m/s (dato: {V} m/s)\")\nI = 0.16 * Re ** (-1 / 8)\nk = 1.5 * (V * I) ** 2\nl = 0.07 * D\neps = CMU ** 0.75 * k ** 1.5 / l\nnuT = CMU * k ** 2 / eps\neps_media = f * V ** 3 / (2 * D)\nprint(f\"(b) I = {100*I:.1f} %, k = {k:.2e} m²/s², l = {l*1000:.0f} mm, ε = {eps:.3f} m²/s³, ν_T = {nuT:.2e} m²/s = {nuT/NU:.0f} ν\")\nprint(f\"    ε medio en la tubería (f V³/2D) = {eps_media:.2f} W/kg: {eps_media/eps:.0f} veces el de la entrada\")\nprint(\"    ν_T = Cμ^(1/4) k^(1/2) l ∝ I·l: si I o l se duplican, ν_T se duplica (y ambos son estimaciones).\")\n\nyp = np.logspace(-1, 3.5, 300)\nfig, ax = plt.subplots(figsize=(7, 4.2))\nax.semilogx(yp, yp, color=\"#7A5A00\", lw=1.5, label=\"subcapa viscosa u⁺ = y⁺\")\nax.semilogx(yp, np.log(yp) / KAP + B, color=\"#1F5A8C\", lw=2, label=\"ley logarítmica (longitud de mezcla l = κy)\")\nax.set_ylim(0, 30); ax.set_xlabel(\"y⁺ = y u*/ν\"); ax.set_ylabel(\"u⁺ = u/u*\")\nax.axvspan(5, 30, color=\"#999999\", alpha=0.15); ax.text(6.2, 1.5, \"amortiguamiento\", fontsize=9, color=\"#555555\")\nax.grid(color=\"#E3E3E3\", which=\"both\", lw=0.6); ax.legend(frameon=False, fontsize=9, loc=\"upper left\", bbox_to_anchor=(0, 1.0))\nfor s in (\"top\", \"right\"):\n    ax.spines[s].set_visible(False)\nfig.tight_layout(); fig.savefig(\"t2e7_ley_log.png\", dpi=200)\nplt.show()\n"}, "CODIGO_PYTHON": {"EC_BURGERS.py": "\"\"\"\nEC_BURGERS.py  (traducción de EC_BURGERS.m)\n-----------------------------------------\nEcuación de Burgers con C.C. Dirichlet\n\n    u_t + 1/2 (u^2)_x = nu u_xx\n    u(0,t) = u0\n    u(1,t) = uN\n\nDiscretización temporal:  Runge-Kutta de 4 pasos\nDiscretización espacial:  diferencias finitas atrasadas para d/dx\n                          diferencias finitas centradas para d2/dx2\n\nA. Lozano Durán, 2014 (versión original en MATLAB)\n-----------------------------------------\nCambio respecto al original: la figura 2 dibujaba plot(t, ...) con t escalar (el\ntiempo final) y escala vertical hasta 1e11. Aquí se guarda el tiempo de cada paso y\nse representa u(t) en 20 puntos, numérica y exacta.\n\"\"\"\nimport numpy as np\nimport scipy.sparse as sp\nimport matplotlib.pyplot as plt\nfrom rhs import rhs\nfrom solucion_burgers import coeficientes_burgers, solucion_burgers\nfrom animacion import Animacion\n\nprint(\"Ecuación de Burgers viscosa\")\n# Parámetros:\nnu = 0.2       # viscosidad\nCFL = 1.5      # CFL\nLx = 1         # longitud del dominio\nnx = 100       # número de puntos interiores\nNt = 250       # número de pasos temporales\nCADA = 1       # se dibuja la solución cada CADA pasos\ndx = Lx / (nx + 1)\nx = dx * np.arange(nx + 2)\nprint(f\"nu: {nu}\\nLx: {Lx}\\nnx: {nx}\\nCFL: {CFL}\")\n\n# Condición inicial:\nui = 4 * x * (1 - x)\nu = ui[1:nx + 1].copy()\n# Condiciones de contorno:\nu0 = ui[0]          # en x = 0\nuN = ui[nx + 1]     # en x = 1\n\n# Matrices de diferenciación sobre los nx+2 puntos\n# Derivada primera: upwind (hacia atrás)\nBx = sp.diags([-1, 1], [-1, 0], shape=(nx + 2, nx + 2),\n              format=\"csr\") / dx\ncol = lambda B, j: B[1:-1, j].toarray().ravel()   # columna j\nDx = Bx[1:-1, 1:-1]       # nodos interiores\nDx0 = col(Bx, 0)          # contorno x = 0\nDxN = col(Bx, nx + 1)     # contorno x = 1 (nula: no se usa)\n# Derivada segunda: centrada\nBxx = sp.diags([1, -2, 1], [-1, 0, 1], shape=(nx + 2, nx + 2),\n               format=\"csr\") / dx**2\nDxx = Bxx[1:-1, 1:-1]\nDxx0 = col(Bxx, 0)\nDxxN = col(Bxx, nx + 1)\n# Todo lo que necesita rhs, en un diccionario (en MATLAB: variables globales)\nM = dict(nu=nu, u0=u0, uN=uN, Dx=Dx, Dx0=Dx0, DxN=DxN,\n         Dxx=Dxx, Dxx0=Dxx0, DxxN=DxxN)\n\nan = coeficientes_burgers(x, nu)\nfig = Animacion(x, (0, 1), (0, 1), f\"Burgers, ν = {nu}\")\ntiempos = np.zeros(Nt)\nut_num = np.zeros((Nt, 20))\nut_exact = np.zeros((Nt, 20))\npuntos = slice(0, 100, 5)            # u_numerica(1:5:100) de MATLAB\nt = 0\nfor i in range(Nt):\n    # Paso de tiempo convectivo\n    dtc = CFL * dx / np.max(u)\n    # Paso de tiempo viscoso\n    dtv = CFL * dx**2 / nu\n    dt = min(dtc, dtv)\n    # Runge-Kutta 4\n    k1 = rhs(u, M)\n    k2 = rhs(u + 1 / 2 * k1 * dt, M)\n    k3 = rhs(u + 1 / 2 * k2 * dt, M)\n    k4 = rhs(u + k3 * dt, M)\n    u = u + 1 / 6 * dt * (k1 + 2 * k2 + 2 * k3 + k4)\n    t = t + dt\n    u_numerica = np.concatenate(([u0], u, [uN]))\n    u_exacta = solucion_burgers(x, nu, t, an)\n    tiempos[i] = t\n    ut_num[i] = u_numerica[puntos]\n    ut_exact[i] = u_exacta[puntos]\n    if (i + 1) % CADA == 0 or i == Nt - 1:\n        fig.actualiza(u_numerica, u_exacta, t)\n\nprint(f\"t final = {t:.3f}, error máximo = {np.max(np.abs(u_numerica - u_exacta)):.2e}\")\nplt.ioff()\nfig2, ax2 = plt.subplots(figsize=(8, 5))\nax2.plot(tiempos, ut_num, \"b\", lw=1.5)\nax2.plot(tiempos, ut_exact, \"r--\", lw=1.5)\nax2.plot([], [], \"b\", label=\"Numérica\")\nax2.plot([], [], \"r--\", label=\"Exacta\")\nax2.set_xlabel(\"t\")\nax2.set_ylabel(\"u\")\nax2.set_title(\"u(t) en 20 puntos de la malla\")\nax2.legend()\nprint(\"Fin\")\nplt.show()\n", "EC_BURGERS_0.py": "\"\"\"\nEC_BURGERS_0.py  (traducción de EC_BURGERS_0.m)\n-----------------------------------------\nEcuación de Burgers con C.C. Dirichlet\n\n    u_t + 1/2 (u^2)_x = nu u_xx\n    u(0,t) = u0\n    u(1,t) = uN\n\nDiscretización temporal:  Runge-Kutta de 4 pasos\nDiscretización espacial:  diferencias finitas atrasadas para d/dx\n                          diferencias finitas centradas para d2/dx2\n\nA. Lozano Durán, 2014 (versión original en MATLAB)\n-----------------------------------------\nIgual que EC_BURGERS.py con nu = 0.02, CFL = 0.5 y Nt = 200. El original no tenía\nla figura 2; se ha añadido igual que en EC_BURGERS.py. En EC_BURGERS.m la figura 2 dibujaba plot(t, ...) con t escalar (el\ntiempo final) y escala vertical hasta 1e11. Aquí se guarda el tiempo de cada paso y\nse representa u(t) en 20 puntos, numérica y exacta.\n\"\"\"\nimport numpy as np\nimport scipy.sparse as sp\nimport matplotlib.pyplot as plt\nfrom rhs import rhs\nfrom solucion_burgers import coeficientes_burgers, solucion_burgers\nfrom animacion import Animacion\n\nprint(\"Ecuación de Burgers viscosa\")\n# Parámetros:\nnu = 0.02      # viscosidad\nCFL = 0.5      # CFL\nLx = 1         # longitud del dominio\nnx = 100       # número de puntos interiores\nNt = 200       # número de pasos temporales\nCADA = 1       # se dibuja la solución cada CADA pasos\ndx = Lx / (nx + 1)\nx = dx * np.arange(nx + 2)\nprint(f\"nu: {nu}\\nLx: {Lx}\\nnx: {nx}\\nCFL: {CFL}\")\n\n# Condición inicial:\nui = 4 * x * (1 - x)\nu = ui[1:nx + 1].copy()\n# Condiciones de contorno:\nu0 = ui[0]          # en x = 0\nuN = ui[nx + 1]     # en x = 1\n\n# Matrices de diferenciación sobre los nx+2 puntos\n# Derivada primera: upwind (hacia atrás)\nBx = sp.diags([-1, 1], [-1, 0], shape=(nx + 2, nx + 2),\n              format=\"csr\") / dx\ncol = lambda B, j: B[1:-1, j].toarray().ravel()   # columna j\nDx = Bx[1:-1, 1:-1]       # nodos interiores\nDx0 = col(Bx, 0)          # contorno x = 0\nDxN = col(Bx, nx + 1)     # contorno x = 1 (nula: no se usa)\n# Derivada segunda: centrada\nBxx = sp.diags([1, -2, 1], [-1, 0, 1], shape=(nx + 2, nx + 2),\n               format=\"csr\") / dx**2\nDxx = Bxx[1:-1, 1:-1]\nDxx0 = col(Bxx, 0)\nDxxN = col(Bxx, nx + 1)\n# Todo lo que necesita rhs, en un diccionario (en MATLAB: variables globales)\nM = dict(nu=nu, u0=u0, uN=uN, Dx=Dx, Dx0=Dx0, DxN=DxN,\n         Dxx=Dxx, Dxx0=Dxx0, DxxN=DxxN)\n\nan = coeficientes_burgers(x, nu)\nfig = Animacion(x, (0, 1), (0, 1), f\"Burgers, ν = {nu}\")\ntiempos = np.zeros(Nt)\nut_num = np.zeros((Nt, 20))\nut_exact = np.zeros((Nt, 20))\npuntos = slice(0, 100, 5)            # u_numerica(1:5:100) de MATLAB\nt = 0\nfor i in range(Nt):\n    # Paso de tiempo convectivo\n    dtc = CFL * dx / np.max(u)\n    # Paso de tiempo viscoso\n    dtv = CFL * dx**2 / nu\n    dt = min(dtc, dtv)\n    # Runge-Kutta 4\n    k1 = rhs(u, M)\n    k2 = rhs(u + 1 / 2 * k1 * dt, M)\n    k3 = rhs(u + 1 / 2 * k2 * dt, M)\n    k4 = rhs(u + k3 * dt, M)\n    u = u + 1 / 6 * dt * (k1 + 2 * k2 + 2 * k3 + k4)\n    t = t + dt\n    u_numerica = np.concatenate(([u0], u, [uN]))\n    u_exacta = solucion_burgers(x, nu, t, an)\n    tiempos[i] = t\n    ut_num[i] = u_numerica[puntos]\n    ut_exact[i] = u_exacta[puntos]\n    if (i + 1) % CADA == 0 or i == Nt - 1:\n        fig.actualiza(u_numerica, u_exacta, t)\n\nprint(f\"t final = {t:.3f}, error máximo = {np.max(np.abs(u_numerica - u_exacta)):.2e}\")\nplt.ioff()\nfig2, ax2 = plt.subplots(figsize=(8, 5))\nax2.plot(tiempos, ut_num, \"b\", lw=1.5)\nax2.plot(tiempos, ut_exact, \"r--\", lw=1.5)\nax2.plot([], [], \"b\", label=\"Numérica\")\nax2.plot([], [], \"r--\", label=\"Exacta\")\nax2.set_xlabel(\"t\")\nax2.set_ylabel(\"u\")\nax2.set_title(\"u(t) en 20 puntos de la malla\")\nax2.legend()\nprint(\"Fin\")\nplt.show()\n", "EC_CALOR.py": "\"\"\"\nEC_CALOR.py  (traducción de EC_CALOR.m)\n-----------------------------------------\nEcuación del calor con C.C. Dirichlet\n\n    u_t = nu u_xx\n    u(0,t) = u0\n    u(1,t) = uN\n\nDiscretización temporal:  Euler implícito\nDiscretización espacial:  diferencias finitas centradas\n\nA. Lozano Durán, 2014 (versión original en MATLAB)\n-----------------------------------------\n\"\"\"\nimport numpy as np\nimport scipy.sparse as sp\nfrom scipy.sparse.linalg import splu\nfrom solucion_calor import coeficientes_calor, solucion_calor\nfrom animacion import Animacion\n\nprint(\"Ecuación del calor\")\n# Parámetros:\nnu = 1         # viscosidad (difusividad)\nCFL = 2        # número de difusión d = nu dt / dx^2 (Euler implícito es estable con cualquier d)\nLx = 1         # longitud del dominio\nnx = 100       # número de puntos interiores\nNt = 1200      # número de pasos temporales\nCADA = 5       # se dibuja la solución cada CADA pasos (1 = en todos, como en MATLAB)\ndx = Lx / (nx + 1)\nx = dx * np.arange(nx + 2)\nprint(f\"nu: {nu}\\nLx: {Lx}\\nnx: {nx}\\nCFL: {CFL}\")\n\n# Condición inicial:\nui = np.sin(4 * np.pi * x)\nu = ui[1:nx + 1].copy()\n# Condiciones de contorno:\nu0 = ui[0]          # en x = 0\nuN = ui[nx + 1]     # en x = 1\n\n# Matriz de la derivada segunda centrada sobre los nx+2 puntos\nBxx = sp.diags([1, -2, 1], [-1, 0, 1], shape=(nx + 2, nx + 2), format=\"csr\") / dx**2\nDxx = Bxx[1:-1, 1:-1]\nDxx0 = Bxx[1:-1, 0].toarray().ravel()\nDxxN = Bxx[1:-1, nx + 1].toarray().ravel()\n# Paso de tiempo\ndt = CFL * dx**2 / nu\n# Euler implícito: (I - dt nu Dxx) u^{n+1} = u^n + dt nu (Dxx0 u0 + DxxN uN)\n# La matriz no cambia, así que se factoriza una sola vez.\nA = splu((sp.identity(nx, format=\"csc\") - dt * nu * Dxx).tocsc())\n# (En el original se sumaba dt*nu*uc con uc = [u0 0 ... 0 uN], sin el 1/dx^2;\n#  no tenía efecto porque u0 = uN = 0.)\nbc = dt * nu * (Dxx0 * u0 + DxxN * uN)\n\na = coeficientes_calor(x, ui)\nfig = Animacion(x, (0, 1), (-1, 1), f\"Calor, ν = {nu}\")\nt = 0\nfor i in range(1, Nt + 1):\n    u = A.solve(u + bc)\n    t = t + dt\n    if i % CADA == 0 or i == Nt:\n        u_numerica = np.concatenate(([u0], u, [uN]))\n        fig.actualiza(u_numerica, solucion_calor(x, nu, t, a), t)\nprint(\"Fin\")\nAnimacion.fin()\n", "EC_CALOR_0.py": "\"\"\"\nEC_CALOR_0.py  (traducción de EC_CALOR_0.m)\n-----------------------------------------\nEcuación del calor con C.C. Dirichlet\n\n    u_t = nu u_xx\n    u(0,t) = u0\n    u(1,t) = uN\n\nDiscretización temporal:  Euler implícito\nDiscretización espacial:  diferencias finitas centradas\n\nA. Lozano Durán, 2014 (versión original en MATLAB)\n-----------------------------------------\n\"\"\"\nimport numpy as np\nimport scipy.sparse as sp\nfrom scipy.sparse.linalg import splu\nfrom solucion_calor import coeficientes_calor, solucion_calor\nfrom animacion import Animacion\n\nprint(\"Ecuación del calor\")\n# Parámetros:\nnu = 0.1       # viscosidad (difusividad)\nCFL = 2        # número de difusión d = nu dt / dx^2 (Euler implícito es estable con cualquier d)\nLx = 1         # longitud del dominio\nnx = 100       # número de puntos interiores\nNt = 1200      # número de pasos temporales\nCADA = 5       # se dibuja la solución cada CADA pasos (1 = en todos, como en MATLAB)\ndx = Lx / (nx + 1)\nx = dx * np.arange(nx + 2)\nprint(f\"nu: {nu}\\nLx: {Lx}\\nnx: {nx}\\nCFL: {CFL}\")\n\n# Condición inicial:\nui = np.sin(4 * np.pi * x)\nu = ui[1:nx + 1].copy()\n# Condiciones de contorno:\nu0 = ui[0]          # en x = 0\nuN = ui[nx + 1]     # en x = 1\n\n# Matriz de la derivada segunda centrada sobre los nx+2 puntos\nBxx = sp.diags([1, -2, 1], [-1, 0, 1], shape=(nx + 2, nx + 2), format=\"csr\") / dx**2\nDxx = Bxx[1:-1, 1:-1]\nDxx0 = Bxx[1:-1, 0].toarray().ravel()\nDxxN = Bxx[1:-1, nx + 1].toarray().ravel()\n# Paso de tiempo\ndt = CFL * dx**2 / nu\n# Euler implícito: (I - dt nu Dxx) u^{n+1} = u^n + dt nu (Dxx0 u0 + DxxN uN)\n# La matriz no cambia, así que se factoriza una sola vez.\nA = splu((sp.identity(nx, format=\"csc\") - dt * nu * Dxx).tocsc())\n# (En el original se sumaba dt*nu*uc con uc = [u0 0 ... 0 uN], sin el 1/dx^2;\n#  no tenía efecto porque u0 = uN = 0.)\nbc = dt * nu * (Dxx0 * u0 + DxxN * uN)\n\na = coeficientes_calor(x, ui)\nfig = Animacion(x, (0, 1), (-1, 1), f\"Calor, ν = {nu}\")\nt = 0\nfor i in range(1, Nt + 1):\n    u = A.solve(u + bc)\n    t = t + dt\n    if i % CADA == 0 or i == Nt:\n        u_numerica = np.concatenate(([u0], u, [uN]))\n        fig.actualiza(u_numerica, solucion_calor(x, nu, t, a), t)\nprint(\"Fin\")\nAnimacion.fin()\n", "EC_ONDA_0.py": "\"\"\"\nEC_ONDA_0.py  (traducción de EC_ONDA_0.m)\n-----------------------------------------\nEcuación de onda (convección lineal) con C.C. Dirichlet, c > 0\n\n    u_t + c u_x = 0\n    u(0,t) = u0\n\nDiscretización temporal:  Euler explícito\nDiscretización espacial:  diferencias finitas atrasadas (upwind para c > 0)\n\nA. Lozano Durán, 2014 (versión original en MATLAB)\n-----------------------------------------\n\"\"\"\nimport numpy as np\nimport scipy.sparse as sp\nfrom animacion import Animacion\n\nprint(\"Ecuación de onda\")\n# Parámetros:\nc = 1          # velocidad de convección\nCFL = 0.5      # número de Courant c dt / dx\nLx = 1         # longitud del dominio\nnx = 100       # número de puntos (sin contar x = 0)\nN
