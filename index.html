t = 300       # número de pasos temporales (t final = 1.5: la onda sale del dominio)\nCADA = 1       # se dibuja la solución cada CADA pasos\ndx = Lx / nx\nx = dx * np.arange(nx + 1)\nprint(f\"c: {c}\\nLx: {Lx}\\nnx: {nx}\\nCFL: {CFL}\")\n\n# Condición inicial:\nui = np.sin(4 * np.pi * x)\nu = ui[1:nx + 1].copy()\n# Condición de contorno en x = 0\nu0 = ui[0]\n\n# Derivada primera hacia atrás: (u_i - u_{i-1}) / dx\nBx = sp.diags([-1, 1], [-1, 0], shape=(nx + 2, nx + 2), format=\"csr\") / dx\nDx = Bx[1:-1, 1:-1]\nDx0 = Bx[1:-1, 0].toarray().ravel()\n# Paso de tiempo convectivo\ndt = CFL * dx / c\n\nfig = Animacion(x, (0, 1), (-10, 10), f\"Onda, c = {c}, CFL = {CFL}\")\nt = 0\nfor i in range(1, Nt + 1):\n    # Euler explícito\n    # (En el original: - dt*c*uc con uc = [u0 0 ... 0], sin el 1/dx; no tenía efecto porque u0 = 0.)\n    u = u - dt * c * (Dx @ u) - dt * c * Dx0 * u0\n    t = t + dt\n    if i % CADA == 0 or i == Nt:\n        u_numerica = np.concatenate(([u0], u))\n        u_exacta = np.sin(4 * np.pi * (x - c * t))\n        u_exacta[x < c * t] = 0          # lo que ha entrado por x = 0 vale u0 = 0\n        fig.actualiza(u_numerica, u_exacta, t)\nprint(\"Fin\")\nAnimacion.fin()\n", "EC_ONDA_CNEG.py": "\"\"\"\nEC_ONDA_CNEG.py  (traducción de EC_ONDA_CNEG.m)\n-----------------------------------------\nEcuación de onda (convección lineal) con C.C. Dirichlet, c < 0\n\n    u_t + c u_x = 0\n    u(1,t) = uN          (con c < 0 la información entra por la derecha)\n\nDiscretización temporal:  Euler explícito\nDiscretización espacial:  diferencias finitas adelantadas (upwind para c < 0)\n\nA. Lozano Durán, 2014 (versión original en MATLAB)\n-----------------------------------------\n\"\"\"\nimport numpy as np\nimport scipy.sparse as sp\nfrom animacion import Animacion\n\nprint(\"Ecuación de onda\")\n# Parámetros:\nc = -1         # velocidad de convección\nCFL = 0.5      # número de Courant |c| dt / dx\nLx = 1.0       # longitud del dominio\nnx = 100       # número de puntos (sin contar x = 1)\nNt = 100       # número de pasos temporales\nCADA = 1       # se dibuja la solución cada CADA pasos\ndx = Lx / nx\nx = dx * np.arange(nx + 1)\nprint(f\"c: {c}\\nLx: {Lx}\\nnx: {nx}\\nCFL: {CFL}\")\n\n# Condición inicial:\nui = np.sin(4 * np.pi * x)\nu = ui[0:nx].copy()       # incógnitas en x_0 ... x_{nx-1}\n# Condición de contorno en x = 1\nuN = ui[nx]\n\n# Derivada primera hacia delante: (u_{i+1} - u_i) / dx\nBx = sp.diags([-1, 1], [0, 1], shape=(nx + 1, nx + 1), format=\"csr\") / dx\nDx = Bx[:-1, :-1]\nDxN = Bx[:-1, nx].toarray().ravel()      # término del contorno x = 1 (última fila)\n# Paso de tiempo convectivo\ndt = CFL * dx / abs(c)\n\nfig = Animacion(x, (0, 1), (-10, 10), f\"Onda, c = {c}, CFL = {CFL}\")\nt = 0\nfor i in range(1, Nt + 1):\n    # Euler explícito\n    # (En el original el término de contorno se ponía en la primera fila y valía 0;\n    #  no tenía efecto porque uN = sin(4 pi) = 0.)\n    u = u - dt * c * (Dx @ u) - dt * c * DxN * uN\n    t = t + dt\n    if i % CADA == 0 or i == Nt:\n        u_numerica = np.concatenate((u, [uN]))\n        u_exacta = np.sin(4 * np.pi * (x - c * t))\n        u_exacta[x > Lx + c * t] = 0     # lo que ha entrado por x = 1 vale uN = 0\n        fig.actualiza(u_numerica, u_exacta, t)\nprint(\"Fin\")\nAnimacion.fin()\n", "EC_ONDA_CPOS.py": "\"\"\"\nEC_ONDA_CPOS.py  (traducción de EC_ONDA_CPOS.m)\n-----------------------------------------\nEcuación de onda (convección lineal) con C.C. Dirichlet, c > 0\n\n    u_t + c u_x = 0\n    u(0,t) = u0\n\nDiscretización temporal:  Euler explícito\nDiscretización espacial:  diferencias finitas atrasadas (upwind para c > 0)\n\nA. Lozano Durán, 2014 (versión original en MATLAB)\n-----------------------------------------\n\"\"\"\nimport numpy as np\nimport scipy.sparse as sp\nfrom animacion import Animacion\n\nprint(\"Ecuación de onda\")\n# Parámetros:\nc = 1          # velocidad de convección\nCFL = 0.5      # número de Courant c dt / dx\nLx = 1         # longitud del dominio\nnx = 100       # número de puntos (sin contar x = 0)\nNt = 100       # número de pasos temporales\nCADA = 1       # se dibuja la solución cada CADA pasos\ndx = Lx / nx\nx = dx * np.arange(nx + 1)\nprint(f\"c: {c}\\nLx: {Lx}\\nnx: {nx}\\nCFL: {CFL}\")\n\n# Condición inicial:\nui = np.sin(4 * np.pi * x)\nu = ui[1:nx + 1].copy()\n# Condición de contorno en x = 0\nu0 = ui[0]\n\n# Derivada primera hacia atrás: (u_i - u_{i-1}) / dx\nBx = sp.diags([-1, 1], [-1, 0], shape=(nx + 2, nx + 2), format=\"csr\") / dx\nDx = Bx[1:-1, 1:-1]\nDx0 = Bx[1:-1, 0].toarray().ravel()\n# Paso de tiempo convectivo\ndt = CFL * dx / c\n\nfig = Animacion(x, (0, 1), (-10, 10), f\"Onda, c = {c}, CFL = {CFL}\")\nt = 0\nfor i in range(1, Nt + 1):\n    # Euler explícito\n    # (En el original: - dt*c*uc con uc = [u0 0 ... 0], sin el 1/dx; no tenía efecto porque u0 = 0.)\n    u = u - dt * c * (Dx @ u) - dt * c * Dx0 * u0\n    t = t + dt\n    if i % CADA == 0 or i == Nt:\n        u_numerica = np.concatenate(([u0], u))\n        u_exacta = np.sin(4 * np.pi * (x - c * t))\n        u_exacta[x < c * t] = 0          # lo que ha entrado por x = 0 vale u0 = 0\n        fig.actualiza(u_numerica, u_exacta, t)\nprint(\"Fin\")\nAnimacion.fin()\n", "EC_ONDA_NOLIN.py": "\"\"\"\nEC_ONDA_NOLIN.py  (traducción de EC_ONDA_NOLIN.m)\n-----------------------------------------\nEcuación de onda no lineal (Burgers no viscosa) con C.C. Dirichlet\n\n    u_t + u u_x = 0\n    u(0,t) = u0\n\nDiscretización temporal:  Euler explícito\nDiscretización espacial:  diferencias finitas atrasadas\n\nA. Lozano Durán, 2014 (versión original en MATLAB)\n-----------------------------------------\nCambios respecto al original (que no llegaba a ejecutarse):\n - u*Dx*u (producto de matrices de dimensiones incompatibles) -> u * (Dx @ u),\n   es decir, u_i (u_i - u_{i-1})/dx.\n - La solución \"exacta\" del original era la de la ecuación lineal. Aquí se usa la de\n   la ecuación no lineal por características, u = sin(4 pi (x - u t)), que solo existe\n   hasta que se forma el choque, en t_r = 1/(4 pi) = 0.080.\n - La solución numérica se dibuja en sus puntos x_1 ... x_nx (antes estaba desplazada).\nObsérvese que donde u < 0 las diferencias atrasadas NO son upwind: el esquema es\ninestable ahí, y por eso la solución crece hasta salirse de la escala.\n\"\"\"\nimport numpy as np\nimport scipy.sparse as sp\nfrom animacion import Animacion\n\nprint(\"Ecuación de onda no lineal\")\n# Parámetros:\nc = 1.         # velocidad de referencia para elegir el paso de tiempo\nCFL = 0.5\nLx = 1.0       # longitud del dominio\nnx = 100       # número de puntos (sin contar x = 0)\nNt = 100       # número de pasos temporales\nCADA = 1       # se dibuja la solución cada CADA pasos\ndx = Lx / nx\nx = dx * np.arange(nx + 1)\nprint(f\"Lx: {Lx}\\nnx: {nx}\\nCFL: {CFL}\")\n\n# Condición inicial:\nui = np.sin(4 * np.pi * x)\nu = ui[1:nx + 1].copy()\n# Condición de contorno en x = 0\nu0 = ui[0]\n\n# Derivada primera hacia atrás\nBx = sp.diags([-1, 1], [-1, 0], shape=(nx + 2, nx + 2), format=\"csr\") / dx\nDx = Bx[1:-1, 1:-1]\nDx0 = Bx[1:-1, 0].toarray().ravel()\n# Paso de tiempo convectivo\ndt = CFL * dx / c\nt_rotura = 1 / (4 * np.pi)          # 1 / max(-du0/dx)\n\n\ndef exacta(x, t):\n    \"\"\"u = sin(4 pi xi) con xi el pie de la característica: xi + t sin(4 pi xi) = x\"\"\"\n    if t >= t_rotura:\n        return np.full_like(x, np.nan)\n    xi = x.copy()\n    for _ in range(50):                               # Newton\n        F = xi + t * np.sin(4 * np.pi * xi) - x\n        xi = np.clip(xi - F / (1 + 4 * np.pi * t * np.cos(4 * np.pi * xi)), 0, 1)\n    return np.sin(4 * np.pi * xi)\n\n\nfig = Animacion(x, (0, 1), (-10, 10), \"Onda no lineal\")\nt = 0\nfor i in range(1, Nt + 1):\n    # Euler explícito\n    u = u - dt * u * (Dx @ u + Dx0 * u0)\n    t = t + dt\n    if i % CADA == 0 or i == Nt:\n        u_numerica = np.concatenate(([u0], u))\n        fig.actualiza(u_numerica, exacta(x, t), t)\n        if t >= t_rotura:\n            fig.ax.set_title(f\"Onda no lineal   t = {t:.4g}  (choque desde t = {t_rotura:.3f})\")\nprint(f\"max |u| al final: {np.max(np.abs(u)):.3g}\")\nprint(\"Fin\")\nAnimacion.fin()\n", "Fw.py": "\"\"\"\nFw.py  (traducción de Fw.m)\n\nEvalúa el lado derecho de Navier-Stokes 2D en forma vorticidad-función de corriente,\nen el espacio de Fourier:\n    d(omega_hat)/dt = 1/Re Lap omega_hat - FFT(u omega_x + v omega_y)\n\nEn MATLAB las matrices se pasaban como variables globales; aquí se pasan en el\ndiccionario G creado por vortices_2D.py. Fw guarda en G[\"u\"] y G[\"v\"] las velocidades\ncalculadas, que el programa principal usa para el paso de tiempo (igual que las\nglobales u y v del original).\n\"\"\"\nimport numpy as np\n\n\ndef Fw(omega_hat, G):\n    kx, ky = G[\"kx\"], G[\"ky\"]\n    # dealiasing\n    omega_hat = G[\"dealias\"] * omega_hat\n    # función de corriente\n    psi_hat = -omega_hat / G[\"poisson\"]\n    # velocidades\n    u_hat = 1j * ky * psi_hat\n    v_hat = -1j * kx * psi_hat\n    # términos convectivos\n    u = np.real(np.fft.ifft2(u_hat))\n    v = np.real(np.fft.ifft2(v_hat))\n    omega_x = np.real(np.fft.ifft2(1j * kx * omega_hat))\n    omega_y = np.real(np.fft.ifft2(1j * ky * omega_hat))\n    conv_hat = np.fft.fft2(u * omega_x + v * omega_y)\n    G[\"u\"], G[\"v\"] = u, v\n    # resultado\n    return 1 / G[\"Re\"] * G[\"Lap\"] * omega_hat - conv_hat\n", "animacion.py": "\"\"\"\nanimacion.py: figura que se actualiza durante el cálculo (equivale a plot + drawnow\ndentro del bucle de los programas de MATLAB). No hay equivalente en la carpeta de MATLAB.\n\"\"\"\nimport numpy as np\nimport matplotlib.pyplot as plt\n\n\nclass Animacion:\n    def __init__(self, x, xlim, ylim, titulo, xlabel=\"x\", ylabel=\"u\"):\n        plt.ion()\n        self.fig, self.ax = plt.subplots(figsize=(8, 5))\n        self.num, = self.ax.plot(x, np.full_like(x, np.nan), \"b\", lw=2, label=\"Numérica\")\n        self.exa, = self.ax.plot(x, np.full_like(x, np.nan), \"r--\", lw=2, label=\"Exacta\")\n        self.ax.set_xlim(*xlim)\n        self.ax.set_ylim(*ylim)\n        self.ax.set_xlabel(xlabel)\n        self.ax.set_ylabel(ylabel)\n        self.ax.legend(loc=\"upper right\")\n        self.titulo = titulo\n\n    def actualiza(self, u_num, u_exacta, t):\n        self.num.set_ydata(u_num)\n        self.exa.set_ydata(u_exacta)\n        self.ax.set_title(f\"{self.titulo}   t = {t:.4g}\")\n        plt.pause(0.001)\n\n    @staticmethod\n    def fin():\n        plt.ioff()\n        plt.show()\n", "cavidad.py": "\"\"\"\ncavidad.py  (traducción de cavidad.m)\n-------------------------------------------------\nProblema de la cavidad\n\nResuelve las ecuaciones de Navier-Stokes en 2D\n\nDiscretización temporal:\n    Euler explícito para los términos convectivos\n    Euler implícito para los términos viscosos\n    Paso fraccionado (proyección) para la incompresibilidad\n\nDiscretización espacial:\n    diferencias finitas\n    malla desplazada (staggered)\n\nAdrián, 2014 (versión original en MATLAB, basada en mit18086_navierstokes.m de B. Seibold)\n-------------------------------------------------\nLos arrays tienen la misma forma que en MATLAB: el primer índice es x y el segundo y.\nLos reshape usan order=\"F\" (por columnas, como MATLAB).\n\nCambio respecto al original: en Ubc y Vbc los términos de las paredes norte/sur iban\ndivididos por dx^2 y los de las paredes este/oeste por dy^2; es al revés. Con nx = ny\nno importa, pero con nx = 120 y ny = 100 la tapa arrastraba el fluido un 44 % más de\nlo debido.\n\"\"\"\nimport numpy as np\nimport scipy.sparse as sp\nfrom scipy.sparse.linalg import splu\nimport matplotlib.pyplot as plt\nfrom coef import coef\nfrom interpolar import interpolar\n\nprint(\"Problema de la cavidad 2D\")\n# Parámetros:\nnu = 0.01       # viscosidad\nCFL = 0.5       # condición CFL\nLx = 1          # tamaño de la caja en x\nLy = 1          # tamaño de la caja en y\nnx = 120        # número de celdas en x\nny = 100        # número de celdas en y\nnsteps = 1000   # número de pasos temporales\nCADA = 1000     # se dibuja la solución cada CADA pasos\nRe = 1 / nu\nprint(f\"nu: {nu}\\nCFL: {CFL}\\nLx: {Lx}\\nLy: {Ly}\\nnx: {nx}\\nny: {ny}\\nnsteps: {nsteps}\")\n\n# Malla:\nx = np.linspace(0, Lx, nx + 1)\ny = np.linspace(0, Ly, ny + 1)\ndx = Lx / nx\ndy = Ly / ny\n# Condiciones iniciales:\nu = np.zeros((nx - 1, ny))\nv = np.zeros((nx, ny - 1))\n# Condiciones de contorno en las paredes:\nuN = x * 0 + 1;            vN = interpolar(x) * 0     # norte (tapa que se mueve con u = 1)\nuS = x * 0;                vS = interpolar(x) * 0     # sur\nuE = interpolar(y) * 0;    vE = y * 0                 # este\nuO = interpolar(y) * 0;    vO = y * 0                 # oeste\n\n# Términos procedentes de las condiciones de contorno en el Poisson de u y v (término viscoso)\nUbc = (np.column_stack([2 * uS[1:-1], np.zeros((nx - 1, ny - 2)), 2 * uN[1:-1]]) / dy**2\n       + np.vstack([uO, np.zeros((nx - 3, ny)), uE]) / dx**2)\nVbc = (np.column_stack([vS, np.zeros((nx, ny - 3)), vN]) / dy**2\n       + np.vstack([2 * vO[1:-1], np.zeros((nx - 2, ny - 1)), 2 * vE[1:-1]]) / dx**2)\n\n# Matrices de las ecuaciones de Poisson (Dxx + Dyy)\n# Presión\nLp = (sp.kron(sp.identity(ny), coef(nx, dx, 1)) + sp.kron(coef(ny, dy, 1), sp.identity(nx))).tolil()\nLp[0, 0] = 3 / 2 * Lp[0, 0]       # elimina la singularidad (p definida salvo una constante); 3/2 es arbitrario\n# Velocidad u\nIu = sp.identity((nx - 1) * ny)\nLu = sp.kron(sp.identity(ny), coef(nx - 1, dx, 2)) + sp.kron(coef(ny, dy, 3), sp.identity(nx - 1))\n# Velocidad v\nIv = sp.identity(nx * (ny - 1))\nLv = sp.kron(sp.identity(ny - 1), coef(nx, dx, 3)) + sp.kron(coef(ny - 1, dy, 2), sp.identity(nx))\n\n# La matriz de la presión no cambia: se factoriza una sola vez (en MATLAB se resolvía con \\ en cada paso)\nLp_lu = splu(Lp.tocsc())\nfact_u = fact_v = None\ndt_fact = None\n\naplana = lambda A: A.reshape(-1, order=\"F\")\ndif_y = lambda A: np.diff(A, axis=1)           # diff(A')' de MATLAB\n\n# Bucle temporal\ndt = 1e-5\nt = 0\nfor i in range(1, nsteps + 1):\n    # Términos convectivos explícitos\n    ue = np.vstack([uO, u, uE])\n    ve = np.column_stack([vS, v, vN])\n    ue = np.column_stack([2 * uS - ue[:, 0], ue, 2 * uN - ue[:, -1]])\n    ve = np.vstack([2 * vO - ve[0, :], ve, 2 * vE - ve[-1, :]])\n    ua = interpolar(ue.T).T\n    va = interpolar(ve)\n    uvx = np.diff(ua * va, axis=0) / dx\n    uvy = dif_y(ua * va) / dy\n    ua = interpolar(ue[:, 1:-1])\n    va = interpolar(ve[1:-1, :].T).T\n    u2x = np.diff(ua**2, axis=0) / dx\n    v2y = dif_y(va**2) / dy\n    u = u - dt * (uvy[1:-1, :] + u2x)\n    v = v - dt * (uvx[:, 1:-1] + v2y)\n\n    # Términos viscosos implícitos: (I - dt/Re (Dxx + Dyy)) u = rhs\n    # dt cambia en cada paso, así que hay que factorizar de nuevo (solo si cambia)\n    if dt != dt_fact:\n        fact_u = splu((Iu - dt / Re * Lu).tocsc())\n        fact_v = splu((Iv - dt / Re * Lv).tocsc())\n        dt_fact = dt\n    u = fact_u.solve(aplana(u + dt / Re * Ubc)).reshape(nx - 1, ny, order=\"F\")\n    v = fact_v.solve(aplana(v + dt / Re * Vbc)).reshape(nx, ny - 1, order=\"F\")\n\n    # Proyección de la velocidad: (Dxx + Dyy) p = u_x + v_y\n    du = np.diff(np.vstack([uO, u, uE]), axis=0) / dx\n    dv = dif_y(np.column_stack([vS, v, vN])) / dy\n    p = Lp_lu.solve(aplana(du + dv)).reshape(nx, ny, order=\"F\")\n    u = u - np.diff(p, axis=0) / dx\n    v = v - dif_y(p) / dy\n    t = t + dt\n\n    # Paso de tiempo convectivo\n    ue = np.vstack([uO, u, uE])\n    ve = np.column_stack([vS, v, vN])\n    with np.errstate(divide=\"ignore\"):\n        dtx = CFL * np.min(dx / np.abs(ue))\n        dty = CFL * np.min(dy / np.abs(ve))\n    dt = min(dtx, dty)\n\n    # Pintar la solución\n    if i % CADA == 0:\n        print(i, f\"t = {t:.3f}\")\n        ue = np.column_stack([uS, interpolar(np.vstack([uO, u, uE]).T).T, uN])   # u en los nodos\n        ve = np.vstack([vO, interpolar(np.column_stack([vS, v, vN])), vE])         # v en los nodos\n        plt.figure(figsize=(7, 6))\n        s = 4                                                     # una flecha de cada 4\n        plt.quiver(x[::s], y[::s], ue[::s, ::s].T, ve[::s, ::s].T, color=\"k\")\n        plt.streamplot(x, y, ue.T, ve.T, density=1.5, color=\"0.6\", linewidth=0.6)\n        plt.xlabel(\"x\"); plt.ylabel(\"y\")\n        plt.title(f\"Cavidad, Re = {Re:.0f}, t = {t:.2f}\")\n        plt.axis(\"scaled\"); plt.axis([0, Lx, 0, Ly])\n        plt.pause(0.001)\nprint(\"Fin\")\nplt.show()\n", "cavidad_0.py": "\"\"\"\ncavidad_0.py  (traducción de cavidad_0.m)\n-------------------------------------------------\nProblema de la cavidad\n\nResuelve las ecuaciones de Navier-Stokes en 2D\n\nDiscretización temporal:\n    Euler explícito para los términos convectivos\n    Euler implícito para los términos viscosos\n    Paso fraccionado (proyección) para la incompresibilidad\n\nDiscretización espacial:\n    diferencias finitas\n    malla desplazada (staggered)\n\nAdrián, 2014 (versión original en MATLAB, basada en mit18086_navierstokes.m de B. Seibold)\n-------------------------------------------------\nLos arrays tienen la misma forma que en MATLAB: el primer índice es x y el segundo y.\nLos reshape usan order=\"F\" (por columnas, como MATLAB).\n\nCambio respecto al original: en Ubc y Vbc los términos de las paredes norte/sur iban\ndivididos por dx^2 y los de las paredes este/oeste por dy^2; es al revés. Con nx = ny\nno importa, pero con nx = 60 y ny = 50 la tapa arrastraba el fluido un 44 % más de\nlo debido.\n\"\"\"\nimport numpy as np\nimport scipy.sparse as sp\nfrom scipy.sparse.linalg import splu\nimport matplotlib.pyplot as plt\nfrom coef import coef\nfrom interpolar import interpolar\n\nprint(\"Problema de la cavidad 2D\")\n# Parámetros:\nnu = 0.01       # viscosidad\nCFL = 0.5       # condición CFL\nLx = 1          # tamaño de la caja en x\nLy = 1          # tamaño de la caja en y\nnx = 60         # número de celdas en x\nny = 50         # número de celdas en y\nnsteps = 1000   # número de pasos temporales\nCADA = 1000     # se dibuja la solución cada CADA pasos\nRe = 1 / nu\nprint(f\"nu: {nu}\\nCFL: {CFL}\\nLx: {Lx}\\nLy: {Ly}\\nnx: {nx}\\nny: {ny}\\nnsteps: {nsteps}\")\n\n# Malla:\nx = np.linspace(0, Lx, nx + 1)\ny = np.linspace(0, Ly, ny + 1)\ndx = Lx / nx\ndy = Ly / ny\n# Condiciones iniciales:\nu = np.zeros((nx - 1, ny))\nv = np.zeros((nx, ny - 1))\n# Condiciones de contorno en las paredes:\nuN = x * 0 + 1;            vN = interpolar(x) * 0     # norte (tapa que se mueve con u = 1)\nuS = x * 0;                vS = interpolar(x) * 0     # sur\nuE = interpolar(y) * 0;    vE = y * 0                 # este\nuO = interpolar(y) * 0;    vO = y * 0                 # oeste\n\n# Términos procedentes de las condiciones de contorno en el Poisson de u y v (término viscoso)\nUbc = (np.column_stack([2 * uS[1:-1], np.zeros((nx - 1, ny - 2)), 2 * uN[1:-1]]) / dy**2\n       + np.vstack([uO, np.zeros((nx - 3, ny)), uE]) / dx**2)\nVbc = (np.column_stack([vS, np.zeros((nx, ny - 3)), vN]) / dy**2\n       + np.vstack([2 * vO[1:-1], np.zeros((nx - 2, ny - 1)), 2 * vE[1:-1]]) / dx**2)\n\n# Matrices de las ecuaciones de Poisson (Dxx + Dyy)\n# Presión\nLp = (sp.kron(sp.identity(ny), coef(nx, dx, 1)) + sp.kron(coef(ny, dy, 1), sp.identity(nx))).tolil()\nLp[0, 0] = 3 / 2 * Lp[0, 0]       # elimina la singularidad (p definida salvo una constante); 3/2 es arbitrario\n# Velocidad u\nIu = sp.identity((nx - 1) * ny)\nLu = sp.kron(sp.identity(ny), coef(nx - 1, dx, 2)) + sp.kron(coef(ny, dy, 3), sp.identity(nx - 1))\n# Velocidad v\nIv = sp.identity(nx * (ny - 1))\nLv = sp.kron(sp.identity(ny - 1), coef(nx, dx, 3)) + sp.kron(coef(ny - 1, dy, 2), sp.identity(nx))\n\n# La matriz de la presión no cambia: se factoriza una sola vez (en MATLAB se resolvía con \\ en cada paso)\nLp_lu = splu(Lp.tocsc())\nfact_u = fact_v = None\ndt_fact = None\n\naplana = lambda A: A.reshape(-1, order=\"F\")\ndif_y = lambda A: np.diff(A, axis=1)           # diff(A')' de MATLAB\n\n# Bucle temporal\ndt = 1e-5\nt = 0\nfor i in range(1, nsteps + 1):\n    # Términos convectivos explícitos\n    ue = np.vstack([uO, u, uE])\n    ve = np.column_stack([vS, v, vN])\n    ue = np.column_stack([2 * uS - ue[:, 0], ue, 2 * uN - ue[:, -1]])\n    ve = np.vstack([2 * vO - ve[0, :], ve, 2 * vE - ve[-1, :]])\n    ua = interpolar(ue.T).T\n    va = interpolar(ve)\n    uvx = np.diff(ua * va, axis=0) / dx\n    uvy = dif_y(ua * va) / dy\n    ua = interpolar(ue[:, 1:-1])\n    va = interpolar(ve[1:-1, :].T).T\n    u2x = np.diff(ua**2, axis=0) / dx\n    v2y = dif_y(va**2) / dy\n    u = u - dt * (uvy[1:-1, :] + u2x)\n    v = v - dt * (uvx[:, 1:-1] + v2y)\n\n    # Términos viscosos implícitos: (I - dt/Re (Dxx + Dyy)) u = rhs\n    # dt cambia en cada paso, así que hay que factorizar de nuevo (solo si cambia)\n    if dt != dt_fact:\n        fact_u = splu((Iu - dt / Re * Lu).tocsc())\n        fact_v = splu((Iv - dt / Re * Lv).tocsc())\n        dt_fact = dt\n    u = fact_u.solve(aplana(u + dt / Re * Ubc)).reshape(nx - 1, ny, order=\"F\")\n    v = fact_v.solve(aplana(v + dt / Re * Vbc)).reshape(nx, ny - 1, order=\"F\")\n\n    # Proyección de la velocidad: (Dxx + Dyy) p = u_x + v_y\n    du = np.diff(np.vstack([uO, u, uE]), axis=0) / dx\n    dv = dif_y(np.column_stack([vS, v, vN])) / dy\n    p = Lp_lu.solve(aplana(du + dv)).reshape(nx, ny, order=\"F\")\n    u = u - np.diff(p, axis=0) / dx\n    v = v - dif_y(p) / dy\n    t = t + dt\n\n    # Paso de tiempo convectivo\n    ue = np.vstack([uO, u, uE])\n    ve = np.column_stack([vS, v, vN])\n    with np.errstate(divide=\"ignore\"):\n        dtx = CFL * np.min(dx / np.abs(ue))\n        dty = CFL * np.min(dy / np.abs(ve))\n    dt = min(dtx, dty)\n\n    # Pintar la solución\n    if i % CADA == 0:\n        print(i, f\"t = {t:.3f}\")\n        ue = np.column_stack([uS, interpolar(np.vstack([uO, u, uE]).T).T, uN])   # u en los nodos\n        ve = np.vstack([vO, interpolar(np.column_stack([vS, v, vN])), vE])         # v en los nodos\n        plt.figure(figsize=(7, 6))\n        s = 4                                                     # una flecha de cada 4\n        plt.quiver(x[::s], y[::s], ue[::s, ::s].T, ve[::s, ::s].T, color=\"k\")\n        plt.streamplot(x, y, ue.T, ve.T, density=1.5, color=\"0.6\", linewidth=0.6)\n        plt.xlabel(\"x\"); plt.ylabel(\"y\")\n        plt.title(f\"Cavidad, Re = {Re:.0f}, t = {t:.2f}\")\n        plt.axis(\"scaled\"); plt.axis([0, Lx, 0, Ly])\n        plt.pause(0.001)\nprint(\"Fin\")\nplt.show()\n", "coef.py": "\"\"\"\ncoef.py  (traducción de coef.m)\n\nA = coef(n, h, a11)\n\nMatriz dispersa n x n de la derivada segunda centrada (1, -2, 1)/h^2.\nEl elemento de las esquinas depende de la condición de contorno:\n    a11 = 1  Neumann (presión)\n    a11 = 2  Dirichlet con el valor de contorno sobre un nodo de la malla\n    a11 = 3  Dirichlet con el contorno a mitad de camino entre dos nodos (celda fantasma)\n\"\"\"\nimport numpy as np\nimport scipy.sparse as sp\n\n\ndef coef(n, h, a11):\n    diag = -2.0 * np.ones(n)\n    diag[0] = diag[-1] = -a11\n    lado = np.ones(n - 1)\n    return sp.diags([lado, diag, lado], [-1, 0, 1], format=\"csc\") / h**2\n\n\nif __name__ == \"__main__\":\n    print(coef(5, 1.0, 1).toarray())\n", "dydt.py": "\"\"\"\ndydt.py  (traducción de dydt.m)\n\nSistema de primer orden equivalente a la ecuación de tercer orden\n    y''' = y y'' - 1\ncon y1 = y, y2 = y', y3 = y''. Se usa con un integrador de EDO, por ejemplo:\n\n    from scipy.integrate import solve_ivp\n    sol = solve_ivp(dydt, (0, 5), [0, 0, 1.2], max_step=0.01)\n\"\"\"\n\n\ndef dydt(t, y):\n    return [y[1],\n            y[2],\n            y[0] * y[2] - 1]\n", "interpolar.py": "\"\"\"\ninterpolar.py  (traducción de interpolar.m)\n\nB = interpolar(A)\n\nMedia de cada par de valores consecutivos a lo largo de las filas (eje 0):\nB[i] = (A[i] + A[i+1]) / 2. Si A es un vector, devuelve un vector con un elemento menos.\nPara interpolar a lo largo de las columnas se usa interpolar(A.T).T, como en MATLAB.\n\n(La opción k >= 2 de interpolar.m llamaba a una función avg que no está en la carpeta\ny no se usa en ningún script; no se ha traducido.)\n\"\"\"\nimport numpy as np\n\n\ndef interpolar(A):\n    A = np.asarray(A, dtype=float)\n    return (A[1:] + A[:-1]) / 2\n", "radd.py": "\"\"\"\nradd.py  (traducción de radd.m)\n\nc = radd(a, b, n)\n\nSuma dos números reales a y b simulando una unidad aritmética con n cifras\nsignificativas y redondeo (no truncamiento). Si a y b no tienen n cifras, se\nredondean antes de sumarlos.\n\nIgual que en radd.m, los dos números se alinean al exponente del MAYOR de ellos\nantes de redondear: el sumando pequeño pierde las cifras que no caben (como en\nuna unidad aritmética real).\n\"\"\"\nimport math\n\n\ndef _round(x):\n    \"\"\"round de MATLAB: al entero más próximo, los empates se alejan del cero\n    (el round de Python redondea los empates al par).\"\"\"\n    return math.copysign(math.floor(abs(x) + 0.5), x)\n\n\ndef _sign(x):\n    return (x > 0) - (x < 0)\n\n\ndef radd(a, b, n):\n    # --- signos\n    sa = _sign(a)\n    sb = _sign(b)\n\n    # --- exponente del número mayor\n    # Se usa ceil porque 0.1 <= mantisa < 1. El factor (1 + 10^-(n+1)) corrige el\n    # caso de un logaritmo exacto (mantisa 0.1).\n    la = -200 if sa == 0 else math.ceil(math.log10(sa * a * (1 + 10 ** (-(n + 1)))))\n    lb = -200 if sb == 0 else math.ceil(math.log10(sb * b * (1 + 10 ** (-(n + 1)))))\n    lm = max(la, lb)\n\n    # --- se desplaza la coma para obtener dos enteros de n cifras\n    f = 10 ** n\n    at = sa * _round(f * sa * a / 10.0 ** lm)\n    bt = sb * _round(f * sb * b / 10.0 ** lm)\n\n    # Si el redondeo ha añadido una cifra (p. ej. 99.9 -> 100), se recalcula\n    ireset = False\n    if at != 0 and math.log10(abs(at)) >= n:\n        la += 1\n        ireset = True\n    if bt != 0 and math.log10(abs(bt)) >= n:\n        lb += 1\n        ireset = True\n    if ireset:\n        lm = max(la, lb)\n        at = sa * _round(f * sa * a / 10.0 ** lm)\n        bt = sb * _round(f * sb * b / 10.0 ** lm)\n\n    ct = at + bt                     # suma de los dos enteros\n    sc = _sign(ct)\n\n    # Si la suma añade una cifra (con n = 3, 999 + 3 = 1002), se elimina la última\n    if sc != 0 and math.log10(sc * ct) >= n:\n        ct = _round(ct / 10) * 10\n\n    # --- se devuelve el número a su magnitud real\n    return ct * 10.0 ** lm / f\n\n\nif __name__ == \"__main__\":\n    for a, b, n in [(99.9, 4.9, 1), (99.9, 4.9, 2), (99.9, 4.9, 3), (0.095, -0.03, 1)]:\n        print(f\"radd({a}, {b}, {n}) = {radd(a, b, n):g}\")\n", "recur.py": "\"\"\"\nrecur.py  (sustituye a recur.m, que no estaba en la carpeta de MATLAB)\n\nSuma de la serie del ejercicio 5 de DFC 1:\n\n    y(x) = sum_{n=1}^{N} [ x^n + b sin(pi/2 - pi/(10 n)) - c cos(pi/(10 (n+1))) ]\n\ncon x = 0.5, b = c = 1 y N = 20 términos, de tres formas:\n  - en doble precisión (la de Python),\n  - con 2 cifras significativas (radd), sumando de n = 1 a N (cada una de las tres\n    partes de cada término se acumula por separado, con 2 cifras),\n  - con 2 cifras significativas (radd), sumando de n = N a 1.\n\nCon b = c la parte trigonométrica es telescópica, así que la suma exacta se conoce:\n    y = x (1 - x^N)/(1 - x) + b [cos(pi/10) - cos(pi/(10 (N+1)))]\n\"\"\"\nimport math\nfrom radd import radd\n\nx, b, c = 0.5, 1.0, 1.0\nN = 20\nCIFRAS = 2\n\n\ndef partes(n):\n    return (x**n, b * math.sin(math.pi / 2 - math.pi / (10 * n)), -c * math.cos(math.pi / (10 * (n + 1))))\n\n\ndef termino(n):\n    return sum(partes(n))\n\n\nexacta = x * (1 - x**N) / (1 - x) + b * (math.cos(math.pi / 10) - math.cos(math.pi / (10 * (N + 1))))\ndoble = sum(termino(n) for n in range(1, N + 1))\n\ns_asc = 0.0\nfor n in range(1, N + 1):          # n = 1 -> N\n    for p in partes(n):            # cada suma, con 2 cifras\n        s_asc = radd(s_asc, p, CIFRAS)\ns_desc = 0.0\nfor n in range(N, 0, -1):          # n = N -> 1\n    for p in partes(n):\n        s_desc = radd(s_desc, p, CIFRAS)\n\nprint(f\"x = {x}, b = {b}, c = {c}, N = {N}\")\nprint(f\"exacta (fórmula)            : {exacta:.6f}\")\nprint(f\"doble precisión             : {doble:.6f}\")\nprint(f\"{CIFRAS} cifras, n = 1 -> N       : {s_asc:.4g}   error = {100 * (s_asc - exacta) / exacta:+.1f} %\")\nprint(f\"{CIFRAS} cifras, n = N -> 1       : {s_desc:.4g}   error = {100 * (s_desc - exacta) / exacta:+.1f} %\")\n\n", "recurs_back.py": "\"\"\"\nrecurs_back.py  (traducción de recurs_back.m)\n\nRecurrencia hacia atrás para I_n = int_0^1 x^n/(x+5) dx:\n    I_{n-1} = 1/(5n) - I_n/5\npartiendo de una estimación grosera de I_9 y con 3 cifras significativas (radd).\nEl error se divide por -5 en cada paso: el algoritmo es estable.\n\n(Añadido respecto al original: la columna con el valor exacto, para comparar.)\n\"\"\"\nfrom scipy.integrate import quad\nfrom radd import radd\n\nj0 = 0.1 / 6\nj = 9\nprint(f\"I_9 (estimación inicial) = {j0:.6f}\")\nwhile j > 0:\n    # j0 = 1./(5*j) - j0/5       # en doble precisión\n    j0 = radd(1. / (5 * j), -j0 / 5, 3)\n    exacto = quad(lambda x: x**(j - 1) / (x + 5), 0, 1)[0]\n    print(f\"j = {j}   I_{j-1} = {j0:10.6g}   exacto = {exacto:.6f}\")\n    j = j - 1\n", "recurs_forw.py": "\"\"\"\nrecurs_forw.py  (traducción de recurs_forw.m)\n\nRecurrencia hacia delante para I_n = int_0^1 x^n/(x+5) dx:\n    I_n = 1/n - 5 I_{n-1},   I_0 = ln(6) - ln(5)\ncalculada con 3 cifras significativas (radd). El error se multiplica por -5 en\ncada paso: el algoritmo es inestable.\n\n(Añadido respecto al original: la columna con el valor exacto, para comparar.)\n\"\"\"\nimport math\nfrom scipy.integrate import quad\nfrom radd import radd\n\ni = 1\ni0 = math.log(6) - math.log(5)\nprint(f\"i0 = {i0:.6f}\")\nwhile i < 10:\n    i0 = radd(1. / i, -5 * i0, 3)\n    # i0 = 1./i - 5*i0          # en doble precisión\n    exacto = quad(lambda x: x**i / (x + 5), 0, 1)[0]\n    print(f\"i = {i}   I_{i} = {i0:12.6g}   exacto = {exacto:.6f}\")\n    i = i + 1\n", "rhs.py": "\"\"\"\nrhs.py  (traducción de rhs.m)\n\nLado derecho de la ecuación de Burgers viscosa discretizada:\n    F(u) = -(u^2/2)_x + nu u_xx\nincluyendo los términos de las condiciones de contorno u(0) = u0 y u(L) = uN.\n\nEn MATLAB las matrices se pasaban como variables globales; aquí se pasan en un\ndiccionario M creado por EC_BURGERS.py.\n\"\"\"\n\n\ndef rhs(u, M):\n    nu, u0, uN = M[\"nu\"], M[\"u0\"], M[\"uN\"]\n    return (-M[\"Dx\"] @ (u**2 / 2) + nu * M[\"Dxx\"] @ u\n            - M[\"Dx0\"] * u0**2 / 2 + nu * M[\"Dxx0\"] * u0      # x = 0\n            - M[\"DxN\"] * uN**2 / 2 + nu * M[\"DxxN\"] * uN)     # x = L\n", "solucion_burgers.py": "\"\"\"\nsolucion_burgers.py  (traducción de solucion_burgers.m)\n\nSolución \"exacta\" de la ecuación de Burgers viscosa\n    u_t + u u_x = nu u_xx,   u(0,t) = u(1,t) = 0,   u(x,0) = 4x(1-x)\nmediante la transformación de Cole-Hopf, como serie de cosenos:\n    u = 2 pi nu  sum a_n e^{-n^2 pi^2 nu t} n sin(n pi x) / (a_0 + sum a_n e^{-n^2 pi^2 nu t} cos(n pi x))\n\nEn MATLAB era un script que leía las variables del programa principal; aquí son dos\nfunciones: coeficientes_burgers (se llama una vez) y solucion_burgers.\n\"\"\"\nimport numpy as np\n\n\ndef _trapz(y, x):\n    return np.trapezoid(y, x) if hasattr(np, \"trapezoid\") else np.trapz(y, x)\n\n\ndef coeficientes_burgers(x, nu, nm=100):\n    \"\"\"a_0 ... a_{nm-1}: coeficientes de Fourier de exp(-x^2 (3 - 2x) / (3 nu))\"\"\"\n    g = np.exp(-x**2 / (3 * nu) * (3 - 2 * x))\n    an = np.empty(nm)\n    an[0] = _trapz(g, x)\n    for jj in range(1, nm):\n        an[jj] = 2 * _trapz(g * np.cos(jj * np.pi * x), x)\n    return an\n\n\ndef solucion_burgers(x, nu, t, an):\n    I1 = np.zeros_like(x)\n    I2 = np.zeros_like(x)\n    for jj in range(1, len(an)):\n        e = an[jj] * np.exp(-jj**2 * np.pi**2 * nu * t)\n        I1 += e * jj * np.sin(jj * np.pi * x)\n        I2 += e * np.cos(jj * np.pi * x)\n    I2 += an[0]\n    return 2 * np.pi * nu * I1 / I2\n", "solucion_calor.py": "\"\"\"\nsolucion_calor.py  (traducción de solucion_calor.m)\n\nSolución analítica de la ecuación del calor u_t = nu u_xx en [0, 1] con\nu(0,t) = u(1,t) = 0, como serie de senos:\n    u(x,t) = sum_j a_j sin(j pi x) exp(-nu pi^2 j^2 t),   a_j = 2 int_0^1 u(x,0) sin(j pi x) dx\n\nEn MATLAB era un script que leía las variables del programa principal; aquí son dos\nfunciones: coeficientes_calor (se llama una vez) y solucion_calor.\n\"\"\"\nimport numpy as np\n\n\ndef _trapz(y, x):\n    return np.trapezoid(y, x) if hasattr(np, \"trapezoid\") else np.trapz(y, x)\n\n\ndef coeficientes_calor(x, ui, nm=20):\n    return np.array([2 * _trapz(ui * np.sin(np.pi * j * x), x) for j in range(1, nm + 1)])\n\n\ndef solucion_calor(x, nu, t, a):\n    u = np.zeros_like(x)\n    for j, aj in enumerate(a, start=1):\n        u += aj * np.sin(np.pi * j * x) * np.exp(-nu * np.pi**2 * j**2 * t)\n    return u\n", "vortices_2D.py": "\"\"\"\nvortices_2D.py  (traducción de vortices_2D.m)\n-------------------------------------------------\nResuelve las ecuaciones de N-S incompresible\nen vorticidad-función de corriente\n\n    D omega_z/Dt = 1/Re nabla^2 omega_z\n    omega_z = - nabla^2 psi\n    u = d psi/dy,  v = - d psi/dx\n\nDiscretización espacial: Fourier (pseudoespectral, regla de los 2/3)\nDiscretización temporal: Runge-Kutta de 4º orden y bajo almacenamiento\n    (esquema de Williamson, \"Fourth-Order 2N-Storage Runge-Kutta Schemes\",\n     Carpenter y Kennedy)\n\n()_hat = coeficiente de Fourier\n\nAdrián, 22-mar-2011 (versión original en MATLAB)\n-------------------------------------------------\nVórtices modelados con distribución gaussiana\n\n    omega = vii exp(-rii r^2)\n\nLongitud característica:  1/(2 rii)^1/2\nVelocidad característica: vii/(2 rii)^1/2\n-------------------------------------------------\nNota: con nx = ny = 512 y T = 10000 el cálculo no termina en un tiempo razonable\n(como en el original): se para con Ctrl+C o cerrando la ventana. Para una prueba\nrápida, usar nx = ny = 128.\n\"\"\"\nimport time\nimport numpy as np\nimport matplotlib.pyplot as plt\nfrom Fw import Fw\n\nprint(\"!------------------------------!\")\nprint(\" Vórtices 2D \")\nprint(\"!------------------------------!\")\n# Dominio\nnu = 3.0e-6            # viscosidad\nT = 10000              # tiempo total\nCFL = 0.2              # CFL\nLx = 2 * np.pi         # longitud x\nLy = 2 * np.pi         # longitud y\nvii = 2                # intensidad de los vórtices\nrii = 30               # radio de los vórtices\nRe = vii / (2 * rii) / nu      # Reynolds basado en los vórtices\n# Turbulencia 2D: eta = cte/Re^1/2\nnx = 512               # modos en x\nny = 512               # modos en y\nCADA = 10              # se dibuja la vorticidad cada CADA pasos\n# Escribir parámetros\nprint(f\"Número de Reynolds: {Re:g}\\nLx: {Lx:g}\\nLy: {Ly:g}\\nCFL: {CFL}\")\nprint(f\"número de modos en x: {nx}\\nnúmero de modos en y: {ny}\\nTiempo total: {T}\")\n\n# Malla\ndx = Lx / nx\ndy = Ly / ny\nx, y = np.meshgrid(np.arange(nx) * dx, np.arange(ny) * dy)\n\n# Coeficientes del Runge-Kutta: 4º orden, 5 etapas, 2 registros\nA = [0,\n     -1,\n     -1 / 3 + 2**(2 / 3) / 6 - 2 * 2**(1 / 3) / 3,\n     -2**(1 / 3) - 2**(2 / 3) - 2,\n     -1 + 2**(1 / 3)]\nB = [2 / 3 + 2**(1 / 3) / 3 + 2**(2 / 3) / 6,\n     -2**(2 / 3) / 6 + 1 / 6,\n     -1 / 3 - 2 * 2**(1 / 3) / 3 - 2**(2 / 3) / 3,\n     1 / 3 - 2**(1 / 3) / 3 - 2**(2 / 3) / 6,\n     1 / 3 + 2**(1 / 3) / 6 + 2**(2 / 3) / 12]\n# CFL viscoso\ndtv = min(CFL * dx**2 * Re, CFL * dy**2 * Re)\n\n# Fourier\nkxo = np.r_[0:nx // 2 + 1, -nx // 2 + 1:0]\nkyo = np.r_[0:ny // 2 + 1, -ny // 2 + 1:0]\nkx, ky = np.meshgrid(kxo, kyo)\nkx = kx * 2 * np.pi / Lx\nky = ky * 2 * np.pi / Ly\nLap = -(kx**2 + ky**2)\npoisson = Lap.copy()\npoisson[0, 0] = 1      # punto singular: el modo 0 de psi no está definido\n# regla de los 2/3 para el dealiasing\ndealias = ((np.abs(kx * Lx / (2 * np.pi)) < 1 / 3 * (nx / 2))\n           & (np.abs(ky * Ly / (2 * np.pi)) < 1 / 3 * (ny / 2)))\nG = dict(kx=kx, ky=ky, Lap=Lap, poisson=poisson, dealias=dealias, Re=Re)\n\nprint(\"Comienza el cálculo\")\nprint(\"---------\")\n# Condición inicial: 7 x 7 vórtices de signo alterno, menos el (3, 3)\nomega = np.zeros_like(x)\nnvx = 8\nnvy = 8\nfor i in range(1, nvx):\n    for j in range(1, nvy):\n        if i == 3 and j == 3:\n            continue\n        omega += (-1)**(i + j) * vii * np.exp(-rii * ((x - i * Lx / nvx)**2 + (y - j * Ly / nvy)**2))\nomega_hat = np.fft.fft2(omega)\n# velocidades iniciales\npsi_hat = -omega_hat / poisson\nu = np.real(np.fft.ifft2(1j * ky * psi_hat))\nv = np.real(np.fft.ifft2(-1j * kx * psi_hat))\nG[\"u\"], G[\"v\"] = u, v\n\n# Bucle temporal\nplt.ion()\nfig, ax = plt.subplots(figsize=(7, 6))\nt = 0\nnpaso = 0\ndu = np.zeros_like(omega_hat)\ntic = time.time()\nwhile t < T:\n    npaso += 1\n    # CFL convectivo en x y en y (con las velocidades del último cálculo de Fw)\n    dtx = CFL * dx / np.max(np.abs(G[\"u\"]))\n    dty = CFL * dy / np.max(np.abs(G[\"v\"]))\n    # se escoge el dt más restrictivo\n    dt = min(dtv, dtx, dty)\n    # Runge-Kutta\n    for j in range(5):\n        du = A[j] * du + dt * Fw(omega_hat, G)\n        omega_hat = omega_hat + B[j] * du\n    t = t + dt\n    # Pintar la solución cada CADA pasos\n    if npaso % CADA == 0:\n        print(f\"Tiempo de cálculo: {time.time() - tic:.2f} s\")\n        omega_hat = dealias * omega_hat\n        omega = np.real(np.fft.ifft2(omega_hat))\n        print(f\"tiempo simulado: T={t:.4g}\")\n        print(f\"dt: {dt:.4g}\")\n        ax.clear()\n        ax.pcolormesh(x, y, omega, shading=\"gouraud\", cmap=\"RdBu_r\")\n        ax.set_aspect(\"equal\")\n        ax.set_title(f\"Vorticidad, t = {t:.3g}\")\n        plt.pause(0.001)\n        if not plt.fignum_exists(fig.number):     # se ha cerrado la ventana\n            break\n        print(\"---------\")\n        tic = time.time()\nprint(\"Fin\")\n"}, "mis_programas": {}}, "statements": {"dfc1-1": "<p class='enun-num'>Ejercicio 1<\/p><p>Cuando se realizan cálculos numéricos es habitual estimar la cantidad de memoria RAM que se requerirá.<\/p>\n<ol type=\"a\">\n<li><p>Calcule la memoria RAM (en megabytes) necesaria para almacenar un array multidimensional de dimensiones 100 × 100 × 100 × 2000 (podría tratarse de un campo tridimensional de temperatura discretizado en el espacio para 2000 pasos de tiempo). El array está en doble precisión: cada valor ocupa 64 bits (8 bytes).<\/p><\/li>\n<li><p>Si su portátil tiene 16 GB de RAM (1 GB = 10<sup>9<\/sup> bytes), ¿cabría el array en su memoria RAM? ¿Y si son 16 GiB (1 GiB = 2<sup>30<\/sup> bytes)?<\/p><\/li>\n<li><p>¿Cuál sería el número máximo de puntos que podría tener su malla para esos 2000 pasos de tiempo?<\/p><\/li>\n<\/ol>\n<p>Si el array es más grande que la memoria RAM, el sistema operativo suele utilizar espacio de intercambio (<em>swap<\/em>), que está en el disco y tiene un tiempo de acceso mucho mayor que la memoria RAM.<\/p>", "dfc1-2": "<p class='enun-num'>Ejercicio 2<\/p><p>La representación de los números en la memoria del ordenador juega un papel muy importante en el resultado de los cálculos y conviene tenerlo presente. La función <code>radd<\/code> (fichero <code>radd.py<\/code>) suma dos números reales <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>a<\/mi><annotation encoding=\"application/x-tex\">a<\/annotation><\/semantics><\/math> y <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>b<\/mi><annotation encoding=\"application/x-tex\">b<\/annotation><\/semantics><\/math> simulando una unidad aritmética de <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>n<\/mi><annotation encoding=\"application/x-tex\">n<\/annotation><\/semantics><\/math> cifras significativas: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>c<\/mi><mo>=<\/mo><mrow><mi mathvariant=\"normal\">r<\/mi><mi mathvariant=\"normal\">a<\/mi><mi mathvariant=\"normal\">d<\/mi><mi mathvariant=\"normal\">d<\/mi><\/mrow><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>a<\/mi><mo>,<\/mo><mi>b<\/mi><mo>,<\/mo><mi>n<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/mrow><annotation encoding=\"application/x-tex\">c = \\mathrm{radd}(a, b, n)<\/annotation><\/semantics><\/math>. Los dos sumandos se redondean a <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>n<\/mi><annotation encoding=\"application/x-tex\">n<\/annotation><\/semantics><\/math> cifras (tras alinearlos con el exponente del mayor) y el resultado también.<\/p>\n<ol type=\"a\">\n<li><p>Sume 99.9 y 4.9 usando <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n<\/mi><mo>=<\/mo><mn>1<\/mn><mo>,<\/mo><mn>2<\/mn><mo>,<\/mo><mn>3<\/mn><mo>,<\/mo><mn>5<\/mn><\/mrow><annotation encoding=\"application/x-tex\">n = 1, 2, 3, 5<\/annotation><\/semantics><\/math>.<\/p><\/li>\n<li><p>Sume 0.095 y −0.03 usando <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n<\/mi><mo>=<\/mo><mn>1<\/mn><mo>,<\/mo><mn>2<\/mn><mo>,<\/mo><mn>3<\/mn><mo>,<\/mo><mn>5<\/mn><\/mrow><annotation encoding=\"application/x-tex\">n = 1, 2, 3, 5<\/annotation><\/semantics><\/math>.<\/p><\/li>\n<\/ol>", "dfc1-3": "<p class='enun-num'>Ejercicio 3<\/p><p>Use aproximaciones con diferencias finitas hacia adelante y hacia atrás de <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>O<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>h<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/mrow><annotation encoding=\"application/x-tex\">O(h)<\/annotation><\/semantics><\/math> y una aproximación de diferencias centradas de <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>O<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><msup><mi>h<\/mi><mn>2<\/mn><\/msup><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/mrow><annotation encoding=\"application/x-tex\">O(h^2)<\/annotation><\/semantics><\/math> para estimar la primera derivada de <math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>f<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>x<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>=<\/mo><mo>−<\/mo><mn>0.1<\/mn><msup><mi>x<\/mi><mn>4<\/mn><\/msup><mo>−<\/mo><mn>0.15<\/mn><msup><mi>x<\/mi><mn>3<\/mn><\/msup><mo>−<\/mo><mn>0.5<\/mn><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>−<\/mo><mn>0.25<\/mn><mi>x<\/mi><mo>+<\/mo><mn>1.25<\/mn><\/mrow><annotation encoding=\"application/x-tex\">f(x) = -0.1x^4 - 0.15x^3 - 0.5x^2 - 0.25x + 1.25<\/annotation><\/semantics><\/math> en <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x<\/mi><mo>=<\/mo><mn>0.5<\/mn><\/mrow><annotation encoding=\"application/x-tex\">x = 0.5<\/annotation><\/semantics><\/math>, utilizando<\/p>\n<ol type=\"a\">\n<li><p>un incremento <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>h<\/mi><mo>=<\/mo><mn>0.5<\/mn><\/mrow><annotation encoding=\"application/x-tex\">h = 0.5<\/annotation><\/semantics><\/math>;<\/p><\/li>\n<li><p>un incremento <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>h<\/mi><mo>=<\/mo><mn>0.25<\/mn><\/mrow><annotation encoding=\"application/x-tex\">h = 0.25<\/annotation><\/semantics><\/math>.<\/p><\/li>\n<\/ol>\n<p>La derivada se puede calcular directamente, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>f<\/mi><mi>′<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>x<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>=<\/mo><mo>−<\/mo><mn>0.4<\/mn><msup><mi>x<\/mi><mn>3<\/mn><\/msup><mo>−<\/mo><mn>0.45<\/mn><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>−<\/mo><mn>1.0<\/mn><mi>x<\/mi><mo>−<\/mo><mn>0.25<\/mn><\/mrow><annotation encoding=\"application/x-tex\">f&#39;(x) = -0.4x^3 - 0.45x^2 - 1.0x - 0.25<\/annotation><\/semantics><\/math>, y sirve para obtener el valor verdadero <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>f<\/mi><mi>′<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mn>0.5<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/mrow><annotation encoding=\"application/x-tex\">f&#39;(0.5)<\/annotation><\/semantics><\/math>.<\/p>\n<ol start=\"3\" type=\"a\">\n<li><p>Ahora utilice los valores <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>h<\/mi><mo>=<\/mo><msup><mn>10<\/mn><mi>i<\/mi><\/msup><\/mrow><annotation encoding=\"application/x-tex\">h = 10^{i}<\/annotation><\/semantics><\/math>, con <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>i<\/mi><mo>=<\/mo><mo>−<\/mo><mn>20<\/mn><mo>,<\/mo><mo>−<\/mo><mn>19.5<\/mn><mo>,<\/mo><mi>…<\/mi><mo>,<\/mo><mn>0<\/mn><\/mrow><annotation encoding=\"application/x-tex\">i = -20, -19.5, \\dots, 0<\/annotation><\/semantics><\/math> (en Python, <code>h = 10.0**np.arange(-20, 0.5, 0.5)<\/code>), en <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x<\/mi><mo>=<\/mo><mn>0.25<\/mn><\/mrow><annotation encoding=\"application/x-tex\">x = 0.25<\/annotation><\/semantics><\/math>. Escriba un programa en Python que calcule el error de cada aproximación de <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>f<\/mi><mi>′<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>x<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/mrow><annotation encoding=\"application/x-tex\">f&#39;(x)<\/annotation><\/semantics><\/math> para cada valor de <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>h<\/mi><annotation encoding=\"application/x-tex\">h<\/annotation><\/semantics><\/math> y represente los errores en función de <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>h<\/mi><annotation encoding=\"application/x-tex\">h<\/annotation><\/semantics><\/math> en una misma figura, con escalas logarítmicas (<code>plt.loglog<\/code>).<\/p><\/li>\n<li><p>¿Qué método es más exacto?<\/p><\/li>\n<li><p>Discuta los resultados en términos de <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>h<\/mi><annotation encoding=\"application/x-tex\">h<\/annotation><\/semantics><\/math>: ¿por qué el error deja de disminuir, y vuelve a crecer, cuando <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>h<\/mi><annotation encoding=\"application/x-tex\">h<\/annotation><\/semantics><\/math> es muy pequeño?<\/p><\/li>\n<\/ol>", "dfc1-4": "<p class='enun-num'>Ejercicio 4<\/p><p>La integral <math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>y<\/mi><mi>n<\/mi><\/msub><mo>=<\/mo><msubsup><mo>∫<\/mo><mn>0<\/mn><mn>1<\/mn><\/msubsup><mfrac><msup><mi>x<\/mi><mi>n<\/mi><\/msup><mrow><mi>x<\/mi><mo>+<\/mo><mn>5<\/mn><\/mrow><\/mfrac><mspace width=\"0.167em\"><\/mspace><mi>d<\/mi><mi>x<\/mi><mo>,<\/mo><mspace width=\"2.0em\"><\/mspace><mi>n<\/mi><mo>=<\/mo><mn>0<\/mn><mo>,<\/mo><mn>1<\/mn><mo>,<\/mo><mn>2<\/mn><mo>,<\/mo><mi>…<\/mi><\/mrow><annotation encoding=\"application/x-tex\">y_n = \\int_0^1 \\frac{x^n}{x+5}\\,dx, \\qquad n = 0, 1, 2, \\dots<\/annotation><\/semantics><\/math> se puede evaluar de manera recurrente de dos maneras: hacia delante, <math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>y<\/mi><mi>n<\/mi><\/msub><mo>=<\/mo><mfrac><mn>1<\/mn><mi>n<\/mi><\/mfrac><mo>−<\/mo><mn>5<\/mn><mspace width=\"0.167em\"><\/mspace><msub><mi>y<\/mi><mrow><mi>n<\/mi><mo>−<\/mo><mn>1<\/mn><\/mrow><\/msub><mo>,<\/mo><\/mrow><annotation encoding=\"application/x-tex\">y_n = \\frac{1}{n} - 5\\,y_{n-1},<\/annotation><\/semantics><\/math> y hacia atrás, <math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>y<\/mi><mrow><mi>n<\/mi><mo>−<\/mo><mn>1<\/mn><\/mrow><\/msub><mo>=<\/mo><mfrac><mn>1<\/mn><mrow><mn>5<\/mn><mi>n<\/mi><\/mrow><\/mfrac><mo>−<\/mo><mfrac><msub><mi>y<\/mi><mi>n<\/mi><\/msub><mn>5<\/mn><\/mfrac><mi>.<\/mi><\/mrow><annotation encoding=\"application/x-tex\">y_{n-1} = \\frac{1}{5n} - \\frac{y_n}{5}.<\/annotation><\/semantics><\/math> Los programas <code>recurs_forw.py<\/code> y <code>recurs_back.py<\/code> hacen estas cuentas con 3 cifras significativas (<code>radd<\/code>).<\/p>\n<ol type=\"a\">\n<li><p>Utilizando como valor inicial <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>y<\/mi><mn>0<\/mn><\/msub><mo>=<\/mo><mo>ln<\/mo><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mn>6<\/mn><mi>/<\/mi><mn>5<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>≈<\/mo><mn>0.182<\/mn><\/mrow><annotation encoding=\"application/x-tex\">y_0 = \\ln(6/5) \\approx 0.182<\/annotation><\/semantics><\/math>, calcule <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>y<\/mi><mn>9<\/mn><\/msub><annotation encoding=\"application/x-tex\">y_9<\/annotation><\/semantics><\/math> con la recurrencia hacia delante.<\/p><\/li>\n<li><p>Utilizando como valor inicial <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>y<\/mi><mn>9<\/mn><\/msub><mo>≈<\/mo><mn>0.017<\/mn><\/mrow><annotation encoding=\"application/x-tex\">y_9 \\approx 0.017<\/annotation><\/semantics><\/math>, calcule <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>y<\/mi><mn>0<\/mn><\/msub><annotation encoding=\"application/x-tex\">y_0<\/annotation><\/semantics><\/math> con la recurrencia hacia atrás.<\/p><\/li>\n<li><p>Compare ambos resultados con los valores exactos (los programas los muestran) y explique por qué un método es inestable y el otro no. <em>Pista:<\/em> ¿qué le pasa en cada paso a un error <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>ε<\/mi><annotation encoding=\"application/x-tex\">\\varepsilon<\/annotation><\/semantics><\/math> en <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>y<\/mi><mrow><mi>n<\/mi><mo>−<\/mo><mn>1<\/mn><\/mrow><\/msub><annotation encoding=\"application/x-tex\">y_{n-1}<\/annotation><\/semantics><\/math> (o en <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>y<\/mi><mi>n<\/mi><\/msub><annotation encoding=\"application/x-tex\">y_n<\/annotation><\/semantics><\/math>)?<\/p><\/li>\n<\/ol>", "dfc1-5": "<p class='enun-num'>Ejercicio 5<\/p><p>El programa <code>recur.py<\/code> calcula la suma <math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>y<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>x<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>=<\/mo><munderover><mo>∑<\/mo><mrow><mi>n<\/mi><mo>=<\/mo><mn>1<\/mn><\/mrow><mi>N<\/mi><\/munderover><mrow><mo stretchy=\"true\" form=\"prefix\">[<\/mo><msup><mi>x<\/mi><mi>n<\/mi><\/msup><mo>+<\/mo><mi>b<\/mi><mspace width=\"0.167em\"><\/mspace><mo>sin<\/mo><mspace width=\"-0.167em\"><\/mspace><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mfrac><mi>π<\/mi><mn>2<\/mn><\/mfrac><mo>−<\/mo><mfrac><mi>π<\/mi><mrow><mn>10<\/mn><mi>n<\/mi><\/mrow><\/mfrac><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>−<\/mo><mi>c<\/mi><mspace width=\"0.167em\"><\/mspace><mo>cos<\/mo><mspace width=\"-0.167em\"><\/mspace><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mfrac><mi>π<\/mi><mrow><mn>10<\/mn><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>n<\/mi><mo>+<\/mo><mn>1<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/mrow><\/mfrac><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo stretchy=\"true\" form=\"postfix\">]<\/mo><\/mrow><\/mrow><annotation encoding=\"application/x-tex\">y(x) = \\sum_{n=1}^{N}\\left[x^n + b\\,\\sin\\!\\left(\\frac{\\pi}{2} - \\frac{\\pi}{10n}\\right) - c\\,\\cos\\!\\left(\\frac{\\pi}{10(n+1)}\\right)\\right]<\/annotation><\/semantics><\/math> con <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x<\/mi><mo>=<\/mo><mn>0.5<\/mn><\/mrow><annotation encoding=\"application/x-tex\">x = 0.5<\/annotation><\/semantics><\/math>, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>b<\/mi><mo>=<\/mo><mi>c<\/mi><mo>=<\/mo><mn>1<\/mn><\/mrow><annotation encoding=\"application/x-tex\">b = c = 1<\/annotation><\/semantics><\/math> y <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>N<\/mi><mo>=<\/mo><mn>20<\/mn><\/mrow><annotation encoding=\"application/x-tex\">N = 20<\/annotation><\/semantics><\/math> términos.<\/p>\n<ol type=\"a\">\n<li><p>Compare el resultado en doble precisión con el que se obtiene con <code>radd<\/code> y 2 cifras significativas, sumando en orden creciente (<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n<\/mi><mo>=<\/mo><mn>1<\/mn><mo>→<\/mo><mi>N<\/mi><\/mrow><annotation encoding=\"application/x-tex\">n = 1 \\to N<\/annotation><\/semantics><\/math>) y decreciente (<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n<\/mi><mo>=<\/mo><mi>N<\/mi><mo>→<\/mo><mn>1<\/mn><\/mrow><annotation encoding=\"application/x-tex\">n = N \\to 1<\/annotation><\/semantics><\/math>).<\/p><\/li>\n<li><p>Con <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>b<\/mi><mo>=<\/mo><mi>c<\/mi><\/mrow><annotation encoding=\"application/x-tex\">b = c<\/annotation><\/semantics><\/math> la parte trigonométrica de la serie es telescópica. Obtenga la suma exacta y ús \/mrow><\/mrow><mrow><mo>sinh<\/mo><mspace width=\"-0.167em\"><\/mspace><mrow><mo stretchy=\"true\" form=\"prefix\">[<\/mo><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mn>2<\/mn><mi>n<\/mi><mo>−<\/mo><mn>1<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mfrac><mrow><mi>π<\/mi><mi>b<\/mi><\/mrow><mi>a<\/mi><\/mfrac><mo stretchy=\"true\" form=\"postfix\">]<\/mo><\/mrow><\/mrow><\/mfrac><\/mrow><annotation encoding=\"application/x-tex\">T(x,y) = \\frac{4T_1}{\\pi}\\sum_{n=1}^{\\infty}\\frac{\\sin\\!\\left[(2n-1)\\frac{\\pi x}{a}\\right]}{2n-1}\\,\\frac{\\sinh\\!\\left[(2n-1)\\frac{\\pi y}{a}\\right]}{\\sinh\\!\\left[(2n-1)\\frac{\\pi b}{a}\\right]}<\/annotation><\/semantics><\/math><\/p>\n<p>donde <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>T<\/mi><mn>1<\/mn><\/msub><mo>=<\/mo><mn>80<\/mn><\/mrow><annotation encoding=\"application/x-tex\">T_1 = 80<\/annotation><\/semantics><\/math> °C es la temperatura del lado superior de la placa (<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>y<\/mi><mo>=<\/mo><mi>b<\/mi><\/mrow><annotation encoding=\"application/x-tex\">y = b<\/annotation><\/semantics><\/math>).<\/p>\n<ol type=\"a\">\n<li><p>Dividiendo el lado <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>a<\/mi><annotation encoding=\"application/x-tex\">a<\/annotation><\/semantics><\/math> en 40 segmentos y el lado <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>b<\/mi><annotation encoding=\"application/x-tex\">b<\/annotation><\/semantics><\/math> en 30, determine y represente (por ejemplo, con <code>numpy.meshgrid<\/code> y <code>plot_surface<\/code> de matplotlib) la distribución de temperatura <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>T<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>x<\/mi><mo>,<\/mo><mi>y<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/mrow><annotation encoding=\"application/x-tex\">T(x, y)<\/annotation><\/semantics><\/math> en la placa, sumando los 20 primeros términos con dos cifras significativas (función <code>radd<\/code>) de dos maneras:<\/p>\n<ol type=\"i\">\n<li><p>haciendo la suma desde <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n<\/mi><mo>=<\/mo><mn>1<\/mn><\/mrow><annotation encoding=\"application/x-tex\">n = 1<\/annotation><\/semantics><\/math> hasta <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n<\/mi><mo>=<\/mo><mn>20<\/mn><\/mrow><annotation encoding=\"application/x-tex\">n = 20<\/annotation><\/semantics><\/math>;<\/p><\/li>\n<li><p>haciendo la suma en orden inverso, desde <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n<\/mi><mo>=<\/mo><mn>20<\/mn><\/mrow><annotation encoding=\"application/x-tex\">n = 20<\/annotation><\/semantics><\/math> hasta <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n<\/mi><mo>=<\/mo><mn>1<\/mn><\/mrow><annotation encoding=\"application/x-tex\">n = 1<\/annotation><\/semantics><\/math>.<\/p><\/li>\n<\/ol><\/li>\n<li><p>Represente las diferencias entre las temperaturas obtenidas con los dos procedimientos.<\/p><\/li>\n<li><p>¿Qué temperatura da la serie con 20 términos en el lado superior, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>y<\/mi><mo>=<\/mo><mi>b<\/mi><\/mrow><annotation encoding=\"application/x-tex\">y = b<\/annotation><\/semantics><\/math>? ¿Por qué no da 80 °C?<\/p><\/li>\n<\/ol>", "dfc2-1": "<p class='enun-num'>Ejercicio 1<\/p><p>Resuelva la ecuación hiperbólica (convección lineal) <math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mfrac><mrow><mi>∂<\/mi><mi>u<\/mi><\/mrow><mrow><mi>∂<\/mi><mi>t<\/mi><\/mrow><\/mfrac><mo>+<\/mo><mi>c<\/mi><mspace width=\"0.167em\"><\/mspace><mfrac><mrow><mi>∂<\/mi><mi>u<\/mi><\/mrow><mrow><mi>∂<\/mi><mi>x<\/mi><\/mrow><\/mfrac><mo>=<\/mo><mn>0<\/mn><\/mrow><annotation encoding=\"application/x-tex\">\\frac{\\partial u}{\\partial t} + c\\,\\frac{\\partial u}{\\partial x} = 0<\/annotation><\/semantics><\/math> para <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0<\/mn><mo>≤<\/mo><mi>x<\/mi><mo>≤<\/mo><mn>1<\/mn><\/mrow><annotation encoding=\"application/x-tex\">0 \\le x \\le 1<\/annotation><\/semantics><\/math>, con la condición inicial <math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>u<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>x<\/mi><mo>,<\/mo><mn>0<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>=<\/mo><mo>sin<\/mo><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mn>4<\/mn><mi>π<\/mi><mi>x<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/mrow><annotation encoding=\"application/x-tex\">u(x, 0) = \\sin(4\\pi x)<\/annotation><\/semantics><\/math> y la condición de contorno en el extremo por el que entra la información: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>u<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mn>0<\/mn><mo>,<\/mo><mi>t<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>=<\/mo><mn>0<\/mn><\/mrow><annotation encoding=\"application/x-tex\">u(0, t) = 0<\/annotation><\/semantics><\/math> si <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>c<\/mi><mo>&gt;<\/mo><mn>0<\/mn><\/mrow><annotation encoding=\"application/x-tex\">c &gt; 0<\/annotation><\/semantics><\/math>, o <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>u<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mn>1<\/mn><mo>,<\/mo><mi>t<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>=<\/mo><mn>0<\/mn><\/mrow><annotation encoding=\"application/x-tex\">u(1, t) = 0<\/annotation><\/semantics><\/math> si <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>c<\/mi><mo>&lt;<\/mo><mn>0<\/mn><\/mrow><annotation encoding=\"application/x-tex\">c &lt; 0<\/annotation><\/semantics><\/math>.<\/p>\n<p>Llamaremos <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>u<\/mi><mtext mathvariant=\"normal\">exacta<\/mtext><\/msub><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><msub><mi>x<\/mi><mi>i<\/mi><\/msub><mo>,<\/mo><msub><mi>t<\/mi><mi>n<\/mi><\/msub><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/mrow><annotation encoding=\"application/x-tex\">u_{\\text{exacta}}(x_i, t_n)<\/annotation><\/semantics><\/math> a la solución exacta (la condición inicial trasladada una distancia <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>c<\/mi><mi>t<\/mi><\/mrow><annotation encoding=\"application/x-tex\">ct<\/annotation><\/semantics><\/math>, y 0 en la parte que ha entrado por el contorno) y <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>u<\/mi><mtext mathvariant=\"normal\">numérica<\/mtext><\/msub><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><msub><mi>x<\/mi><mi>i<\/mi><\/msub><mo>,<\/mo><msub><mi>t<\/mi><mi>n<\/mi><\/msub><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/mrow><annotation encoding=\"application/x-tex\">u_{\\text{numérica}}(x_i, t_n)<\/annotation><\/semantics><\/math> a la solución numérica.<\/p>\n<p>Utilice una malla uniforme con <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>N<\/mi><mo>+<\/mo><mn>1<\/mn><\/mrow><annotation encoding=\"application/x-tex\">N + 1<\/annotation><\/semantics><\/math> puntos <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>x<\/mi><mi>i<\/mi><\/msub><annotation encoding=\"application/x-tex\">x_i<\/annotation><\/semantics><\/math>, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>i<\/mi><mo>=<\/mo><mn>0<\/mn><mo>,<\/mo><mi>…<\/mi><mo>,<\/mo><mi>N<\/mi><\/mrow><annotation encoding=\"application/x-tex\">i = 0, \\dots, N<\/annotation><\/semantics><\/math>, con <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>N<\/mi><mo>=<\/mo><mn>100<\/mn><\/mrow><annotation encoding=\"application/x-tex\">N = 100<\/annotation><\/semantics><\/math> y <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>Δ<\/mi><mi>x<\/mi><mo>=<\/mo><msub><mi>x<\/mi><mrow><mi>i<\/mi><mo>+<\/mo><mn>1<\/mn><\/mrow><\/msub><mo>−<\/mo><msub><mi>x<\/mi><mi>i<\/mi><\/msub><\/mrow><annotation encoding=\"application/x-tex\">\\Delta x = x_{i+1} - x_i<\/annotation><\/semantics><\/math>. Para la discretización temporal utilice el esquema de Euler explícito y para la espacial, diferencias finitas atrasadas. Integre hasta <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>t<\/mi><mo>=<\/mo><mn>0.5<\/mn><\/mrow><annotation encoding=\"application/x-tex\">t = 0.5<\/annotation><\/semantics><\/math>: con CFL <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>=<\/mo><mrow><mo stretchy=\"true\" form=\"prefix\">|<\/mo><mi>c<\/mi><mo stretchy=\"true\" form=\"postfix\">|<\/mo><\/mrow><mspace width=\"0.167em\"><\/mspace><mi>Δ<\/mi><mi>t<\/mi><mi>/<\/mi><mi>Δ<\/mi><mi>x<\/mi><mo>=<\/mo><mn>0.5<\/mn><\/mrow><annotation encoding=\"application/x-tex\">= |c|\\,\\Delta t/\\Delta x = 0.5<\/annotation><\/semantics><\/math> son 100 pasos de tiempo; si cambia el CFL, ajuste el número de pasos, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>N<\/mi><mi>t<\/mi><\/msub><mo>=<\/mo><mn>0.5<\/mn><mi>/<\/mi><mi>Δ<\/mi><mi>t<\/mi><\/mrow><annotation encoding=\"application/x-tex\">N_t = 0.5/\\Delta t<\/annotation><\/semantics><\/math>.<\/p>\n<p>Como punto de partida puede usar <code>EC_ONDA_CPOS.py<\/code> (<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>c<\/mi><mo>&gt;<\/mo><mn>0<\/mn><\/mrow><annotation encoding=\"application/x-tex\">c &gt; 0<\/annotation><\/semantics><\/math>, diferencias atrasadas) y <code>EC_ONDA_CNEG.py<\/code> (<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>c<\/mi><mo>&lt;<\/mo><mn>0<\/mn><\/mrow><annotation encoding=\"application/x-tex\">c &lt; 0<\/annotation><\/semantics><\/math>, diferencias adelantadas). Para cambiar de esquema basta con cambiar la matriz de diferenciación <code>Bx<\/code> y la columna del contorno.<\/p>\n<ol type=\"a\">\n<li><p>Con <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>c<\/mi><mo>=<\/mo><mn>1<\/mn><\/mrow><annotation encoding=\"application/x-tex\">c = 1<\/annotation><\/semantics><\/math> y diferencias atrasadas, explore distintos valores del CFL entre 0.1 y 1.5. ¿A partir de qué valor el esquema es inestable? ¿Qué ocurre exactamente con CFL <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>=<\/mo><mn>1<\/mn><\/mrow><annotation encoding=\"application/x-tex\">= 1<\/annotation><\/semantics><\/math>? ¿Por qué disminuye la amplitud de la onda cuando CFL <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>&lt;<\/mo><mn>1<\/mn><\/mrow><annotation encoding=\"application/x-tex\">&lt; 1<\/annotation><\/semantics><\/math>?<\/p><\/li>\n<li><p>Resuelva la ecuación con diferencias finitas adelantadas cuando <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>c<\/mi><mo>&gt;<\/mo><mn>0<\/mn><\/mrow><annotation encoding=\"application/x-tex\">c &gt; 0<\/annotation><\/semantics><\/math>.<\/p><\/li>\n<li><p>Resuelva la ecuación con diferencias centradas cuando <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>c<\/mi><mo>&gt;<\/mo><mn>0<\/mn><\/mrow><annotation encoding=\"application/x-tex\">c &gt; 0<\/annotation><\/semantics><\/math>.<\/p><\/li>\n<li><p>Resuelva la ecuación con diferencias finitas adelantadas cuando <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>c<\/mi><mo>&lt;<\/mo><mn>0<\/mn><\/mrow><annotation encoding=\"application/x-tex\">c &lt; 0<\/annotation><\/semantics><\/math>.<\/p><\/li>\n<li><p>Resuelva la ecuación con diferencias finitas atrasadas cuando <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>c<\/mi><mo>&lt;<\/mo><mn>0<\/mn><\/mrow><annotation encoding=\"application/x-tex\">c &lt; 0<\/annotation><\/semantics><\/math>.<\/p><\/li>\n<\/ol>\n<p>En el último nodo, los esquemas adelantado y centrado necesitan <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>u<\/mi><mrow><mi>N<\/mi><mo>+<\/mo><mn>1<\/mn><\/mrow><\/msub><annotation encoding=\"application/x-tex\">u_{N+1}<\/annotation><\/semantics><\/math>, que no existe (y el atrasado, con <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>c<\/mi><mo>&lt;<\/mo><mn>0<\/mn><\/mrow><annotation encoding=\"application/x-tex\">c &lt; 0<\/annotation><\/semantics><\/math>, necesita <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>u<\/mi><mrow><mo>−<\/mo><mn>1<\/mn><\/mrow><\/msub><annotation encoding=\"application/x-tex\">u_{-1}<\/annotation><\/semantics><\/math> en el primero): tómelo igual a 0, que es lo que hace la matriz recortada <code>Dx = Bx[1:-1, 1:-1]<\/code>, o use allí el esquema <em>upwind<\/em>.<\/p>\n<p>Represente en cada caso la solución numérica y la exacta, y explique los resultados de b) a e) con el criterio <em>upwind<\/em>: ¿de qué lado toma la información cada esquema, y de qué lado le llega a la solución?<\/p>", "dfc2-2": "<p class='enun-num'>Ejercicio 2<\/p><p><em>(Opcional)<\/em> Ejecute <code>EC_ONDA_0.py<\/code>, que es el apartado a) con CFL <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>=<\/mo><mn>0.5<\/mn><\/mrow><annotation encoding=\"application/x-tex\">= 0.5<\/annotation><\/semantics><\/math> hasta <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>t<\/mi><mo>=<\/mo><mn>1.5<\/mn><\/mrow><annotation encoding=\"application/x-tex\">t = 1.5<\/annotation><\/semantics><\/math>. ¿Qué pasa cuando la onda sale del dominio? ¿Se refleja en el contorno <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x<\/mi><mo>=<\/mo><mn>1<\/mn><\/mrow><annotation encoding=\"application/x-tex\">x = 1<\/annotation><\/semantics><\/math>? ¿Por qué no hace falta imponer ninguna condición en ese extremo?<\/p>", "t2-1": "<h3>Ejercicio 1. Mezcla en un estuario y en la atmósfera<\/h3>\n<p>Un flujo estratificado con cizalla es estable si el número de Richardson supera 1/4 en todo el flujo (criterio de Miles–Howard):<\/p>\n<p><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABKgAAABdCAYAAACBzV6cAAAAOnRFWHRTb2Z0d2FyZQBNYXRwbG90bGliIHZlcnNpb24zLjEwLjksIGh0dHBzOi8vbWF0cGxvdGxpYi5vcmcvJkbTWQAAAAlwSFlzAAAewgAAHsIBbtB1PgAAT49JREFUeJzt3XdYFFf3B/DvAoJIVQRisGNFUUERxQKixooRY8fEGo0asXeNUWOLsbwxscT6xoJiiRq7RhEEgdgriBG7ImooooDA+f3Bb+dl2YWdbewC5/M8+7i7c+fOmXWZM3vnzr0SIiIwxhhjjDHGGGOMMaYnRvoOgDHGGGOMMcYYY4yVbtxAxRhjjDHGGGOMMcb0ihuoGGOMMcYYY4wxxphecQMVY4wxxhhjjDHGGNMrbqBijDHGGGOMMcYYY3rFDVSMMcYYY4wxxhhjTK+4gYoxxhhjjDHGGGOM6RU3UDHGGGOMMcYYY4wxveIGKsYYYyyf0NBQVKhQAf3799d3KFpTEveJMcYYY4yVHNxAxRhjjOVz7tw5/Pvvv9izZ4/W6jx48CB8fHzg6uqKSpUqwdzcHKmpqVqrXxld7BNjjDHGGGPawg1UjDHGWD5EpPU63dzcMHnyZLi4uODly5dwdnaGlZWV1rdTEF3sU0lw5swZODo6om3btnj37p2+w2GMMcYYK7W4gYoZtMuXL6NPnz7o2rUrXFxcMHDgQNy7d0/fYTHGmMqqVasGPz8/ODs7AwB8fX31HBGLj49Hnz598OrVK4SFheHUqVP6DokxxhhjrNQy0XcAjBUkLi4Os2 sión superficial agua-aire σ<sub>s<\/sub> = 0.073 N/m. Aire: ρ = 1.2 kg/m³, ν = 1.5 × 10⁻⁵ m²/s.<\/p><\/div>", "t2-2": "<h3>Ejercicio 2. ¿Levanta el viento las olas por Kelvin–Helmholtz?<\/h3>\n<p>Aire (fluido 1, arriba) sopla sobre agua en reposo (fluido 2, abajo). Para una perturbación de la interfase de número de onda <em>k<\/em>, la teoría lineal de Kelvin–Helmholtz con tensión superficial da inestabilidad si<\/p>\n<p><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAzsAAABhCAYAAADx0r8jAAAAOnRFWHRTb2Z0d2FyZQBNYXRwbG90bGliIHZlcnNpb24zLjEwLjksIGh0dHBzOi8vbWF0cGxvdGxpYi5vcmcvJkbTWQAAAAlwSFlzAAAewgAAHsIBbtB1PgAAL9NJREFUeJzt3X1czff/P/DHqVBSalKuItO+lMsyQiJMCNPyyShqkfYhV62Pq7kYn5ixSWST0TRbaiIiG2MuqwmJkbaY0KjkKpUudHr9/uh33p+Ort7ndM55n3N63m+3bjt7X5zX8/0+b6/zfp336/V8iRhjDIQQQgghhBCiZXSEDoAQQgghhBBClIEaO4QQQgghhBCtRI0dQgghhBBCiFaixg4hhBBCCCFEK1FjhxBCCCGEEKKVqLFDCCGEEEII0UrU2CGEEEIIIYRoJWrsEEIIIYQQQrSSntABECKE1NRUfPHFFyguLsa9e/fQr18/rFmzBv/3f/8ndGikiVm3bl296xcvXowWLVqoKBpCiCr98ccfOHLkSJ3ru3TpghkzZqgwIkK0j4gxxoQOghBVun37NubPn4+YmBiYmJigsLAQ48aNw7Vr13D+/HnY29sLHSJpQkQiUb3rnz9/DhMTE9UEQwhRqcjISPj6+ta5fvjw4Th79qzqAiJEC1FjhzQ577//PkJCQmBtbc0tu3r1Kvr3748hQ4YgKSlJwOhIUyMSidC7d29s2rSp1vXvvfce9PToITwh2ujhw4e4ceNGrevGjRtHjR1CFIAaOzL46quvUFlZiSVLlggdCvn/fv/9d2zZsgU//vgjmjdvzmsfIyMjmJqa4sqVKzA3N+eWm5qa4sWLFygqKoKhoaGyQiZEikgkatQNDdVLqiVPnUOIPBpbNxBCqlCCAp5WrVqFa9euYfHixUKHQqoZPHgwXFxc4ObmhtLSUl77WFlZIS8vD8XFxVLLJeMiSkpKFB4nIcpA9ZLqyVPnEEIIEQ41dnjYu3cv4uLisHv37hr96z/77DM4ODigc+fOEIlE3F/nzp0xcOBA+Pv713g/Hx8fdOjQQWr7tm3bYuDAgXj8+LGqDkthhD4Hfn5+sLCwQGBgIK/tL168iPv376Nr167cspycHOTl5aFbt24wMzOTqXxChFBfvUSUS9Y6hxBCiIAYqdfdu3eZoaEhS0lJqXe73NxcBoABYP7+/g2+b2VlJfP392fNmjVjUVFRTCwWKypkwQh5Dl6+fMnMzc3ZkSNH5Np/+fLlDAA7cOCA3DEQIg8AbPjw4TLtw7deIsrT2DqHkIbIUzcQQmqiJzsNCAgIwNixYzFw4MB6t0tJSeFeu7u7N/i+IpEI77zzDqZMmQJPT0/o6Gj+RyHkOTAyMsKqVaswZ84clJWVybRvVlYWwsLC4Ofnh8mTJ8sdAyGqwrdeIsrTmDqHEEKI6mj+HbYSpaSk4JdffuHVH/7cuXMAAF1dXTg6OvJ6/8TERIwdO7ZRMaoToc/BzJkzUVxcjIiICN77lJeXw8vLCx4eHti5c6dC4iBEmWSpl la a la pared) y <em>v<\/em> (normal) en un punto de la capa límite turbulenta de un túnel de aire. Se dan 10 muestras:<\/p>\n<table style=\"width:100%;\">\n<colgroup>\n<col style=\"width: 13%\" />\n<col style=\"width: 8%\" />\n<col style=\"width: 8%\" />\n<col style=\"width: 8%\" />\n<col style=\"width: 8%\" />\n<col style=\"width: 8%\" />\n<col style=\"width: 8%\" />\n<col style=\"width: 8%\" />\n<col style=\"width: 8%\" />\n<col style=\"width: 8%\" />\n<col style=\"width: 8%\" />\n<\/colgroup>\n<tbody>\n<tr class=\"odd\">\n<td><strong>muestra<\/strong><\/td>\n<td><strong>1<\/strong><\/td>\n<td><strong>2<\/strong><\/td>\n<td><strong>3<\/strong><\/td>\n<td><strong>4<\/strong><\/td>\n<td><strong>5<\/strong><\/td>\n<td><strong>6<\/strong><\/td>\n<td><strong>7<\/strong><\/td>\n<td><strong>8<\/strong><\/td>\n<td><strong>9<\/strong><\/td>\n<td><strong>10<\/strong><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>u (m/s)<\/td>\n<td>12.1<\/td>\n<td>11.4<\/td>\n<td>13.0<\/td>\n<td>12.6<\/td>\n<td>10.9<\/td>\n<td>11.8<\/td>\n<td>12.9<\/td>\n<td>11.2<\/td>\n<td>12.4<\/td>\n<td>11.7<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>v (m/s)<\/td>\n<td>−0.1<\/td>\n<td>0.5<\/td>\n<td>−0.2<\/td>\n<td>−0.4<\/td>\n<td>0.3<\/td>\n<td>0.3<\/td>\n<td>−0.6<\/td>\n<td>0.1<\/td>\n<td>0.2<\/td>\n<td>−0.1<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p><strong>a)<\/strong> Calcule las velocidades medias, las fluctuaciones y los valores medios de <em>u&#39;<\/em>², <em>v&#39;<\/em>² y <em>u&#39;v&#39;<\/em>. Calcule la intensidad de turbulencia y el coeficiente de correlación entre <em>u&#39;<\/em> y <em>v&#39;<\/em>.<\/p>\n<p><strong>b)<\/strong> Calcule el esfuerzo de Reynolds τ<sub>turb<\/sub> = −ρ<em>u&#39;v&#39;<\/em> (media) y compárelo con el esfuerzo viscoso, si en ese punto d<em>U<\/em>/d<em>y<\/em> = 40 s⁻¹. ¿Por qué el signo de <em>u&#39;v&#39;<\/em> es negativo?<\/p>\n<p><strong>c)<\/strong> Con la hipótesis de Boussinesq, calcule la viscosidad turbulenta ν<sub>T<\/sub> y la longitud de mezcla. Estime la energía cinética turbulenta <em>k<\/em> suponiendo <em>w&#39;<\/em>² ≈ <em>v&#39;<\/em>².<\/p>\n<p><strong>d)<\/strong> ¿Son suficientes 10 muestras para dar estos valores con confianza? (Relacione con el ejemplo 9 de los apuntes.)<\/p>\n<\/blockquote>\n<div class='datos'><p><strong>Datos generales:<\/strong> g = 9.81 m/s². Agua: ρ = 1000 kg/m³, ν = 1.0 × 10⁻⁶ m²/s, tensión superficial agua-aire σ<sub>s<\/sub> = 0.073 N/m. Aire: ρ = 1.2 kg/m³, ν = 1.5 × 10⁻⁵ m²/s.<\/p><\/div>", "t2-6": "<h3>Ejercicio 6. Escalas de la turbulencia en un tanque agitado<\/h3>\n<p>Un agitador transmite 1 kW a 1 m³ de agua en régimen estacionario. Las escalas de Kolmogorov son<\/p>\n<p><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAwcAAABKCAYAAADudihgAAAAOnRFWHRTb2Z0d2FyZQBNYXRwbG90bGliIHZlcnNpb24zLjEwLjksIGh0dHBzOi8vbWF0cGxvdGxpYi5vcmcvJkbTWQAAAAlwSFlzAAAewgAAHsIBbtB1PgAAKDRJREFUeJzt3WdUVNfXBvBnEAEVRCGCioBRLMTeIirWYPlbYowNRWPXYMEYe4uoiUajqFheG3ZssWAntqAS7AoiioIdFUXERnWY/X4gczMoZfqdgf1bi7WGmVP2UPbcc++550iIiMAYY4wxxhgr9EzEDoAxxhhjjDFmGHhwwBhjjDHGGAPAgwPGGGOMMcbYv3hwwBhjjDHGGAPAgwPGGGOMMcbYv3hwwBhjjDHGGAPAgwPGGGOMMcbYv3hwwBhjjDHGGAPAgwO9e/z4MV68eKH1dqOjozFy5EiMGTMG/fv3R6dOnXD27Fml69+4cQMlS5bEiRMntB4bY4wxxhgzDjw40KNz586hVq1aCAkJ0Wq7T58+xYQJE7Bo0SIsX74cW7duhbOzMzw8PBAcHKxUG7Vr18akSZPQpUsXBAUFaTU+xhhjjDFmHHhwoCfBwcFo3749RowYgd69e2u17T179uDIkSNYvXq18FzHjh3x8eNHrFq1Sul2ZsyYAU9PT/Ts2dNoBgivX7/Gnj17xA6DMWaEOH8wxoyJvnIWDw70IDQ0FF27dkW7du3w+++/a739mjVromTJkihdurTw3Pv37wEAJUqUUKmtVatWwdnZGf3790dUVJRW49SFdevWwd/fX+wwGGNGiPMHY8yY6Ctn8eBAx548eYLu3bujdOnS2LhxI0xMtP8j/+abb/D27VsMGjRIeO769esAgAEDBqjUVvHixbFx40akpKSga9eueP36tVZj1bbAwED06dNH7DAYY0aI8wdjzJjoK2fx4ECH0tPT0a1bN7x8+RJLly7NdmZflx49eoRNmzZh3rx56NChg8r1mzdvjsGDB+PevXsYN26c1uNbunQphg8frnE7kZGRiI6ORq9evZSus2LFClSvXl3jvhlj4tBX/sjMzMSaNWvg7u6OunXrwtHREW5ubliyZAk+fPigcf+MscLBGI95eHCgQwsXLsTVq1fRrl07eHp66ry/48ePw8fHB507d8aPP/6IiRMnqt3WzJkzYWZmhi1btiA0NFRrMe7fvx+TJ09GRkaGxm0FBgaiQ4cOsLW1Var8gwcPMGXKFKSlpWncN2NM//SVP1JSUtC+fXvcunULwc diseñar con margen.<\/p><\/li>\n<\/ul>\n<p>2. Contexto<\/p>\n<p>En el moldeo por inyección, el plástico fundido se enfría dentro del molde, y la refrigeración suele ocupar la mayor parte del tiempo de ciclo. El molde tiene canales taladrados por los que un termorregulador hace circular agua a una temperatura de consigna, que depende del plástico: entre 20 °C (polietileno, polipropileno) y 70 °C (algunas poliamidas).<\/p>\n<p>Para que el tiempo de ciclo sea el previsto, el coeficiente de convección en los canales debe ser al menos h = 4000 W/m²K para cualquier temperatura de consigna. Hay que elegir el caudal por circuito.<\/p>\n<p><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABEsAAAIUCAYAAADi0KJjAAAAOnRFWHRTb2Z0d2FyZQBNYXRwbG90bGliIHZlcnNpb24zLjEwLjksIGh0dHBzOi8vbWF0cGxvdGxpYi5vcmcvJkbTWQAAAAlwSFlzAAAewgAAHsIBbtB1PgAAuElJREFUeJzs3Xd0FNX7x/H3pvcQSEKooXeQ3jtIkyZdUBBFmqLiF0V/Coi9oGIBQUVBLEgTKdJ77yC9JoSeAOm97O+PkHVDdkMSEhLw8zon54SZe2eemd2EzLP3PtdgNBqNiIiIiIiIiIgIADb5HYCIiIiIiIiISEGiZImIiIiIiIiIiBklS0REREREREREzChZIiIiIiIiIiJiRskSEREREREREREzSpaIiIiIiIiIiJhRskRERERERERExIySJSIiIiIiIiIiZpQsERERERERERExo2SJiIiIiIiIiIgZJUtERERERERERMwoWSIiIiIiIiIiYkbJEhERERERERERM0qWiIiIiIiIiIiYUbJERERERERERMSMkiUiIiIiIiIiImaULBERERERERERMaNkiYiIiIiIiIiIGSVLRERERERERETMKFkiIiIiIiIiImJGyRIRERERERERETNKloiIiIiIiIiImFGyRERERERERETEjJIlIiIiIiIiIiJmlCwRERERERERETGjZImIiIiIiIiIiBklS0REREREREREzChZIiIiIiIiIiJiRskSkfvo6aefxmAwUKZMmfwO5YHQunVrDAYDrVu3zpPjBwYGYjAYMBgMzJ49O0/OUdC8/fbbpmu+F3n92uREq1atMBgMTJkyJb9DeSg89thjGAwGJk2alN+hiIiIiNx3SpaIZNGmTZtMD5l3frm4uODv70/Pnj357bffSEpKyu9wRf5TFixYwJYtW/Dx8WHUqFH5Hc5DYcKECQBMmTKFS5cu5XM0IiIiIveXkiUiuSA2NpagoCD++usvBg0aRNOmTbl27Vp+hyXyn5CSksLEiRMB+N///oerq2s+R/RwaNy4MY8++igxMTF88MEH+R2OiIiIyH2lZIlIDowaNYojR46Yvnbu3MnXX39tml6zd+9eevTogdFozN9ARf4DFi5cyMmTJ3F2dmb06NH5Hc5D5X//+x8As2bN4urVq/kcjYiIiMj9o2SJSA74+vpSo0YN01fjxo154YUXOHDgABUqVABgz549LF++PJ8jFXn4ffnllwB0794dd3f3fI7m4dK+fXt8fX1JSEhg5syZ+R2OiIiIyH2jZIlILvLy8uKNN94w/XvVqlX5GI3Iw+/kyZPs2LEDgEGDBuVz atura nominal de 45 °C y el coeficiente de convección en esas condiciones. ¿Cumple el requisito?<\/p>\n<p>Parte 2 · Barrido en temperatura (35 min)<\/p>\n<ol type=\"1\">\n<li><p>Completa la función estado(Q, T) del cuaderno, que devuelve Re, el régimen y las cotas de h y Δp.<\/p><\/li>\n<li><p>Con el caudal de la parte 1, representa h(T) entre 15 y 75 °C. ¿Por debajo de qué temperatura deja el flujo de ser claramente turbulento? ¿Qué le pasa a h?<\/p><\/li>\n<li><p>Con Q = 1.0 L/min, representa Δp(T) y compárala con la que se obtendría suponiendo siempre flujo laminar. Explica por qué Δp puede aumentar al calentar el agua.<\/p><\/li>\n<\/ol>\n<p>Parte 3 · Rediseño (30 min)<\/p>\n<ol type=\"1\">\n<li><p>Busca el menor caudal, múltiplo de 0.5 L/min, que garantice h ≥ 4000 W/m²K en todo el rango 20–70 °C.<\/p><\/li>\n<li><p>Comprueba que no supera el caudal máximo del termorregulador y calcula el caudal total y la potencia de bombeo en el caso más desfavorable.<\/p><\/li>\n<li><p>¿Dejarías margen? ¿Cuánto y por qué?<\/p><\/li>\n<\/ol>\n<p>Parte 4 · Sensibilidad y validez de las hipótesis (15 min)<\/p>\n<ol type=\"1\">\n<li><p>Nu = 3.66 supone flujo térmicamente desarrollado. Calcula la longitud de entrada térmica para el diseño de la parte 1 a 20 °C y compárala con L. Con la correlación de Sieder–Tate, ¿cambia la conclusión?<\/p><\/li>\n<\/ol>\n<p><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABSYAAABpCAYAAAAnZP1VAAAAOnRFWHRTb2Z0d2FyZQBNYXRwbG90bGliIHZlcnNpb24zLjEwLjksIGh0dHBzOi8vbWF0cGxvdGxpYi5vcmcvJkbTWQAAAAlwSFlzAAAuIwAALiMBeKU/dgAATQZJREFUeJztnWe4JEXVgN8Du7CBrCxhCUuWpOQMIohkAQHJSQwgfAhiwAAiRgQxExQBUclRgkgWZAHJWfKSFxBYYBPssuf7cWq8fftWz3RPd8/ccN7nqeferumuOtXT01196gRRVRzHcRzHcRzHcRzHcRzHcTrJbN0WwHEcx3Ecx3Ecx3Ecx3GcoYcrJh3HcRzHcRzHcRzHcRzH6TiumHQcx3Ecx3Ecx3Ecx3Ecp+O4YtJxHMdxHMdxHMdxHMdxnI7jiknHcRzHcRzHcRzHcRzHcTqOKyYdx3Ecx3Ecx3Ecx3Ecx+k4rph0HMdxHMdxHMdxHMdxHKfjuGLScRzHcRzHcRzHcRzHcZyO44pJx3Ecx3Ecx3Ecx3Ecx3E6jismHcdxHMdxHMdxHMdxHMfpOK6YdBzHcRzHcRzHcRynFCLyZRG5
